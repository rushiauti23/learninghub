<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DVA-C02 Study Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky topic rail on the left, one long column of topic sections on the right. Each topic = animated diagram panel + plain-language detail. Domain colour tags every section. */
:root{
  --bg:#eceff3; --panel:#ffffff; --panel2:#f4f6f9; --ink:#131a24; --muted:#546174; --line:#d3dae3;
  --d0:#2f5fd0; --d1:#0b7a6f; --d2:#c0304f; --d3:#9a5505; --d4:#6b46c1;
  --k-client:#0e7490; --k-svc:#15803d; --k-store:#6d28d9; --k-queue:#c2410c; --k-sec:#be123c; --k-ext:#475569; --k-fail:#dc2626; --ok:#15803d;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --c:var(--d0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --panel:#151c26; --panel2:#1a2330; --ink:#e7ecf3; --muted:#93a1b4; --line:#263142;
  --d0:#7ba3ff; --d1:#3fd3c2; --d2:#ff7f97; --d3:#f4b04d; --d4:#b79bff;
  --k-client:#38bdf8; --k-svc:#4ade80; --k-store:#a78bfa; --k-queue:#fb923c; --k-sec:#fb7185; --k-ext:#94a3b8; --k-fail:#f87171; --ok:#4ade80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#151c26; --panel2:#1a2330; --ink:#e7ecf3; --muted:#93a1b4; --line:#263142;
  --d0:#7ba3ff; --d1:#3fd3c2; --d2:#ff7f97; --d3:#f4b04d; --d4:#b79bff;
  --k-client:#38bdf8; --k-svc:#4ade80; --k-store:#a78bfa; --k-queue:#fb923c; --k-sec:#fb7185; --k-ext:#94a3b8; --k-fail:#f87171; --ok:#4ade80; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);padding-inline:16px;padding-block:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.1}
p{margin:0}
code{font:500 .86em var(--f-mono);background:color-mix(in srgb,var(--c) 11%,var(--panel2));padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:4px}
.progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:30;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--c);transition:background .3s}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.topbar b{font:800 17px var(--f-display);letter-spacing:-.01em}
.topbar .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font:500 12px var(--f-mono)}
.pill:hover{border-color:var(--c)}
.shell{max-width:1240px;margin-inline:auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-block:28px 80px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-right:6px;font-size:13px}
.rail h4{margin:16px 0 4px;font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.rail h4:first-child{margin-top:0}
.rail a{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;color:var(--ink);text-decoration:none;line-height:1.3}
.rail a:hover{background:var(--panel2)}
.rail a.on{background:color-mix(in srgb,var(--c) 14%,var(--panel));font-weight:600}
.rail a i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c);flex:none}
.rail a.got i{background:var(--c)}
main{min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--d0);white-space:nowrap}
.hero p.lead{margin-top:14px;color:var(--muted);max-width:52ch}
.warn{margin-top:16px;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--d3) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--d3) 40%,var(--line));font-size:13.5px;max-width:60ch}
.weights{display:grid;gap:10px}
.w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.w .bar{grid-column:1/-1;height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.w .bar i{display:block;height:100%;width:0;background:var(--wc);border-radius:6px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.w span:last-child{font:600 12px var(--f-mono)}
.facts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:22px}
.fg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fg small{display:block;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fg b{font:700 15px var(--f-display);display:block;margin-top:2px;overflow-wrap:anywhere}
.dom{margin-top:56px;padding:22px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 22px;align-items:center}
.dom .pc{font:800 clamp(38px,6vw,56px)/1 var(--f-display);color:var(--c);grid-row:span 2}
.dom h2{font-size:clamp(22px,3vw,30px)}
.dom p{color:var(--muted);max-width:70ch}
.dom .prog{grid-column:1/-1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,var(--panel));overflow:hidden}
.dom .prog i{display:block;height:100%;width:0;background:var(--c);transition:width .5s}
.topic{margin-top:34px;padding-top:30px;border-top:1px solid var(--line)}
.topic .eyebrow{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--c);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topic h3{font-size:clamp(24px,3.2vw,34px);font-weight:800;margin-top:6px}
.topic .tl{margin-top:8px;color:var(--muted);max-width:70ch;font-size:16px}
.panel{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2);font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.panel .ph .sp{flex:1}
.panel .pb{padding:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;font:500 12px var(--f-mono);text-transform:none;letter-spacing:0}
.btn:hover{border-color:var(--c);color:var(--c)}
.btn[aria-pressed=true],.btn.on{background:var(--c);color:var(--panel);border-color:var(--c)}
.dgwrap{overflow-x:auto}
svg.dg{display:block;width:100%;min-width:560px;height:auto}
.node rect{fill:color-mix(in srgb,var(--kc) 13%,var(--panel));stroke:var(--kc);stroke-width:1.5;transition:stroke-width .2s,fill .2s}
.node text{fill:var(--ink);font:600 12px var(--f-body);text-anchor:middle}
.node text.sub{font:400 9.5px var(--f-mono);fill:var(--muted)}
.node.hit rect{stroke-width:3.5;fill:color-mix(in srgb,var(--kc) 28%,var(--panel))}
.k-client{--kc:var(--k-client)}.k-svc{--kc:var(--k-svc)}.k-store{--kc:var(--k-store)}.k-queue{--kc:var(--k-queue)}.k-sec{--kc:var(--k-sec)}.k-ext{--kc:var(--k-ext)}.k-fail{--kc:var(--k-fail)}
.edge line{stroke:var(--muted);stroke-width:2;transition:opacity .3s}
.edge.dash line{stroke-dasharray:6 5}
.edge.bad line{stroke:var(--k-fail)}
.edge.done{opacity:.55}.edge.off{opacity:0}
.edge text{font:600 10.5px var(--f-mono);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.edge .pk{fill:var(--c)}.edge.bad .pk{fill:var(--k-fail)}
.edge .xm{fill:var(--k-fail);font:700 16px var(--f-body);stroke:none}
.ah{fill:var(--muted)}
.cap{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line);min-height:68px}
.cap .n{flex:none;font:700 12px var(--f-mono);color:var(--c);padding-top:2px;min-width:3.4em}
.cap p{max-width:78ch;font-size:14.5px}
.dots{display:flex;gap:4px}
.dots button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:600 11px var(--f-mono);padding:0}
.dots button.on{background:var(--c);border-color:var(--c);color:var(--panel)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;margin-top:22px;align-items:start}
.how p+p{margin-top:12px}
.how p{max-width:68ch}
.side{display:grid;gap:12px}
.chips{display:grid;gap:6px}
.chip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px}
.chip span{color:var(--muted)}
.chip b{font:600 12.5px var(--f-mono);text-align:right;overflow-wrap:anywhere}
.trap{padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--k-fail) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--k-fail) 35%,var(--line));font-size:13.5px}
.trap b{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--k-fail);margin-bottom:3px}
.got{display:inline-flex;gap:8px;align-items:center;font-size:13px;margin-top:6px;cursor:pointer;user-select:none}
.got input{accent-color:var(--c);width:16px;height:16px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.reveal.in,.no-js .reveal{opacity:1;transform:none}
/* widgets */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:grid;gap:3px;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.fld input,.fld select{font:500 14px var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);width:100%;min-width:90px;text-transform:none;letter-spacing:0}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.res div{padding:10px 12px;background:var(--panel2);border-radius:8px;font-size:13.5px}
.res b{display:block;font:800 26px var(--f-display);color:var(--c)}
.res small{display:block;font:400 12px var(--f-mono);color:var(--muted);margin-top:2px}
.split{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px}
.list{display:grid;gap:5px;align-content:start}
.list button{text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;line-height:1.3}
.list button:hover{border-color:var(--c)}
.list button.on{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:var(--c);font-weight:600}
.detail{padding:14px;border-radius:10px;background:var(--panel2);animation:fade .35s}
.detail h4{margin:0 0 4px;font:700 18px var(--f-display)}
.detail .k{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--c);margin-top:10px;display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fleet{display:grid;gap:8px}
.fl{display:grid;grid-template-columns:76px repeat(6,minmax(0,1fr));gap:6px;align-items:center;font:500 11px var(--f-mono);color:var(--muted)}
.sq{aspect-ratio:1.6;max-height:44px;border-radius:6px;border:1.5px solid var(--k-ext);background:color-mix(in srgb,var(--k-ext) 30%,var(--panel));transition:all .5s}
.sq.n{border-color:var(--c);background:color-mix(in srgb,var(--c) 55%,var(--panel))}
.sq.x{border-color:var(--k-fail);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--k-fail) 35%,var(--panel)) 0 6px,var(--panel) 6px 12px)}
.sq._{border-style:dashed;background:transparent;opacity:.45}
.sq.s{background:transparent;border-style:dashed}
.tbar{height:16px;border-radius:8px;background:color-mix(in srgb,var(--k-ext) 30%,var(--panel));overflow:hidden;border:1px solid var(--line);position:relative}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);transition:width .6s}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px}
.tstats div{font-size:12.5px;padding:7px 9px;background:var(--panel2);border-radius:8px}
.tstats small{display:block;font:500 10px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13.5px;min-height:2.6em}
.hooks{display:flex;gap:6px;flex-wrap:wrap}
.hooks span{padding:6px 10px;border:1px solid var(--line);border-radius:999px;font:500 12px var(--f-mono);background:var(--panel);transition:all .25s}
.hooks span.on{background:var(--c);color:var(--panel);border-color:var(--c);transform:translateY(-2px)}
.hooks span.past{border-color:var(--c);color:var(--c)}
.chain{display:grid;gap:6px;margin:10px 0}
.chain div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);transition:all .3s;font-size:13.5px}
.chain div.win{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.chain div.skip{opacity:.4}
.chain div.scan{border-color:var(--c)}
.chain em{font:normal 600 11px var(--f-mono);color:var(--muted)}
.bo{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.bo i{flex:1;background:var(--c);border-radius:4px 4px 0 0;min-width:0;transition:height .5s;position:relative}
.bo i::after{content:attr(data-l);position:absolute;top:-17px;left:0;right:0;text-align:center;font:500 10px var(--f-mono);color:var(--muted)}
.switches{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px}
.sw{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;cursor:pointer}
.sw input{accent-color:var(--c);width:16px;height:16px}
.verdict{margin-top:10px;padding:12px 14px;border-radius:10px;font-weight:600;border:1px solid}
.verdict.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border-color:var(--ok);color:var(--ok)}
.verdict.no{background:color-mix(in srgb,var(--k-fail) 10%,var(--panel));border-color:var(--k-fail);color:var(--k-fail)}
.trace{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;font:400 12.5px var(--f-mono);color:var(--muted)}
.trace li::before{content:"› ";color:var(--c)}
.wf{display:grid;gap:6px;font:500 11.5px var(--f-mono)}
.wf .r{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;cursor:pointer;border-radius:6px;padding:2px}
.wf .r:hover,.wf .r.on{background:var(--panel2)}
.wf .t{height:16px;position:relative;background:repeating-linear-gradient(90deg,transparent 0 24.6%,var(--line) 24.6% 25%);border-radius:3px}
.wf .t i{position:absolute;top:2px;bottom:2px;border-radius:3px;background:var(--c);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.wf .t i.slow{background:var(--k-fail)}
.wf .r.sub .lb{padding-left:14px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
td.v{font-family:var(--f-mono);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
tr.hl td{background:color-mix(in srgb,var(--c) 9%,var(--panel))}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input[type=search]{flex:1;min-width:180px;font:14px var(--f-body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.fc{display:flex;gap:6px;flex-wrap:wrap}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.q h4{margin:0 0 8px;font:600 15px/1.45 var(--f-body)}
.q h4 span{font:700 12px var(--f-mono);color:var(--c);margin-right:8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;display:flex;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:14px}
.opts button b{font:600 12px var(--f-mono);color:var(--muted);padding-top:2px}
.opts button:hover:not(:disabled){border-color:var(--c)}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--panel))}
.opts button.wrong{border-color:var(--k-fail);background:color-mix(in srgb,var(--k-fail) 11%,var(--panel))}
.q .ex{margin-top:10px;font-size:13.5px;color:var(--muted);animation:fade .3s}
.score{font:600 13px var(--f-mono)}
.kw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.kw>div{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.kw>div:nth-child(odd){font-family:var(--f-mono);font-size:12.5px;background:var(--panel2)}
.kw.drill>div:nth-child(even):not(.shown){filter:blur(6px);cursor:pointer;user-select:none}
.tact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:14px}
.tact div{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:14px}
.ck{display:grid;gap:6px;margin-top:12px}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.ck input{accent-color:var(--c);width:17px;height:17px;margin-top:2px}
.ck label:has(input:checked){text-decoration:line-through;color:var(--muted)}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:6px 0;margin-inline:-16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
  .rail h4{display:none}
  .rail a{flex:none;border:1px solid var(--line);background:var(--panel)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .cols{grid-template-columns:minmax(0,1fr)}
}

dpoint", "NAT gateway in a public subnet, or VPC endpoints"], ["SQS messages processed twice", "Visibility timeout shorter than processing time", "Increase visibility timeout; make consumers idempotent"], ["API Gateway 504", "Integration exceeded 29 s", "Make it async (SQS, Step Functions) or speed up backend"], ["API Gateway 502", "Lambda proxy returned malformed response", "Return statusCode, headers, body (string)"], ["DynamoDB throttling on one key", "Hot partition", "Better partition key, write sharding, DAX for reads"], ["CodeDeploy fails on EC2", "Agent missing or instance role lacks S3 access", "Install agent; fix instance profile"]],QS=[{"n": 1, "d": 1, "q": "A Lambda function processes SQS messages in batches of 10. When one message fails, all 10 are retried. How do you retry only the failed message?", "o": ["Reduce batch size to 1", "Enable ReportBatchItemFailures and return the failed message IDs", "Add a DLQ", "Increase visibility timeout"], "a": 1, "x": "Partial batch responses report only failed items. A works but kills throughput; C and D don't stop the re-processing."}, {"n": 2, "d": 1, "q": "A DynamoDB table needs 80 strongly consistent reads per second of 6 KB items. How many RCUs?", "o": ["80", "120", "160", "240"], "a": 2, "x": "6 KB rounds up to 8 KB = 2 RCUs per read × 80 = 160. Eventually consistent would be 80."}, {"n": 3, "d": 1, "q": "You need to query a table by an attribute that isn't the key, and the table already exists. What do you add?", "o": ["LSI", "GSI", "Scan with filter", "DAX"], "a": 1, "x": "LSIs can only be created with the table. Scan works but is inefficient."}, {"n": 4, "d": 1, "q": "Two users update the same DynamoDB item concurrently and one overwrites the other. Fix?", "o": ["Strongly consistent reads", "Conditional writes on a version attribute", "DynamoDB Streams", "Increase WCUs"], "a": 1, "x": "Optimistic locking: the write succeeds only if the version hasn't changed."}, {"n": 5, "d": 1, "q": "An order system must process messages exactly once and in order per customer. Which?", "o": ["SQS Standard", "SQS FIFO with customer ID as message group ID", "SNS", "Kinesis with one shard"], "a": 1, "x": "Message group ID gives per-customer ordering while allowing parallelism across customers."}, {"n": 6, "d": 1, "q": "A Java Lambda has slow first invocations after idle periods. Lowest-effort fix for latency?", "o": ["Increase timeout", "Enable SnapStart or provisioned concurrency", "Move to a container image", "Add a layer"], "a": 1, "x": "Both target cold starts. Timeout doesn't affect start time."}, {"n": 7, "d": 1, "q": "A Lambda function makes a DB connection inside the handler and runs out of connections under load. Best fix?", "o": ["Increase memory", "Open the connection outside the handler and use RDS Proxy", "Reserved concurrency of 1", "Use DynamoDB"], "a": 1, "x": "Reuse across invocations plus pooling at the proxy."}, {"n": 8, "d": 1, "q": "One S3 upload must trigger three independent processing systems. Best design?", "o": ["Three S3 event notifications to the same event type", "S3 → SNS topic → three SQS queues", "S3 → one Lambda calling three services", "Polling"], "a": 1, "x": "Classic fan-out; S3 can't send the same event type for overlapping prefixes to multiple destinations (EventBridge is also valid if offered)."}, {"n": 9, "d": 1, "q": "Users upload files directly from a browser to a private bucket without AWS credentials. How?", "o": ["Make the bucket public", "Backend generates presigned PUT URLs", "Share an IAM user's keys", "Bucket ACL"], "a": 1, "x": "Time-limited and scoped; configure CORS too."}, {"n": 10, "d": 1, "q": "A consumer receives empty SQS responses most of the time, increasing cost. Fix?", "o": ["Short polling", "Long polling with WaitTimeSeconds=20", "Delay queue", "FIFO queue"], "a": 1, "x": ""}, {"n": 11, "d": 2, "q": "An application on EC2 needs to read from S3. Most secure way to provide credentials?", "o": ["Access keys in application.properties", "Environment variables with keys", "IAM role via instance profile", "Keys in Secrets Manager"], "a": 2, "x": "Temporary, auto-rotated credentials through the default credential chain."}, {"n": 12, "d": 2, "q": "You must encrypt a 2 MB file with KMS. What do you call?", "o": ["Encrypt", "GenerateDataKey, encrypt locally, store the encrypted data key with the file", "CreateKey", "ReEncrypt"], "a": 1, "x": "Envelope encryption; Encrypt handles only up to 4 KB."}, {"n": 13, "d": 2, "q": "Database credentials must rotate automatically every 30 days with minimal code. Which service?", "o": ["Parameter Store SecureString", "Secrets Manager", "KMS", "Lambda env vars"], "a": 1, "x": "Built-in rotation; Parameter Store has no native rotation."}, {"n": 14, "d": 2, "q": "A mobile app's signed-in users must upload directly to their own S3 prefix. Which combination?", "o": ["User pool only", "User pool + identity pool with IAM policy using ${cognito-identity.amazonaws.com:sub}", "IAM users per customer", "API keys"], "a": 1, "x": "Identity pools vend temporary credentials; the policy variable scopes the prefix."}, {"n": 15, "d": 2, "q": "An API must validate custom bearer tokens issued by a third-party IdP and pass user context to the backend. Which?", "o": ["IAM auth", "Lambda (token) authorizer", "API key", "Resource policy"], "a": 1, "x": "(If the IdP is OIDC and the API is an HTTP API, a JWT authorizer also fits.)"}, {"n": 16, "d": 2, "q": "Lambda in account A must write to a DynamoDB table in account B. Best approach?", "o": ["Copy keys from account B", "Role in B trusting A's Lambda role; Lambda calls sts:AssumeRole", "Make the table public", "VPC peering"], "a": 1, "x": "(DynamoDB also supports resource-based policies now; either is acceptable if offered.)"}, {"n": 17, "d": 2, "q": "A requirement says all S3 uploads must use HTTPS. How?", "o": ["SSE-S3", "Bucket policy denying requests where aws:SecureTransport is false", "Enable versioning", "KMS key policy"], "a": {id:'lambda-invoke',d:1,title:'Lambda: invocation types',lead:'How a function is called decides who handles errors and retries.',
 diagram:{h:250,nodes:[['apigw','API Gateway',90,50,'svc','sync caller'],['s3','S3 upload',90,125,'store','async source'],['sqs','SQS queue',90,200,'queue','poll-based'],['fn','Lambda',320,125,'svc','your function'],['caller','Client',550,50,'client'],['dlq','DLQ / on-failure',550,150,'fail','destination']],
  steps:[
   {cap:'Synchronous: API Gateway calls Lambda and waits. If the function fails, the error goes straight back to the caller, and the caller decides whether to retry.',edges:[['apigw','fn','invoke and wait'],['fn','caller','error returned','x']]},
   {cap:'Asynchronous: S3 hands the event to Lambda and moves on. Lambda retries a failed run twice, then sends the event to a DLQ or an on-failure destination.',edges:[['s3','fn','event','dash'],['fn','dlq','after 2 retries']]},
   {cap:'Poll-based: Lambda itself reads from SQS (or Kinesis, DynamoDB Streams) through an event source mapping and invokes your function with a batch.',edges:[['sqs','fn','poll, then batch']]}]},
 body:[
  `<p>Lambda has three invocation models, and the exam tests which one owns the retry. In a <b>synchronous</b> call (API Gateway, ALB, the SDK with <code>RequestResponse</code>) the caller waits for the result. Lambda does not retry for you, so the error comes back to whoever called.</p>`,
  `<p>In an <b>asynchronous</b> call (S3, SNS, EventBridge) Lambda queues the event, acknowledges the sender and runs the function later. A failed run is retried <b>twice</b>. After that the event lands in a dead-letter queue (SQS or SNS) or an on-failure <b>destination</b>. Destinations can also fire on success and include richer context such as the error and the original payload.</p>`,
  `<p><b>Poll-based</b> sources are different: an event source mapping runs inside the Lambda service, reads from SQS, Kinesis or DynamoDB Streams, and invokes your function with a batch. For SQS, turn on <code>ReportBatchItemFailures</code> and return the IDs of the failed messages so only those are retried. Set the queue visibility timeout to at least six times the function timeout.</p>`,
  `<p>Concurrency has two knobs. <b>Reserved</b> concurrency both guarantees capacity and caps the function. <b>Provisioned</b> concurrency keeps execution environments initialised to remove cold starts. A throttled synchronous call returns HTTP 429.</p>`],
 facts:[['Async retries','2'],['Throttled call','429 TooManyRequests'],['SQS visibility timeout','≥ 6× function timeout'],['Destinations','async invokes only']],
 trap:'A DLQ only catches failures. If the question asks for success notifications or richer failure context, the answer is destinations.'},

{id:'lambda-perf',d:1,title:'Lambda: cold starts, config and packaging',lead:'Memory buys CPU, init code runs once, and aliases make safe releases possible.',
 diagram:{h:240,nodes:[['req','Request',70,125,'client'],['init','Init phase',260,45,'queue','runtime + static code'],['h','Handler',450,125,'svc','your logic'],['conn','Clients, DB conn',260,205,'store','created outside handler']],
  steps:[
   {cap:'Cold start: no warm environment exists, so Lambda downloads the code, starts the runtime and runs your static initialisation before the handler.',edges:[['req','init','cold start'],['init','h','then run']]},
   {cap:'Warm invoke: the same environment is reused. The init phase is skipped, and anything created outside the handler is still there.',edges:[['req','h','warm: no init'],['h','conn','reuse','dash']]}]},
 body:[
  `<p>A <b>cold start</b> happens when Lambda has to build a new execution environment. For Java it hurts most, because the JVM and class loading dominate. The remedies the exam wants are <b>SnapStart</b> (restores a snapshot of an initialised environment), <b>provisioned concurrency</b>, and a light init phase.</p>`,
  `<p>Create SDK clients, database connections and parsed config <b>outside the handler</b>. They are built once per environment and reused by later invocations. Opening a connection inside the handler multiplies connections under load, which is why <b>RDS Proxy</b> shows up in so many answers.</p>`,
  `<p><b>Memory</b> is the only performance dial: CPU scales with it. A CPU-bound function that is slow at 512 MB often finishes sooner and costs about the same at a higher setting. Packaging is a zip (50 MB upload, 250 MB unzipped) or a container image up to 10 GB. <b>Layers</b> share libraries (five per function).</p>`,
  `<p><b>Versions</b> are immutable snapshots. An <b>alias</b> points to a version and can split traffic by weight, which is how CodeDeploy runs canary and linear Lambda releases. A function in a VPC needs a NAT gateway or VPC endpoints to reach anything outside it.</p>`],
 facts:[['Memory','128 – 10,240 MB'],['Timeout max','900 s'],['/tmp','512 – 10,240 MB'],['Env vars total','4 KB (KMS encrypted)'],['Zip / unzipped','50 MB / 250 MB'],['Container image','10 GB'],['Layers','5 per function']],
 trap:'Raising the timeout never fixes slow starts. CPU-bound and slow? Raise memory.'},

{id:'ddb-keys',d:1,title:'DynamoDB: keys, indexes and capacity',lead:'Pick keys for even access, add a GSI for new query shapes, and do the RCU maths with rounding.',
 diagram:{h:230,nodes:[['app','Application',70,115,'client'],['tbl','Table',300,45,'store','PK + SK'],['gsi','GSI',300,185,'store','alt keys, own capacity']],
  steps:[
   {cap:'Writes go to the base table.',edges:[['app','tbl','PutItem']]},
   {cap:'DynamoDB copies the item to each GSI asynchronously. That is why GSI reads are eventually consistent only.',edges:[['tbl','gsi','async copy','dash']]},
   {cap:'A new access pattern on a non-key attribute queries the GSI. It can be added to an existing table, unlike an LSI.',edges:[['app','gsi','Query by other key']]}]},
 widgets:[{type:'rcu'}],
 body:[
  `<p>The primary key is a <b>partition key</b> alone or a partition key plus <b>sort key</b>. Choose a high-cardinality partition key so traffic spreads across partitions. One popular key gives a hot partition and throttling even when the table has capacity to spare.</p>`,
  `<p>An <b>LSI</b> shares the table's partition key with a different sort key, must be created with the table, and can do strongly consistent reads. A <b>GSI</b> can use any keys, can be added at any time, is eventually consistent, and has its own capacity.</p>`,
  `<p>Capacity is a rounding exercise. One <b>RCU</b> is one strongly consistent read per second of up to 4 KB, or two eventually consistent reads. One <b>WCU</b> is one write per second of up to 1 KB. Transactional reads and writes cost double. Always round the item size up before multiplying. Try the calculator above with 6 KB items.</p>`,
  `<p><b>On-demand</b> mode suits unpredictable traffic. <b>Provisioned</b> mode with auto scaling is cheaper for steady load. Going over provisioned throughput raises <code>ProvisionedThroughputExceededException</code>, and the SDK retries with exponential backoff.</p>`],
 facts:[['1 RCU','1 strong read/s of 4 KB, or 2 eventual'],['1 WCU','1 write/s of 1 KB'],['Transactions','2× capacity'],['LSI / GSI per table','5 / 20']],
 trap:'Strongly consistent reads are not available on a GSI, and an LSI cannot be added after the table exists.'},

{id:'ddb-ops',d:1,title:'DynamoDB: queries, writes and locking',lead:'Query beats Scan, conditions give optimistic locking, and transactions are all-or-nothing.',
 diagram:{h:240,nodes:[['a','User A',70,50,'client','reads version 2'],['b','User B',70,190,'client','reads version 2'],['t','Item',330,120,'store','version = 2'],['r','Retry flow',550,190,'svc','read, merge, write']],
  steps:[
   {cap:'Both users read the item at version 2. User A writes first, with a condition that the version is still 2.',edges:[['a','t','write v3 IF version=2']]},
   {cap:'User B sends the same conditional write. The version is now 3, so DynamoDB rejects it and nothing is overwritten.',edges:[['b','t','write v3 IF version=2','x']]},
   {cap:'User B re-reads the item, merges the change and tries again with the new version.',edges:[['b','r','ConditionalCheckFailed','dash']]}]},
 body:[
  `<p><b>Query</b> reads items for one partition key (optionally narrowed by sort key) and is efficient. <b>Scan</b> reads the whole table. A <code>FilterExpression</code> is applied after the read, so it shrinks the response but does <b>not</b> reduce RCUs consumed. <code>ProjectionExpression</code> limits the attributes returned. Use parallel scan only for large offline jobs.</p>`,
  `<p><b>Conditional writes</b> use a <code>ConditionExpression</code>. With a version attribute you get optimistic locking: the write succeeds only if nobody changed the item. <b>TransactWriteItems</b> is ACID across up to 100 items. <b>BatchWriteItem</b> is not atomic, so retry anything listed in <code>UnprocessedItems</code>.</p>`,
  `<p>Other features: items max 400 KB, <b>TTL</b> removes expired items at no write cost, <b>Streams</b> publish change events for 24 hours and trigger Lambda, and <b>DAX</b> is an in-memory cache that gives microsecond reads for read-heavy, eventually consistent workloads.</p>`],
 facts:[['Item size','400 KB'],['TransactWrite','100 items, 2× capacity'],['BatchWrite / BatchGet','25 / 100 items'],['Streams retention','24 h']],
 trap:'Lost updates are fixed with a conditional write on a version attribute. Strongly consistent reads, more WCUs and Streams do not stop the overwrite.'},

{id:'s3',d:1,title:'S3: uploads, events and performance',lead:'Presigned URLs let a browser upload without AWS credentials.',
 diagram:{h:260,nodes:[['br','Browser',80,60,'client'],['be','Backend',320,60,'svc','holds IAM role'],['s3','S3 bucket',320,190,'store','private'],['fn','Lambda',545,190,'svc']],
  steps:[
   {cap:'The browser has no AWS credentials, so it asks your backend for permission to upload.',edges:[['br','be','request upload URL']]},
   {cap:'The backend signs a short-lived PUT URL using its own role. The URL carries only the permissions of the signer and expires.',edges:[['be','br','presigned URL']]},
   {cap:'The browser uploads straight to S3 over HTTPS. The bucket needs a CORS rule because the call comes from another origin.',edges:[['br','s3','PUT file + CORS']]},
   {cap:'The new object raises an event that can trigger Lambda, or go to SQS, SNS or EventBridge.',edges:[['s3','fn','ObjectCreated','dash']]}]},
 body:[
  `<p>S3 gives <b>strong read-after-write consistency</b> for all operations, so a new object is immediately readable. Objects can reach 5 TB. <b>Multipart upload</b> is recommended above 100 MB and required above 5 GB, and it uploads parts in parallel.</p>`,
  `<p>A <b>presigned URL</b> grants time-limited access using the signer's permissions. If the signer's role loses access, the URL stops working. Use presigned PUT URLs for browser uploads and presigned GET URLs for private downloads.</p>`,
  `<p>Performance scales per prefix: 3,500 write and 5,500 read requests per second for each prefix, so spread keys across prefixes. <b>Transfer Acceleration</b> uses edge locations for long-distance uploads. For reads, byte-range fetches parallelise downloads and S3 Select pulls a subset of an object.</p>`,
  `<p>Event notifications go to Lambda, SQS, SNS or EventBridge. When one upload must feed several systems, send it to SNS (or EventBridge) and fan out.</p>`],
 facts:[['Max object','5 TB'],['Multipart','> 100 MB advised, > 5 GB required'],['Per prefix','3,500 PUT / 5,500 GET per s']],
 trap:'Making a bucket public or sharing IAM user keys is never the answer for browser uploads.'},

{id:'messaging',d:1,title:'Messaging and orchestration: pick the service',lead:'Six services, six keywords. Choose by the property the question stresses.',
 diagram:{h:250,nodes:[['up','S3 upload',70,125,'store'],['sns','SNS topic',260,125,'queue','push, filter policies'],['q1','SQS: thumbnails',470,45,'queue'],['q2','SQS: metadata',470,125,'queue'],['q3','SQS: audit',470,205,'queue']],
  steps:[
   {cap:'One upload produces one event, published to an SNS topic.',edges:[['up','sns','one event']]},
   {cap:'SNS pushes a copy to every subscribed queue. Each consumer works independently and at its own pace. Filter policies can limit what each queue receives.',edges:[['sns','q1','copy'],['sns','q2','copy'],['sns','q3','copy']]}]},
 widgets:[{type:'picker',title:'Which service fits?',items:[
  {l:'SQS Standard',tag:'Decoupling and buffering',t:'Use it to decouple producers from consumers and absorb spikes. Delivery is at-least-once with best-effort ordering, so consumers must be idempotent. Throughput is effectively unlimited.',k:'"decouple", "buffer spikes"'},
  {l:'SQS FIFO',tag:'Order and exactly-once',t:'Ordered per message group ID, with a deduplication ID over a 5-minute window. Use a customer ID as the group ID to keep order per customer while processing customers in parallel. 300 msg/s, or 3,000 with batching.',k:'"ordered", "exactly-once", "no duplicates"'},
  {l:'SNS',tag:'Fan-out',t:'A push topic with many subscribers. Filter policies work per subscription. SNS plus several SQS queues is the classic fan-out pattern.',k:'"fan-out", "multiple subscribers"'},
  {l:'EventBridge',tag:'Content-based routing',t:'Rules match event patterns to route events from AWS services, SaaS partners and your apps. Supports archive and replay, and Scheduler for cron-style jobs.',k:'"route by content", "SaaS events", "schedule"'},
  {l:'Kinesis Data Streams',tag:'Ordered real-time streams',t:'Shards take 1 MB/s or 1,000 records/s in and give 2 MB/s out. Order holds per partition key. Retention is 24 hours up to 365 days, so many consumers can read and replay the same data.',k:'"real-time stream", "replay", "multiple consumers same data"'},
  {l:'Step Functions',tag:'Workflows',t:'Multi-step workflows with retries, branching and human approval. Standard workflows run up to one year with exactly-once execution. Express runs up to 5 minutes at high volume.',k:'"workflow", "retry steps", "human approval"'}]}],
 body:[
  `<p>These services overlap, so the exam hides the answer in one phrase. Use the picker above: each entry gives the deciding property and the keyword that signals it.</p>`,
  `<p>A rule of thumb that works for most questions: <b>SQS</b> holds work until a consumer pulls it, <b>SNS</b> pushes to many at once, <b>EventBridge</b> routes by what the event contains, <b>Kinesis</b> keeps an ordered log you can replay, and <b>Step Functions</b> coordinates steps that depend on each other.</p>`,
  `<p>Fan-out is worth drawing yourself: S3 cannot send the same event type for overlapping prefixes to several destinations, so publish once to SNS and subscribe one queue per consumer.</p>`],
 facts:[['SQS FIFO','300 msg/s (3,000 batched)'],['Kinesis shard in','1 MB/s or 1,000 rec/s'],['Kinesis shard out','2 MB/s'],['Step Functions','Standard 1 yr, Express 5 min']],
 trap:'Kinesis with one shard is not the answer to "exactly once, ordered per customer". That is FIFO with a message group ID.'},

{id:'sqs',d:1,title:'SQS in depth: visibility, polling and dead letters',lead:'A message is hidden, not removed, until the consumer deletes it.',
 diagram:{h:240,nodes:[['p','Producer',70,120,'client'],['q','SQS queue',300,120,'queue','visibility timeout 30 s'],['c','Consumer',530,50,'svc'],['dlq','Dead-letter queue',530,200,'fail']],
  steps:[
   {cap:'The producer sends a message of up to 256 KB. Larger payloads go to S3 through the Extended Client Library.',edges:[['p','q','SendMessage']]},
   {cap:'The consumer receives it. The message stays in the queue but becomes invisible for the visibility timeout. Long polling (up to 20 s) avoids empty responses.',edges:[['q','c','ReceiveMessage + hide']]},
   {cap:'On success the consumer deletes the message. If it never does, the message reappears once the timeout ends.',edges:[['c','q','DeleteMessage']]},
   {cap:'After maxReceiveCount failed receives, SQS moves the message to the dead-letter queue.',edges:[['q','dlq','maxReceiveCount exceeded','dash']]}]},
 widgets:[{type:'sqsvis'}],
 body:[
  `<p>The <b>visibility timeout</b> (default 30 s, maximum 12 h) is the time a received message stays hidden from other consumers. If processing takes longer than the timeout, the message reappears and a second consumer handles it again. The fixes are a longer timeout and idempotent consumers. Move the sliders above to see the duplicate appear.</p>`,
  `<p><b>Long polling</b> (<code>WaitTimeSeconds</code> up to 20) waits for a message and cuts empty responses and cost. <b>Delay queues</b> postpone delivery by up to 15 minutes. Retention defaults to 4 days and ranges from 1 minute to 14 days. <code>SendMessageBatch</code> and receive calls handle up to 10 messages.</p>`,
  `<p>A <b>DLQ</b> catches messages that fail repeatedly, based on <code>maxReceiveCount</code>. Messages above 256 KB use the Extended Client Library, which stores the body in S3 and sends a pointer.</p>`],
 facts:[['Message size','256 KB'],['Visibility timeout','30 s default, 12 h max'],['Retention','4 d default (1 min – 14 d)'],['Long poll','20 s max'],['Delay','15 min max'],['Batch','10 messages']],
 trap:'Messages processed twice while the consumer succeeds? The visibility timeout is shorter than the processing time.'},

{id:'apigw',d:1,title:'API Gateway: types, integrations and errors',lead:'REST, HTTP or WebSocket, proxy or mapped, and three status codes you must decode.',
 diagram:{h:260,nodes:[['cl','Client',70,125,'client'],['gw','API Gateway',270,125,'sec','stage + throttle'],['ca','Stage cache',270,35,'store','TTL 300 s'],['fn','Lambda',500,125,'svc','proxy integration']],
  steps:[
   {cap:'The client calls a stage of the API.',edges:[['cl','gw','request']]},
   {cap:'With caching enabled and a hit, the gateway answers without touching the backend.',edges:[['gw','ca','cache hit','dash']]},
   {cap:'On a miss, the gateway calls Lambda. Integrations must answer within 29 seconds by default.',edges:[['gw','fn','miss: invoke (29 s limit)']]},
   {cap:'If the proxy response is not shaped as statusCode, headers and a string body, the gateway returns 502 to the client.',edges:[['fn','gw','malformed response','x'],['gw','cl','502 Bad Gateway','x']]}]},
 body:[
  `<p><b>REST APIs</b> have the full feature set: usage plans, API keys, caching, request validation. <b>HTTP APIs</b> are cheaper and faster, with JWT authorizers. <b>WebSocket APIs</b> keep two-way connections open. With a <b>Lambda proxy integration</b> the gateway passes the whole request and Lambda builds the whole response. A non-proxy integration uses VTL mapping templates to transform each side.</p>`,
  `<p><b>Stages</b> are deployment targets; <b>stage variables</b> can point each stage to a different Lambda alias, and a stage can run a <b>canary</b> release. The cache TTL defaults to 300 s (max 3,600 s), and an authorised client can bypass it with <code>Cache-Control: max-age=0</code>.</p>`,
  `<p>Memorise the codes: <b>429</b> means throttled, <b>502</b> means the Lambda proxy response was malformed, <b>504</b> means the integration took longer than 29 s. For 504, make the work asynchronous with SQS or Step Functions.</p>`],
 facts:[['Integration timeout','29 s default'],['Cache TTL','300 s default, 3,600 s max'],['Account throttle','10,000 rps, 5,000 burst'],['429 / 502 / 504','throttle / bad Lambda reply / timeout']],
 trap:'A long-running job behind API Gateway cannot be fixed with a bigger Lambda timeout, because the gateway gives up at 29 s.'},

{id:'cache',d:1,title:'Caching and data access',lead:'Lazy loading caches only what is asked for. Write-through keeps data fresh.',
 diagram:{h:250,nodes:[['app','Application',70,125,'client'],['c','ElastiCache',300,45,'queue','Redis or Memcached'],['db','Database',300,205,'store']],
  steps:[
   {cap:'The app checks the cache first.',edges:[['app','c','GET key']]},
   {cap:'Cache miss: the app reads the database. This first request is the slow one.',edges:[['app','db','miss: query DB']]},
   {cap:'The app writes the result to the cache with a TTL, so stale entries age out.',edges:[['app','c','SET key + TTL']]},
   {cap:'Next request: cache hit, the database is not touched.',edges:[['c','app','hit','dash']]}]},
 body:[
  `<p><b>Lazy loading</b> (cache-aside) loads data on a miss. Only requested data is cached, so memory is used well, but a miss costs three trips and entries can go stale. <b>Write-through</b> updates the cache on every write, so reads are always fresh, at the price of slower writes and cache space for data nobody reads. Add a <b>TTL</b> to both.</p>`,
  `<p><b>Redis</b> offers persistence, replication and rich types such as sorted sets, which suits session stores and leaderboards. <b>Memcached</b> is simple and multi-threaded, with no persistence. For DynamoDB reads, DAX caches transparently; at the edge use CloudFront, and in front of APIs use the API Gateway cache.</p>`],
 facts:[['Session store, leaderboard','ElastiCache Redis'],['Microsecond DynamoDB reads','DAX'],['Stale risk','lazy loading'],['Slower writes','write-through']],
 trap:'"Persistence" or "sorted sets" points to Redis. "Simple, multi-threaded" points to Memcached.'},

{id:'sdk',d:1,title:'SDK and CLI patterns',lead:'The credential chain stops at the first match, and throttling is solved with backoff plus jitter.',
 widgets:[{type:'chain'}],
 body:[
  `<p>The SDKs look for credentials in a fixed order: values set in code, environment variables, the shared credentials and config files, and finally a container or instance role. The first source that has credentials wins. Never hard-code keys; running on a role means nothing at all is stored with your code.</p>`,
  `<p>Throttling (429) and 5xx errors are retried with <b>exponential backoff and jitter</b>. The waits double on each attempt, and random jitter stops many clients from retrying at the same instant. The SDKs do this by default. Use pagination tokens for list calls.</p>`,
  `<p>CLI helpers worth knowing: <code>--dry-run</code> checks permissions without making the change, and <code>aws sts decode-authorization-message</code> decodes the encoded text of an access-denied error.</p>`],
 facts:[['Chain order','code → env → shared files → role'],['Retry rule','backoff + jitter'],['Permission check','--dry-run'],['Decode denial','sts decode-authorization-message']],
 trap:'Environment variables beat the shared credentials file. A stale AWS_ACCESS_KEY_ID can silently override the role you expected.'},

/* ---------------- DOMAIN 2 ---------------- */
{id:'iam',d:2,title:'IAM: policies, roles and boundaries',lead:'Explicit deny always wins. Everything not allowed is denied.',
 widgets:[{type:'iam'}],
 body:[
  `<p>Evaluation starts from an <b>implicit deny</b>. An <b>explicit Deny</b> in any applicable policy overrides every Allow. Identity-based policies attach to users, groups and roles. <b>Resource-based policies</b> (S3 bucket policy, SQS queue policy, Lambda resource policy, KMS key policy) attach to the resource and can grant cross-account access directly.</p>`,
  `<p>Use <b>roles</b> everywhere: an instance profile for EC2, an execution role for Lambda, and for ECS a <b>task role</b> (permissions your app uses) separate from the <b>task execution role</b> (pull the image, write logs). Cross-account access calls <code>sts:AssumeRole</code> and returns temporary credentials (15 minutes to 12 hours, 1 hour by default).</p>`,
  `<p><b>Permission boundaries</b> cap the maximum permissions an identity can receive. <b>SCPs</b> cap an entire account in AWS Organizations. Neither grants anything on its own. Policy variables such as <code>\${aws:username}</code> scope access per user, for example one S3 prefix each. <b>Access Analyzer</b> finds resources shared outside your account and the <b>Policy Simulator</b> tests policies.</p>`],
 facts:[['Winner','explicit Deny'],['Default','implicit deny'],['AssumeRole session','15 min – 12 h (1 h default)'],['ECS','task role vs execution role']],
 trap:'A boundary or SCP never grants access. It only limits what other policies can allow.'},

{id:'cognito',d:2,title:'Cognito: user pools vs identity pools',lead:'User pools answer who you are. Identity pools answer what AWS resources you can touch.',
 diagram:{h:260,nodes:[['app','Mobile app',70,130,'client'],['up','User pool',290,45,'sec','who are you?'],['ip','Identity pool',290,215,'sec','what can you touch?'],['s3','S3 / DynamoDB',545,130,'store']],
  steps:[
   {cap:'The user signs up or signs in to the user pool. It handles MFA and social or SAML federation.',edges:[['app','up','sign in']]},
   {cap:'The user pool returns JWTs: an ID token, an access token and a refresh token.',edges:[['up','app','JWTs']]},
   {cap:'The app exchanges the token with the identity pool.',edges:[['app','ip','exchange token']]},
   {cap:'The identity pool returns temporary AWS credentials for an IAM role. Guest access is also possible here.',edges:[['ip','app','temporary credentials']]},
   {cap:'The app calls S3 or DynamoDB directly with those credentials, limited by the role.',edges:[['app','s3','scoped by IAM role']]}]},
 body:[
  `<p>A <b>user pool</b> is a user directory: sign-up, sign-in, MFA, social and SAML federation. Its output is a set of <b>JWTs</b>. ID and access tokens last one hour by default. API Gateway can validate those tokens with a Cognito authorizer, with no code.</p>`,
  `<p>An <b>identity pool</b> swaps a token (from a user pool, a social provider or even nobody, for guests) for <b>temporary AWS credentials</b> tied to an IAM role. The role's policy can scope access per user with the variable <code>\${cognito-identity.amazonaws.com:sub}</code>, so each user reaches only their own S3 prefix.</p>`],
 facts:[['User pools','JWTs: ID, access, refresh'],['Identity pools','temporary AWS credentials'],['Token lifetime','1 h default'],['Guest access','identity pool']],
 trap:'"Sign-up and sign-in" means a user pool. "Temporary credentials for app users" means an identity pool. Many answers need both.'},

{id:'apigw-auth',d:2,title:'API Gateway authorization',lead:'Four ways to protect an API. Choose by who the caller is.',
 widgets:[{type:'picker',title:'Choose an authorizer',items:[
  {l:'IAM authorization',tag:'AWS principals',t:'Callers sign requests with SigV4 using IAM credentials. Best for service-to-service calls or users with IAM roles. Access is controlled by IAM policies on the caller.',k:'"signed requests", "IAM role calls the API"'},
  {l:'Cognito user pool authorizer',tag:'No code',t:'API Gateway validates the JWT issued by your user pool and rejects bad tokens before your backend runs. Needs no Lambda.',k:'"Cognito", "sign-in users", "no code"'},
  {l:'Lambda authorizer',tag:'Custom logic',t:'Your function checks the caller and returns an IAM policy. Token-based variant reads a bearer token or JWT; request-based variant reads headers, query strings or stage variables. Results can be cached to save invocations.',k:'"custom tokens", "third-party IdP"'},
  {l:'Resource policy',tag:'Network and account limits',t:'A JSON policy on the API that allows or denies by source IP range, VPC or endpoint, or AWS account. It complements the authorizers above.',k:'"restrict by IP", "restrict by VPC", "cross-account"'}]}],
 body:[
  `<p>Pick the lightest option that matches the caller. AWS callers use <b>IAM</b>. Users of your own app with Cognito use the <b>user pool authorizer</b>. Any other identity system, including a third-party IdP with custom tokens, needs a <b>Lambda authorizer</b>. Network-level limits use a <b>resource policy</b>. For HTTP APIs with an OIDC provider, a JWT authorizer also fits.</p>`,
  `<p>Caching the authorizer result (by token or by request values) keeps latency and cost down, but a cached policy remains in force until its TTL expires.</p>`],
 facts:[['SigV4','IAM auth'],['No code','Cognito authorizer'],['Custom token','Lambda authorizer'],['IP / VPC limit','resource policy']],
 trap:'API keys identify a client for usage plans and throttling. They are not authentication.'},

{id:'kms',d:2,title:'KMS and envelope encryption',lead:'KMS protects keys. Your app encrypts data locally with a data key.',
 diagram:{h:260,nodes:[['app','Application',70,130,'client'],['kms','KMS key',300,45,'sec','never leaves KMS'],['st','S3 / database',545,130,'store','ciphertext + encrypted key']],
  steps:[
   {cap:'Ask KMS for a data key under a KMS key. Direct Encrypt works only up to 4 KB, so large data needs this route.',edges:[['app','kms','GenerateDataKey']]},
   {cap:'KMS returns two copies: a plaintext data key and the same key encrypted under the KMS key.',edges:[['kms','app','plaintext key + encrypted key']]},
   {cap:'The app encrypts the data locally with the plaintext key, then discards that key and stores the ciphertext with the encrypted key.',edges:[['app','st','store both']]},
   {cap:'To read later: send the encrypted data key to KMS to decrypt, then decrypt the data locally.',edges:[['app','kms','Decrypt(encrypted key)','dash'],['kms','app','plaintext key','dash']]}]},
 body:[
  `<p><b>Envelope encryption</b> keeps the big work out of KMS. You call <code>GenerateDataKey</code>, encrypt the data locally with the plaintext key, throw that key away, and keep the encrypted copy beside the data. Only KMS can unlock that copy, so access to the data follows access to the KMS key.</p>`,
  `<p>Key types: <b>AWS owned</b>, <b>AWS managed</b> (such as <code>aws/s3</code>) and <b>customer managed</b>, where you control the key policy and rotation (automatic yearly rotation is on by default for customer managed keys when enabled). For S3: <b>SSE-S3</b> is the default AES-256, <b>SSE-KMS</b> adds a CloudTrail audit trail and key-policy control, <b>SSE-C</b> means you send the key on every request over HTTPS, and client-side encryption happens before upload.</p>`,
  `<p>High request rates with SSE-KMS can hit <code>ThrottlingException</code>. Enable <b>S3 Bucket Keys</b>, or use data-key caching in the Encryption SDK. Enforce HTTPS with a bucket policy that denies requests when <code>aws:SecureTransport</code> is false. ACM issues free certificates for ALB, CloudFront and API Gateway.</p>`],
 facts:[['Direct Encrypt','4 KB payload'],['Large data','GenerateDataKey'],['KMS throttling','S3 Bucket Keys'],['Force HTTPS','aws:SecureTransport']],
 trap:'Encrypting a 2 MB file is never a direct Encrypt call. It is GenerateDataKey.'},

{id:'secrets',d:2,title:'Secrets and configuration',lead:'Three services, one question each: rotate it, store it, or toggle it.',
 widgets:[{type:'picker',title:'Where does it belong?',items:[
  {l:'Secrets Manager',tag:'Automatic rotation',t:'Built-in rotation using a Lambda function and native RDS integration. Choose it when the requirement says rotate database credentials automatically with minimal code. It costs more per secret.',k:'"rotate credentials automatically"'},
  {l:'SSM Parameter Store',tag:'Cheap hierarchical config',t:'Stores String, StringList and SecureString (KMS) values under paths such as /prod/db/url. Good for plain configuration and low cost. It has no native secret rotation.',k:'"configuration values", "hierarchy", "lowest cost"'},
  {l:'AWS AppConfig',tag:'Dynamic config and flags',t:'Deploys feature flags and configuration to running apps without a redeploy, with gradual rollout and validation.',k:'"feature flags", "no redeploy"'}]}],
 body:[
  `<p>Never place secrets in plaintext environment variables, source code or AMIs. A Lambda function should read secrets at init time and cache them. The <b>Parameters and Secrets Lambda extension</b> does the caching for you.</p>`,
  `<p>For environments, keep config in Parameter Store paths such as <code>/prod/db/url</code> and <code>/dev/db/url</code>, so the same code runs in each stage and only the path prefix changes.</p>`],
 facts:[['Rotation','Secrets Manager'],['Plain config','Parameter Store'],['Flags','AppConfig']],
 trap:'Parameter Store SecureString is encrypted, but it does not rotate. Rotation questions go to Secrets Manager.'},

{id:'netsec',d:2,title:'Private access, WAF and safe logging',lead:'Keep traffic on the AWS network and keep sensitive values out of logs.',
 diagram:{h:260,nodes:[['fn','Lambda in VPC',80,130,'svc'],['ep','Gateway endpoint',310,45,'sec','free'],['nat','NAT gateway',310,215,'ext','hourly + data cost'],['s3','S3 / DynamoDB',545,45,'store'],['net','Public internet',545,215,'ext']],
  steps:[
   {cap:'For S3 and DynamoDB, a gateway endpoint gives private access at no charge.',edges:[['fn','ep','S3 / DynamoDB'],['ep','s3','private route']]},
   {cap:'For anything else on the internet, the function needs a NAT gateway in a public subnet. Most other AWS services can use interface endpoints (PrivateLink).',edges:[['fn','nat','other destinations'],['nat','net','out']]}]},
 body:[
  `<p><b>Gateway endpoints</b> exist for S3 and DynamoDB and are free. <b>Interface endpoints</b> (PrivateLink) cover most other services. A Lambda function inside a VPC has no internet by default, so give it a NAT gateway or the right endpoints.</p>`,
  `<p><b>AWS WAF</b> protects API Gateway, ALB and CloudFront from common web attacks. <b>Sanitise logs</b>: never write tokens, passwords or personal data to CloudWatch Logs. CloudWatch Logs data protection can mask sensitive values that slip through.</p>`],
 facts:[['Gateway endpoints','S3, DynamoDB (free)'],['Interface endpoints','most other services'],['Web attacks','AWS WAF']],
 trap:'A VPC Lambda that times out calling an AWS API is almost always missing a NAT gateway or an endpoint.'},

/* ---------------- DOMAIN 3 ---------------- */
{id:'cicd',d:3,title:'CI/CD services and their files',lead:'Know each service by its job and its configuration file.',
 diagram:{h:270,nodes:[['src','GitHub',70,60,'ext','source'],['b','CodeBuild',210,60,'svc','buildspec.yml'],['ap','Manual approval',350,60,'sec'],['dp','CodeDeploy',490,60,'svc','appspec.yml'],['art','S3 artifacts',210,205,'store'],['tg','EC2 / Lambda / ECS',490,205,'client']],
  steps:[
   {cap:'A commit starts CodePipeline. CodeBuild reads buildspec.yml from the repo root and runs install, pre_build, build and post_build.',edges:[['src','b','commit triggers']]},
   {cap:'Build output is stored as an artifact in S3. Artifacts move between stages through this bucket.',edges:[['b','art','artifacts','dash']]},
   {cap:'Tests pass, and a manual approval action can pause the pipeline for a person.',edges:[['b','ap','tests pass']]},
   {cap:'After approval, CodeDeploy takes over.',edges:[['ap','dp','approved']]},
   {cap:'CodeDeploy follows appspec.yml to update EC2, Lambda or ECS, running lifecycle hooks.',edges:[['dp','tg','appspec hooks']]}]},
 widgets:[{type:'hooks'},{type:'picker',title:'The services at a glance',items:[
  {l:'CodeCommit / GitHub',tag:'Source',t:'CodeCommit is closed to new customers, but questions may still mention it. GitHub is a common source.',k:''},
  {l:'CodeBuild',tag:'Build and test',t:'Runs buildspec.yml from the repo root. Phases: install, pre_build, build, post_build. Artifacts go to S3, and caches can go to S3 or local.',k:'buildspec.yml'},
  {l:'CodeDeploy',tag:'Deploy',t:'Deploys to EC2/on-premises, Lambda and ECS. Configured by appspec.yml (YAML or JSON). EC2 needs the CodeDeploy agent installed.',k:'appspec.yml'},
  {l:'CodePipeline',tag:'Orchestrate',t:'Stages such as Source → Build → Test → Deploy, with manual approval actions. Artifacts pass through an S3 bucket.',k:'stages'},
  {l:'CodeArtifact',tag:'Packages',t:'A package repository that proxies public ones: Maven, npm, PyPI.',k:'Maven, npm, PyPI'},
  {l:'CodeGuru / Amazon Q Developer',tag:'Review and profiling',t:'The reviewer finds code issues; the profiler finds the expensive lines in running Java apps.',k:'profiling'}]}],
 body:[
  `<p>Two file names matter most. <code>buildspec.yml</code> belongs to <b>CodeBuild</b> and lives in the source root. <code>appspec.yml</code> belongs to <b>CodeDeploy</b>. Mixing them up is a standard distractor, as are <code>.ebextensions</code> (Beanstalk) and <code>template.yaml</code> (SAM/CloudFormation).</p>`,
  `<p>Pipelines are linear flows of stages. The sequence of the pipeline is real, so the diagram steps above follow it in order. Use the hook explorer to see the order CodeDeploy runs scripts on EC2.</p>`],
 facts:[['CodeBuild file','buildspec.yml (repo root)'],['CodeDeploy file','appspec.yml'],['EC2 needs','CodeDeploy agent'],['Hook to verify','ValidateService']],
 trap:'CodeDeploy fails on EC2? Look for a missing agent or an instance profile without S3 access.'},

{id:'strategies',d:3,title:'Deployment strategies',lead:'Watch each strategy move a fleet from version 1 to version 2.',
 widgets:[{type:'fleet'}],
 body:[
  `<p>Read the requirement, then match the strategy. <b>All at once</b> is fastest and cheapest and has downtime, so it fits dev. <b>Rolling</b> updates batches and runs at reduced capacity. <b>Rolling with additional batch</b> launches extra instances first to keep full capacity. <b>Immutable</b> builds a fresh set in a new Auto Scaling group, which makes rollback fast: terminate the new group.</p>`,
  `<p><b>Blue/green</b> runs two full environments and switches traffic, giving zero downtime and instant rollback by switching back, at roughly double cost. <b>Canary</b> sends a small share first (for example 10% for 5 minutes) and watches alarms. <b>Linear</b> shifts equal increments (for example 10% every minute). Beanstalk calls its canary <b>traffic splitting</b>.</p>`,
  `<p>For Lambda, canary and linear releases run through CodeDeploy using alias traffic shifting, and CloudWatch alarms can trigger an automatic rollback.</p>`],
 facts:[['Dev','all at once'],['Safest Beanstalk update','immutable'],['Instant rollback + zero downtime','blue/green'],['Test on a small slice','canary']],
 trap:'Rolling and all-at-once roll back by redeploying the old version. That is slow, so they are wrong for "fast rollback".'},

{id:'beanstalk',d:3,title:'Elastic Beanstalk',lead:'Platform-as-a-service with config files in the source bundle.',
 diagram:{h:260,nodes:[['u','Users',70,130,'client'],['dns','Environment URL',270,130,'ext','CNAME'],['bl','Env v1 (blue)',500,45,'svc'],['gr','Env v2 (green)',500,215,'svc']],
  steps:[
   {cap:'Users reach the current environment through its URL.',edges:[['u','dns','request'],['dns','bl','live traffic']]},
   {cap:'Clone the environment and deploy version 2 to the clone. Test it without affecting users.',edges:[['bl','gr','clone + deploy v2','dash']]},
   {cap:'Swap environment URLs. The CNAME now points to green and traffic switches.',edges:[['dns','gr','swap URLs']]},
   {cap:'Problem found? Swap back. Blue is still running, so rollback is immediate.',edges:[['dns','bl','swap back','dash']]}]},
 body:[
  `<p>Customise instances with <code>.ebextensions/*.config</code> files inside the source bundle (packages, files, commands). <code>env.yaml</code> defines environment settings and <code>cron.yaml</code> defines scheduled jobs for the worker tier. The <b>web server tier</b> serves HTTP; the <b>worker tier</b> pulls jobs from an SQS queue.</p>`,
  `<p>Beanstalk blue/green means <b>clone the environment and swap environment URLs</b>. A database created inside a Beanstalk environment is deleted with it. For production, create RDS separately and pass the connection through environment properties. A lifecycle policy limits stored application versions (quota 1,000).</p>`],
 facts:[['Customise instances','.ebextensions/*.config'],['Worker tier','reads an SQS queue'],['Blue/green','swap environment URLs'],['App versions quota','1,000']],
 trap:'Do not create the production database inside the Beanstalk environment. Terminating the environment deletes it.'},

{id:'iac',d:3,title:'Infrastructure as code: CloudFormation, SAM and CDK',lead:'CDK and SAM both end up as CloudFormation.',
 diagram:{h:270,nodes:[['cdk','CDK app',70,60,'svc','Java, TypeScript…'],['sam','SAM template',70,205,'svc','Transform: Serverless'],['cfn','CloudFormation template',300,130,'queue'],['stk','Stack',520,55,'sec'],['res','AWS resources',520,205,'store']],
  steps:[

 body:[
  `<p>All three produce CloudFormation stacks, so stack behaviour is shared: parameterise for environments, use change sets to preview, and protect data with <code>DeletionPolicy</code>. To pass a value between stacks, <b>export</b> it in one stack's Outputs and <code>!ImportValue</code> it in another.</p>`,

{id:'containers',d:3,title:'Containers: ECR, ECS and Fargate',lead:'Two IAM roles confuse people: execution role vs task role.',

 body:[
  `<p><b>ECR</b> stores images. <b>ECS on EC2</b> means you manage the instances; <b>Fargate</b> is serverless compute for containers. A <b>task definition</b> contains the image, CPU and memory, ports, environment variables and the task role.</p>`,

{id:'cloudwatch',d:4,title:'CloudWatch: metrics, logs and alarms',lead:'Embedded Metric Format turns structured logs into metrics for free.',
 diagram:{h:260,nodes:[['fn','Lambda',70,60,'svc'],['lg','Logs (JSON)',240,60,'store','EMF'],['m','Metrics',410,60,'queue'],['al','Alarm',410,200,'sec','OK → ALARM'],['sn','SNS / Auto Scaling',560,200,'ext']],
  steps:[
   {cap:'The function prints one structured JSON log line in Embedded Metric Format. No extra API call, no added latency.',edges:[['fn','lg','EMF log line']]},
   {cap:'CloudWatch extracts the metric values from the log automatically.',edges:[['lg','m','extracted']]},
   {cap:'An alarm watches the metric and changes state: OK, ALARM or INSUFFICIENT_DATA.',edges:[['m','al','threshold']]},
   {cap:'The alarm triggers an action: notify through SNS, scale with Auto Scaling, or act on EC2.',edges:[['al','sn','action']]}]},
 body:[
  `<p>EC2 sends standard metrics every 5 minutes and detailed metrics every 1 minute. <b>Memory and disk usage are not default metrics</b>: install the CloudWatch agent. Custom metrics use <code>PutMetricData</code> and can be high resolution down to 1 second. <b>EMF</b> avoids those API calls by writing metrics inside log lines.</p>`,
  `<p>Logs live in groups and streams. Retention is <b>never expire</b> by default, so set it. <b>Logs Insights</b> queries logs, <b>metric filters</b> turn patterns into metrics and alarms, and <b>subscription filters</b> stream logs to Lambda, Kinesis or OpenSearch. <b>Composite alarms</b> cut noise by combining alarms. Synthetics canaries run scripted endpoint checks.</p>`],
 facts:[['EC2 metrics','5 min (1 min detailed)'],['Memory / disk','CloudWatch agent'],['Low-latency Lambda metrics','EMF'],['Alarm states','OK / ALARM / INSUFFICIENT_DATA']],
 trap:'PutMetricData per invocation adds calls and latency. EMF is the efficient answer.'},

{id:'xray',d:4,title:'X-Ray: traces, annotations and sampling',lead:'Annotations are indexed and searchable. Metadata is not.',
 widgets:[{type:'xray'}],
 body:[
  `<p>A <b>trace</b> follows one request. It is split into <b>segments</b> (one per service) and <b>subsegments</b> (one per downstream call). The <b>service map</b> shows latency and errors between components, so you can see where time goes.</p>`,
  `<p><b>Annotations</b> are indexed key-value pairs, so you can filter traces by them, for example by customer ID. <b>Metadata</b> is extra detail that is not indexed. This distinction is a frequent question.</p>`,
  `<p><b>Sampling rules</b> control cost. The default records the first request each second plus 5% of the rest. To enable tracing: Lambda has active tracing (a setting plus IAM permission), API Gateway has a tracing toggle, and EC2 or ECS need the X-Ray daemon or the ADOT collector (UDP port 2000). OpenTelemetry through ADOT is the modern instrumentation path.</p>`],
 facts:[['Searchable','annotations'],['Not indexed','metadata'],['Default sampling','1/s + 5%'],['Daemon port','UDP 2000']],
 trap:'"Filter traces by user" is always an annotation.'},

{id:'cloudtrail',d:4,title:'CloudTrail',lead:'Who made this API call, and when?',

   {cap:'Create a trail to deliver events to S3 for longer retention.',edges:[['ct','s3','trail','dash']]}]},
 body:[
  `<p>CloudTrail is the audit log of API calls. Use it for questions such as "who deleted this bucket?" or "which call was denied?". Management events are on by default and visible for 90 days in Event history. For longer retention, create a trail that delivers to S3.</p>`,
  `<p>Pairing: CloudWatch says <i>that</i> something is wrong, X-Ray says <i>where</i> in a distributed call, CloudTrail says <i>who</i> did it.</p>`],
 facts:[['Event history','90 days'],['Longer retention','trail to S3'],['Answers','who / what / when / from where']],
 trap:'CloudWatch Logs and Config rules do not tell you who made an API call. CloudTrail does.'},

{id:'errors',d:4,title:'Common errors and fixes',lead:'Pick a symptom to see the likely cause and the fix.',
 widgets:[{type:'errors'}],
 body:[
  `<p>The troubleshooting questions follow a small catalogue. Learn the symptom-to-cause mapping above until you can say it without looking, especially the three API Gateway codes (429, 502, 504) and the Lambda VPC timeout.</p>`,
  `<p>For access-denied errors, remember to check three places: the role policy, the resource policy and the KMS key policy. An encoded denial message can be decoded with <code>aws sts decode-authorization-message</code>.</p>`],
 facts:[['429 / throttling','backoff + jitter'],['504','async or speed up'],['502','fix response shape'],['Hot key','better partition key, DAX']],
 trap:'Do not raise the Lambda timeout to fix an API Gateway 504. The gateway still stops at 29 s.'},

{id:'optimize',d:4,title:'Optimization levers',lead:'Right-size, reuse, cache, batch.',
 widgets:[{type:'picker',title:'What to pull',items:[

  {l:'Caching layers',tag:'Reads',t:'CloudFront at the edge, API Gateway cache in front of the backend, ElastiCache or DAX in front of data, plus client-side caching.',k:'"reduce read load"'},

  {l:'S3',tag:'Throughput',t:'Byte-range fetches for parallel downloads, S3 Select to retrieve subsets of data, multipart for large uploads.',k:'"download faster", "only part of a file"'},

 body:[
  `<p>Optimization answers rarely need new architecture. They ask for the smallest change that removes the bottleneck: more memory for CPU-bound Lambda, a proxy for connection storms, a cache for repeated reads, batching for chatty calls.</p>`],
 facts:[['Connection storms','RDS Proxy'],['CPU-bound Lambda','more memory'],['Right-size tool','Lambda Power Tuning'],['SQS batch','10 messages']],
 trap:'Provisioned concurrency fixes cold starts, not a CPU-bound handler.'}

(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dvar=n=>`var(--d${n})`;

/* ---------- diagram engine ---------- */
const NW=118,NH=48; let uid=0; const live=new Set();
function clip(a,b,pad){const dx=b.x-a.x,dy=b.y-a.y;const sx=dx?(NW/2+pad)/Math.abs(dx):1e9,sy=dy?(NH/2+pad)/Math.abs(dy):1e9;const s=Math.min(sx,sy);return{x:a.x+dx*s,y:a.y+dy*s}}
function Diagram(host,spec){
  const id=++uid,W=640,H=spec.h||240,N={};
  spec.nodes.forEach(n=>N[n[0]]={id:n[0],l:n[1],x:n[2],y:n[3],k:n[4]||'svc',s:n[5]||''});
  const pairs=new Set();spec.steps.forEach(s=>s.edges.forEach(e=>pairs.add(e[0]+'>'+e[1])));
  const steps=spec.steps.map((s,si)=>({cap:s.cap,edges:s.edges.map((e,ei)=>{
    const a=N[e[0]],b=N[e[1]],opt=e[3]||'';
    let p0=clip(a,b,3),p1=clip(b,a,6);
    if(pairs.has(e[1]+'>'+e[0])){const dx=p1.x-p0.x,dy=p1.y-p0.y,L=Math.hypot(dx,dy)||1,ox=-dy/L*9,oy=dx/L*9;p0={x:p0.x+ox,y:p0.y+oy};p1={x:p1.x+ox,y:p1.y+oy};var off=[ox,oy]}
    return{to:e[1],label:e[2]||'',opt,p0,p1,off:typeof off!=='undefined'&&pairs.has(e[1]+'>'+e[0])?off:null,key:si+'-'+ei}})}));
  const total=steps.map(s=>(s.edges.length-1)*520+800+1500);
  let h=`<div class="dgwrap"><svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||'Animated diagram')}"><defs><marker id="ah${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>`;
  steps.forEach(s=>s.edges.forEach(e=>{
    const mx=(e.p0.x+e.p1.x)/2,my=(e.p0.y+e.p1.y)/2,horiz=Math.abs(e.p1.x-e.p0.x)>=Math.abs(e.p1.y-e.p0.y);
    h+=`<g class="edge ${e.opt.includes('dash')?'dash':''} ${e.opt.includes('x')?'bad':''}" data-k="${e.key}"><line x1="${e.p0.x}" y1="${e.p0.y}" x2="${e.p1.x}" y2="${e.p1.y}" marker-end="url(#ah${id})"/><circle class="pk" r="5.5" cx="${e.p0.x}" cy="${e.p0.y}" opacity="0"/>${e.opt.includes('x')?`<text class="xm" x="${e.p1.x}" y="${e.p1.y-9}" text-anchor="middle" opacity="0">✕</text>`:''}${e.label?`<text x="${mx+(e.off?e.off[0]*1.9:0)}" y="${my+(e.off?e.off[1]*1.9+4:(horiz?-9:4))}">${esc(e.label)}</text>`:''}</g>`}));
  Object.values(N).forEach(n=>{h+=`<g class="node k-${n.k}" data-n="${n.id}"><rect x="${n.x-NW/2}" y="${n.y-NH/2}" width="${NW}" height="${NH}" rx="9"/><text x="${n.x}" y="${n.y+(n.s?-2:4)}">${esc(n.l)}</text>${n.s?`<text class="sub" x="${n.x}" y="${n.y+13}">${esc(n.s)}</text>`:''}</g>`});
  h+=`</svg></div><div class="cap" aria-live="polite"><span class="n"></span><p></p></div>`;
  host.innerHTML=`<div class="ph"><span>Animated walkthrough</span><span class="sp"></span><div class="dots">${steps.map((_,i)=>`<button type="button" aria-label="Step ${i+1}">${i+1}</button>`).join('')}</div><button type="button" class="btn back">Back</button><button type="button" class="btn play" aria-pressed="false">Pause</button><button type="button" class="btn next">Next</button></div>`+h;
  const edgeEls={};$$('.edge',host).forEach(g=>edgeEls[g.dataset.k]=g);
  const nodeEls={};$$('.node',host).forEach(g=>nodeEls[g.dataset.n]=g);
  const capN=$('.cap .n',host),capP=$('.cap p',host),dots=$$('.dots button',host),playB=$('.play',host);
  const D={host,cur:-1,t:0,playing:!RM,visible:false,
    show(){ // render state at (cur,t)
      const hit=new Set();
      steps.forEach((s,si)=>s.edges.forEach((e,ei)=>{
        const g=edgeEls[e.key],ln=g.firstElementChild,pk=$('.pk',g),xm=$('.xm',g);
        let p=1,cls='done';
        if(D.cur<0){cls='done';p=1;g.style.opacity=.85}
        else if(si<D.cur){cls='done';p=1;g.style.opacity=''}
        else if(si>D.cur){cls='off';p=0;g.style.opacity=''}
        else{cls='';g.style.opacity='';p=Math.max(0,Math.min(1,(D.t-ei*520)/800)); p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; if(p>=1)hit.add(e.to)}
        g.setAttribute('class',`edge ${e.opt.includes('dash')?'dash':''} ${e.opt.includes('x')?'bad':''} ${cls}`);
        ln.setAttribute('x2',e.p0.x+(e.p1.x-e.p0.x)*p);ln.setAttribute('y2',e.p0.y+(e.p1.y-e.p0.y)*p);
        const moving=D.cur===si&&p>0&&p<1;
        pk.setAttribute('cx',e.p0.x+(e.p1.x-e.p0.x)*p);pk.setAttribute('cy',e.p0.y+(e.p1.y-e.p0.y)*p);pk.setAttribute('opacity',moving?1:0);
        if(xm)xm.setAttribute('opacity',(D.cur<0||si<D.cur||(D.cur===si&&p>=1))?1:0);
      }));
      Object.keys(nodeEls).forEach(k=>nodeEls[k].classList.toggle('hit',hit.has(k)));
      dots.forEach((b,i)=>b.classList.toggle('on',i===D.cur));
      if(D.cur<0){capN.textContent='All steps';capP.textContent=steps.length>1?'The full picture. Press Next or a number to walk through it one step at a time.':steps[0].cap}
      else{capN.textContent=`Step ${D.cur+1}/${steps.length}`;capP.textContent=steps[D.cur].cap}
    },
    go(i){D.cur=((i%steps.length)+steps.length)%steps.length;D.t=D.playing?0:9e3;D.show()},
    tick(dt){if(!D.playing||D.cur<0)return;D.t+=dt;if(D.t>=total[D.cur]){D.cur=(D.cur+1)%steps.length;D.t=0}D.show()},
    setPlay(v){D.playing=v;playB.textContent=v?'Pause':'Play';playB.setAttribute('aria-pressed',String(!v));if(!v&&D.cur>=0)D.t=Math.max(D.t,9e3);else if(v&&D.cur<0)D.go(0);else if(v)D.t=0}
  };
  dots.forEach((b,i)=>b.onclick=()=>D.go(i));
  $('.back',host).onclick=()=>D.go(D.cur<0?0:D.cur-1);
  $('.next',host).onclick=()=>D.go(D.cur+1);
  playB.onclick=()=>D.setPlay(!D.playing);
  playB.textContent=D.playing?'Pause':'Play';playB.setAttribute('aria-pressed',String(!D.playing));
  D.show();
  new IntersectionObserver(es=>es.forEach(e=>{D.visible=e.isIntersecting;if(e.isIntersecting){live.add(D);if(D.cur<0&&D.playing)D.go(0)}else live.delete(D)}),{threshold:.35}).observe(host);
  return D;
}
let last=performance.now();
(function loop(now){const dt=Math.min(80,now-last);last=now;live.forEach(d=>d.tick(dt));requestAnimationFrame(loop)})(last);

W.sqsvis=(h)=>{

  <p class="note" id="p-note"></p></div>`;
  const f=()=>{const P=+$('#p-proc',h).value,V=+$('#p-vis',h).value,x=t=>20+t*(580/300),dup=V<P;
    $('#pv',h).textContent=P;$('#vv',h).textContent=V;
    let s='';for(let t=0;t<=300;t+=50)s+=`<line x1="${x(t)}" x2="${x(t)}" y1="18" y2="130" stroke="var(--line)"/><text x="${x(t)}" y="144" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--f-mono)">${t}s</text>`;
    const bar=(t0,t1,y,c,l)=>`<rect x="${x(t0)}" y="${y}" width="${Math.max(2,x(t1)-x(t0))}" height="22" rx="5" fill="${c}" opacity=".85"/><text x="${x(t0)+6}" y="${y+15}" font-size="10.5" fill="var(--panel)" font-family="var(--f-mono)" font-weight="600">${l}</text>`;
    s+=bar(0,P,22,'var(--k-svc)','Consumer A processing');
    s+=bar(0,V,52,'var(--k-queue)','Hidden from others');
    if(dup){s+=bar(V,V+P,82,'var(--k-fail)','Consumer B: duplicate');s+=`<line x1="${x(V)}" x2="${x(V)}" y1="18" y2="110" stroke="var(--k-fail)" stroke-width="2" stroke-dasharray="4 3"/>`}
    else s+=`<text x="${x(P)+8}" y="38" font-size="11" fill="var(--ok)" font-family="var(--f-mono)" font-weight="600">✓ deleted at ${P}s</text>`;

W.iam=(h)=>{

function spy(){
  const y=scrollY+120;let cur=secs[0];for(const s of secs){if(s.offsetTop<=y)cur=s}
  const a=links[cur.id];$$('#rail a.on').forEach(x=>x.classList.remove('on'));
  if(a){a.classList.add('on');if(innerWidth>980){const r=a.getBoundingClientRect(),rr=rail.getBoundingClientRect();if(r.top<rr.top+10||r.bottom>rr.bottom-10)a.scrollIntoView({block:'center'})}else{rail.scrollLeft=a.offsetLeft-40}}
  const d=cur.dataset.d||'0';document.documentElement.style.setProperty('--c',dvar(d));
  bar.style.width=(scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+'%';
}
let tk=0;addEventListener('scroll',()=>{if(!tk){tk=requestAnimationFrame(()=>{tk=0;spy()})}},{passive:true});spy();
/* numbers */
const svcs=[...new Set(NUMS.map(n=>n[0]))];let nf='All';
$('#n-f').innerHTML=['All',...svcs].map(s=>`<button class="btn ${s==='All'?'on':''}" type="button">${s}</button>`).join('');
function nrender(){const q=$('#n-q').value.toLowerCase();$('#n-b').innerHTML=NUMS.filter(n=>(nf==='All'||n[0]===nf)&&n.join(' ').toLowerCase().includes(q)).map(n=>`<tr><td>${esc(n[0])}</td><td>${esc(n[1])}</td><td class="v">${esc(n[2])}</td></tr>`).join('')||'<tr><td colspan="3">No matches.</td></tr>'}
$('#n-q').oninput=nrender;$$('#n-f .btn').forEach(b=>b.onclick=()=>{nf=b.textContent;$$('#n-f .btn').forEach(x=>x.classList.toggle('on',x===b));nrender()});nrender();
/* keywords */
let drill=false;
function krender(){const q=$('#k-q').value.toLowerCase();$('#k-b').className='kw'+(drill?' drill':'');$('#k-b').innerHTML=KW.filter(k=>k.join(' ').toLowerCase().includes(q)).map(k=>`<div>${esc(k[0])}</div><div>${esc(k[1])}</div>`).join('')}
$('#k-q').oninput=krender;$('#k-d').onclick=e=>{drill=!drill;e.target.setAttribute('aria-pressed',drill);e.target.classList.toggle('on',drill);krender()};
$('#k-b').onclick=e=>{const c=e.target.closest('.drill>div:nth-child(even)');if(c)c.classList.toggle('shown')};krender();
/* practice */
let qf=0;const ans={};
$('#q-f').innerHTML=['All',1,2,3,4].map(x=>`<button class="btn ${x==='All'?'on':''}" type="button" data-f="${x==='All'?0:x}">${x==='All'?'All':'Domain '+x}</button>`).join('');
function qrender(){
  $('#q-l').innerHTML=QS.filter(q=>!qf||q.d===qf).map(q=>{const a=ans[q.n];return`<div class="q" style="--c:${dvar(q.d)}" data-n="${q.n}"><h4><span>Q${q.n}</span>${esc(q.q)}</h4><div class="opts">${q.o.map((o,i)=>`<button type="button" data-i="${i}" ${a!=null?'disabled':''} class="${a!=null?(i===q.a?'right':i===a?'wrong':''):''}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>${a!=null?`<p class="ex"><b style="color:${a===q.a?'var(--ok)':'var(--k-fail)'}">${a===q.a?'Correct.':'Not quite. The answer is '+'ABCD'[q.a]+'.'}</b> ${esc(q.x)}</p>`:''}</div>`}).join('');
  const done=Object.keys(ans).length,ok=QS.filter(q=>ans[q.n]===q.a).length;$('#q-s').textContent=done?`Score ${ok}/${done} · ${QS.length-done} left`:`${QS.length} questions`;
}
$('#q-l').onclick=e=>{const b=e.target.closest('.opts button');if(!b)return;ans[+b.closest('.q').dataset.n]=+b.dataset.i;qrender()};
$('#q-r').onclick=()=>{for(const k in ans)delete ans[k];qrender()};
$$('#q-f .btn').forEach(b=>b.onclick=()=>{qf=+b.dataset.f;$$('#q-f .btn').forEach(x=>x.classList.toggle('on',x===b));qrender()});qrender();
/* checklist */
const ck=store.get('dva-ck',{});$$('#ck input').forEach(i=>{i.checked=!!ck[i.dataset.c];i.onchange=()=>{ck[i.dataset.c]=i.checked;store.set('dva-ck',ck)}});
/* theme */
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
})();
</script>

</body></html>
