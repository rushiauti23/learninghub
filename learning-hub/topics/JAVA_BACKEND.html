<style>
/* Layout: fixed topic index on the left, one reading column on the right; drawer on phones. */
:root{
  --paper:#E9EEEC; --sheet:#F7F9F8; --ink:#17201E; --muted:#56635F; --rule:#CCD5D2;
  --accent:#0C6A61; --accent-soft:#D3E8E3; --warn:#8C5200; --warn-soft:#F4E6CF;
  --code-bg:#16201E; --code-fg:#DCE6E2; --code-dim:#7F948E;
  --c-kw:#7FD3C6; --c-str:#E8C27A; --c-com:#7F948E; --c-ann:#C9A6F2; --c-num:#F29B85; --c-type:#A9CCF5;
  --f-ui:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --step-0:1.0625rem; --step-1:1.25rem; --step-2:1.6rem; --step-3:2.35rem;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1513; --sheet:#141C1A; --ink:#E3EBE8; --muted:#94A6A1; --rule:#2A3633;
  --accent:#5CC4B6; --accent-soft:#183A35; --warn:#E3A84E; --warn-soft:#33270F;
  --code-bg:#0A0F0E; --code-fg:#DCE6E2; --code-dim:#6F837E; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F1513; --sheet:#141C1A; --ink:#E3EBE8; --muted:#94A6A1; --rule:#2A3633;
  --accent:#5CC4B6; --accent-soft:#183A35; --warn:#E3A84E; --warn-soft:#33270F;
  --code-bg:#0A0F0E; --code-fg:#DCE6E2; --code-dim:#6F837E; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper); color:var(--ink); font-family:var(--f-ui); font-size:15px; line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.app{display:grid; grid-template-columns:300px minmax(0,1fr); min-height:100%}

/* ---------- index ---------- */
.index{position:sticky; top:env(safe-area-inset-top,0px); height:100vh; height:100dvh; overflow-y:auto;
  border-right:1px solid var(--rule); padding:22px 18px 40px; display:flex; flex-direction:column; gap:18px; background:var(--paper)}
.brand{display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink)}
.brand b{font-size:1.05rem; font-weight:700; letter-spacing:-.01em}
.brand span{color:var(--muted); font-size:.82rem}
.search{position:relative}
.search input{width:100%; font:inherit; font-size:.9rem; padding:8px 10px 8px 32px; border:1px solid var(--rule); border-radius:6px; background:var(--sheet); color:var(--ink)}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--muted); fill:none}
.overall{font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:6px}
.bar{height:4px; background:var(--rule); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
.tracks{display:flex; flex-direction:column; gap:14px}
.track h3{margin:0 0 4px; font-size:.78rem; font-weight:600; color:var(--muted); display:flex; justify-content:space-between; gap:8px; letter-spacing:.02em}
.track h3 em{font-style:normal; font-variant-numeric:tabular-nums; font-weight:500}
.track ul{list-style:none; margin:0; padding:0}
.track a{display:flex; align-items:baseline; gap:8px; padding:5px 8px; border-radius:5px; text-decoration:none; color:var(--ink); font-size:.9rem; line-height:1.3}
.track a:hover{background:var(--sheet)}
.track a[aria-current="page"]{background:var(--accent-soft); color:var(--ink); font-weight:600}
.track a .dot{flex:none; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--muted); transform:translateY(-1px)}
.track a.done .dot{background:var(--accent); border-color:var(--accent)}
.empty-search{font-size:.85rem; color:var(--muted)}

/* ---------- reading column ---------- */
main{min-width:0; padding-inline:clamp(16px,4vw,56px); padding-block:28px 80px}
.sheet{max-width:46rem; margin-inline:auto}
.topbar{display:none}
.crumb{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.82rem; color:var(--muted)}

.tag.jep{border-color:var(--accent); color:var(--accent)}
h1{font-size:var(--step-3); line-height:1.1; letter-spacing:-.025em; margin:10px 0 14px; text-wrap:balance; font-weight:700}
.lede{font-family:var(--f-read); font-size:1.3rem; line-height:1.45; color:var(--ink); margin:0 0 28px; padding-left:18px; border-left:3px solid var(--accent); font-style:italic; max-width:40rem}
.prose{font-family:var(--f-read); font-size:var(--step-0); line-height:1.68}
.prose p, .prose li{max-width:40rem}
.prose h2{font-family:var(--f-ui); font-size:var(--step-2); letter-spacing:-.015em; margin:2.4em 0 .6em; text-wrap:balance; line-height:1.2}
.prose h2:first-child{margin-top:0}
.prose h3{font-family:var(--f-ui); font-size:var(--step-1); margin:1.9em 0 .5em; line-height:1.25}
.prose strong{font-weight:600}
.prose code{font-family:var(--f-code); font-size:.84em; background:var(--accent-soft); padding:1px 5px; border-radius:3px; overflow-wrap:anywhere}
.prose ol,.prose ul{padding-left:1.4em}
.prose li{margin:.35em 0}
.table-wrap{overflow-x:auto; margin:1.4em 0; border:1px solid var(--rule); border-radius:6px; background:var(--sheet)}
table{border-collapse:collapse; width:100%; font-family:var(--f-ui); font-size:.88rem; line-height:1.45}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
th{font-weight:600; color:var(--muted); font-size:.8rem; background:var(--paper)}
tr:last-child td{border-bottom:0}
td code{background:transparent; padding:0; white-space:nowrap}

/* code */
figure.code{margin:1.5em 0; background:var(--code-bg); color:var(--code-fg); border-radius:8px; overflow:hidden; font-family:var(--f-ui)}
figure.code .head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 10px 7px 14px; border-bottom:1px solid rgba(127,148,142,.25)}
figure.code figcaption{font-size:.8rem; color:var(--code-dim); min-width:0}
figure.code .copy{flex:none; font:inherit; font-size:.75rem; color:var(--code-fg); background:transparent; border:1px solid rgba(127,148,142,.4); border-radius:4px; padding:3px 9px; cursor:pointer}
figure.code .copy:hover{border-color:var(--c-kw)}
figure.code pre{margin:0; padding:14px 16px 16px; overflow-x:auto; font-family:var(--f-code); font-size:.82rem; line-height:1.6; tab-size:4}
figure.code pre code{background:none; padding:0; font-size:inherit; overflow-wrap:normal}
.k{color:var(--c-kw)} .s{color:var(--c-str)} .c{color:var(--c-com); font-style:italic} .a{color:var(--c-ann)} .n{color:var(--c-num)} .t{color:var(--c-type)}

/* traps & questions */
ul.traps{list-style:none; padding:0; display:flex; flex-direction:column; gap:10px}
ul.traps li{background:var(--warn-soft); padding:11px 14px 11px 40px; border-radius:6px; position:relative; margin:0; max-width:none; font-size:.98rem}
ul.traps li::before{content:"!"; position:absolute; left:13px; top:11px; width:17px; height:17px; border-radius:50%; background:var(--warn); color:var(--sheet); font:700 .72rem/17px var(--f-ui); text-align:center}
details.q{border:1px solid var(--rule); border-radius:6px; background:var(--sheet); margin:10px 0}
details.q summary{cursor:pointer; padding:12px 14px 12px 38px; position:relative; font-family:var(--f-ui); font-weight:500; font-size:.95rem; line-height:1.45; list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"?"; position:absolute; left:12px; top:12px; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--accent); color:var(--accent); font:600 .72rem/15px var(--f-ui); text-align:center}
details.q[open] summary{border-bottom:1px solid var(--rule)}
details.q .ans{padding:12px 14px 14px 38px; font-size:.98rem}

/* figures */
.fig{margin:1.6em 0; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:14px; overflow-x:auto}
.fig svg{display:block; width:100%; min-width:520px; height:auto}
.fig .cap{font-family:var(--f-ui); font-size:.82rem; color:var(--muted); margin:8px 0 0}
.fig text{font-family:var(--f-ui); fill:var(--ink); text-anchor:middle}
.fig text[text-anchor="start"]{text-anchor:start}
.f-t{font-size:12.5px; font-weight:600}
.f-s{font-size:11px; fill:var(--muted)!important}
.f-box{fill:var(--paper); stroke:var(--rule); stroke-width:1.2; rx:6}
.f-in{fill:var(--sheet); stroke:var(--rule); stroke-width:1; rx:4}
.f-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; rx:6}
.f-arrow{stroke:var(--muted); stroke-width:1.4; fill:none; marker-end:url(#arr)}
.f-rule{stroke:var(--rule); stroke-dasharray:3 4}
#arr path{fill:var(--muted)}

/* lesson footer */
.done-row{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:44px 0 18px; padding:16px 0; border-top:1px solid var(--rule)}
.btn{font:inherit; font-size:.9rem; font-weight:600; padding:9px 16px; border-radius:6px; border:1.5px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--sheet)}
.done-row small{color:var(--muted)}
.pager{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pager a{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border:1px solid var(--rule); border-radius:6px; text-decoration:none; color:var(--ink); background:var(--sheet); min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager a span{font-size:.78rem; color:var(--muted)}
.pager a b{font-weight:600; font-size:.95rem}
.pager a.next{text-align:right; grid-column:2}

/* start page */
.release{margin:28px 0 36px; overflow-x:auto}
.release svg{display:block; min-width:600px; width:100%; height:auto}
.release text{font-family:var(--f-ui); fill:var(--ink); text-anchor:middle}
.release .yr{font-size:11px; fill:var(--muted)}
.release .ver{font-size:15px; font-weight:700}
.release .lts{fill:var(--accent)}
.release .nonlts{fill:var(--rule)}
.release line{stroke:var(--rule); stroke-width:2}
.release a:hover .ver{fill:var(--accent)}
.release .hl{font-size:11px; fill:var(--muted)}
.trackgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin:18px 0 0}
.trackcard{border:1px solid var(--rule); border-radius:8px; padding:16px; background:var(--sheet); display:flex; flex-direction:column; gap:8px; min-width:0}
.trackcard h3{margin:0; font-size:1.05rem}
.trackcard p{margin:0; font-size:.88rem; color:var(--muted); font-family:var(--f-ui); line-height:1.45}
.trackcard ol{margin:4px 0 0; padding-left:1.2em; font-family:var(--f-ui); font-size:.88rem}
.trackcard ol a{color:var(--ink); text-decoration:none}
.trackcard ol a:hover{color:var(--accent); text-decoration:underline}
.anatomy{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-family:var(--f-ui); font-size:.92rem; margin:14px 0}

/* predicate lab + tree figure */
.f-line{stroke:var(--muted); stroke-width:1.3; fill:none}

.lab{margin:1.4em 0; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); padding:16px; font-family:var(--f-ui); display:flex; flex-direction:column; gap:12px; min-width:0}
.lab figure.code{margin:0}
.lab-controls{display:flex; flex-direction:column; gap:10px}
.lab-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.lab-term{display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--paper)}
.lab select{font:inherit; font-size:.88rem; padding:5px 8px; border-radius:5px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink)}
.lab-not{display:inline-flex; align-items:center; gap:5px; font-size:.86rem; color:var(--muted); cursor:pointer}
.lab-sel{display:inline-flex; align-items:center; gap:8px; font-size:.86rem; color:var(--muted)}
.lab-summary{margin:0; font-size:.92rem; line-height:1.5}
.lab-summary code{font-family:var(--f-code); font-size:.84em; background:var(--accent-soft); padding:1px 5px; border-radius:3px}
.lab .table-wrap{margin:0}
.lab-table td{white-space:nowrap}
.lab-table td.num{font-variant-numeric:tabular-nums; text-align:right}
.lab-table tr.lab-off td{color:var(--muted); opacity:.6}
.chips{display:flex; gap:4px; flex-wrap:nowrap}
.chip{display:inline-block; font-family:var(--f-code); font-size:.74rem; padding:1px 6px; border-radius:4px; border:1px solid transparent; white-space:nowrap}
.chip.yes{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.chip.no{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}
.chip.skip{color:var(--muted); border:1px dashed var(--muted); text-decoration:line-through}
.muted{color:var(--muted)}

/* phones */
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .index{position:fixed; inset:0 auto 0 0; width:min(320px,86vw); z-index:20; transform:translateX(-102%); transition:transform .22s ease; box-shadow:0 0 0 100vmax transparent; padding-top:calc(22px + env(safe-area-inset-top,0px))}
  body.nav-open .index{transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex; position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--paper); margin:-28px -16px 20px; padding:10px 16px; border-bottom:1px solid var(--rule); align-items:center; gap:12px}
  .topbar button{font:inherit; font-weight:600; font-size:.88rem; padding:6px 12px; border-radius:6px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink)}
  .topbar span{font-size:.85rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  h1{font-size:1.85rem}
  .lede{font-size:1.12rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

<script>
const T = [];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW = "abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits yield when non-sealed true false null";
const HL = new RegExp(String.raw`(\/\*[\s\S]*?\*\/|\/\/[^\n]*|^[ \t]*#[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*")|(@[A-Za-z_]\w*)|\b(` + KW.split(" ").map(k=>k.replace("-","\\-")).join("|") + String.raw`)\b|\b(\d[\d_]*(?:\.\d+)?[LlFfDd]?)\b|\b([A-Z][A-Za-z0-9_]*)\b`, "gm");
function hl(src){
  let out = "", last = 0, m; HL.lastIndex = 0;
  while ((m = HL.exec(src))){
    out += esc(src.slice(last, m.index));
    const cls = m[1]?"c":m[2]?"s":m[3]?"a":m[4]?"k":m[5]?"n":"t";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = HL.lastIndex;
    if (m[0].length === 0) HL.lastIndex++;
  }
  return out + esc(src.slice(last));
}
let codeId = 0;
function J(code, cap){
  const id = "code" + (codeId++);
  return `<figure class="code"><div class="head"><figcaption>${cap ? esc(cap) : ""}</figcaption><button class="copy" data-copy="${id}" type="button">Copy</button></div><pre><code id="${id}">${hl(code.replace(/^\n+|\s+$/g,""))}</code></pre></figure>`;
}
function Q(q, a){ return `<details class="q"><summary>${q}</summary><div class="ans">${a}</div></details>`; }
</script>
<script>
/* ===================== JAVA 8 ===================== */
T.push({
id:"j8-lambdas", track:"java8", title:"Lambdas & functional interfaces", since:"JDK 8", jep:"JEP 126",
lede:"A lambda is a value that holds behaviour. Once behaviour can be passed around like data, a whole style of API becomes possible.",
html:`
<h2>Start from the problem</h2>
<p>Before Java 8, a method could accept numbers, strings and objects, but it could not accept <em>a piece of code</em>. If you wanted a sort to compare by name, you had to wrap that one line of logic inside a whole class. The language had no way to say "here is some behaviour, run it later".</p>
${J(String.raw`// Java 7: six lines of ceremony around one line of logic
Collections.sort(people, new Comparator<Person>() {
    @Override
    public int compare(Person a, Person b) {
        return a.getName().compareTo(b.getName());
    }
});`,"Anonymous inner class: the only way to pass behaviour before Java 8")}
<p>Ask the first-principles question: what is the <em>minimum</em> information the compiler needs here? It already knows <code>sort</code> wants a <code>Comparator&lt;Person&gt;</code>. A Comparator has exactly one abstract method. So the only things you really need to supply are the parameter names and the body. Everything else is noise the compiler can infer.</p>

<h2>Build it up</h2>
<p>That inference is the whole idea. An interface with exactly one abstract method is a <strong>functional interface</strong>. Anywhere one is expected, you can write a lambda, and the compiler fills in the rest from the <em>target type</em>.</p>
${J(String.raw`people.sort((a, b) -> a.getName().compareTo(b.getName()));

// Even shorter: a method reference names an existing method as the behaviour
people.sort(Comparator.comparing(Person::getName));`)}
<p>Notice that a lambda has no type of its own. <code>(a, b) -&gt; ...</code> means nothing until it lands somewhere that expects a functional interface. The same lambda text could become a <code>Comparator</code> or a <code>BiFunction</code> depending on where you put it.</p>
<p>Java 8 ships a toolkit of general-purpose functional interfaces in <code>java.util.function</code>. Learn the four shapes and the rest are variations:</p>
<div class="table-wrap"><table>
<thead><tr><th>Interface</th><th>Shape</th><th>Think of it as</th></tr></thead>
<tbody>
<tr><td><code>Supplier&lt;T&gt;</code></td><td><code>() -&gt; T</code></td><td>A factory. Gives you something.</td></tr>
<tr><td><code>Consumer&lt;T&gt;</code></td><td><code>T -&gt; void</code></td><td>A sink. Takes something, returns nothing.</td></tr>
<tr><td><code>Function&lt;T,R&gt;</code></td><td><code>T -&gt; R</code></td><td>A transformation.</td></tr>
<tr><td><code>Predicate&lt;T&gt;</code></td><td><code>T -&gt; boolean</code></td><td>A test.</td></tr>
</tbody></table></div>
<p>Prefixes add arity (<code>BiFunction</code>), specialise the type (<code>UnaryOperator&lt;T&gt;</code> is a <code>Function&lt;T,T&gt;</code>) or avoid boxing (<code>IntPredicate</code>, <code>ToLongFunction</code>).</p>
${J(String.raw`Predicate<String> notBlank = s -> !s.isBlank();
Predicate<String> shortWord = s -> s.length() < 5;
Predicate<String> both = notBlank.and(shortWord);   // composition

Function<Integer, Integer> doubled = x -> x * 2;
Function<Integer, Integer> plusOne = x -> x + 1;
doubled.andThen(plusOne).apply(5);   // 11
doubled.compose(plusOne).apply(5);   // 12

@FunctionalInterface               // compiler error if you add a 2nd abstract method
interface RateRule {
    BigDecimal apply(BigDecimal baseRate);
}`,"Functional interfaces compose because they are just objects with default methods")}

<h3>Capturing variables</h3>
<p>A lambda can read local variables from the surrounding method, but only if they are <strong>effectively final</strong> (never reassigned). The reason is physical: the lambda may run after the method returns, on another thread, when the stack frame holding that local is gone. So Java copies the value into the lambda. If the variable could still change, the copy would silently go stale. Forbidding reassignment makes the copy always correct.</p>
${J(String.raw`int threshold = 10;
list.removeIf(x -> x > threshold);   // OK: threshold is effectively final

int count = 0;
list.forEach(x -> count++);          // compile error: count is reassigned`)}

<h2>Under the hood</h2>
<p>Anonymous classes compile to a separate <code>Outer$1.class</code> file. Lambdas do not. The compiler turns the body into a private static (or instance) method and emits an <code>invokedynamic</code> instruction. On first execution, the JVM calls <code>LambdaMetafactory</code>, which spins up a small class implementing the interface at runtime. Non-capturing lambdas are typically created once and reused, so they cost almost nothing.</p>
${J(String.raw`// javap -c -p Demo.class (trimmed)
invokedynamic #7, 0  // InvokeDynamic #0:compare:()Ljava/util/Comparator;
...
private static int lambda$main$0(Person, Person);`,"The lambda body becomes lambda$main$0; invokedynamic links it lazily")}
<p>One consequence: inside a lambda, <code>this</code> refers to the enclosing object, not to the lambda. In an anonymous class, <code>this</code> is the anonymous instance.</p>

<h2>Traps</h2>
<ul class="traps">
<li>Checked exceptions: <code>Function.apply</code> declares none, so a lambda calling <code>Files.readString</code> will not compile. Wrap it, or define your own functional interface that <code>throws IOException</code>.</li>
<li>Overload ambiguity: <code>submit(() -&gt; doWork())</code> can match both <code>Runnable</code> and <code>Callable</code>. If <code>doWork</code> returns a value, Java picks <code>Callable</code>.</li>
<li>Long lambdas hurt stack traces and readability. Past three lines, extract a named method and use a method reference.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why must captured locals be effectively final, while fields can be mutated freely inside a lambda?","Locals live on the stack frame, which may be gone when the lambda runs, so the lambda holds a copy. Fields live on the heap inside an object; the lambda captures a reference to <code>this</code>, so it reads the live field, not a copy. (Thread-safety of that field is then your problem.)")}
${Q("Is <code>Comparator</code> a functional interface even though it declares <code>equals</code>?","Yes. <code>equals</code> is a public method of <code>Object</code>, so it does not count toward the single abstract method. Default and static methods do not count either.")}
`});

T.push({
id:"j8-streams", track:"java8", title:"Streams", since:"JDK 8", jep:"JEP 107",
lede:"A stream is a description of a computation over data, not a container of data. Nothing runs until you ask for a result.",
html:`
<h2>Start from the problem</h2>
<p>Most loops over collections do one of a few things: filter, transform, aggregate. Written as loops, every one of them mixes <em>what</em> you want with <em>how</em> to iterate, plus temporary lists and mutable counters.</p>
${J(String.raw`// "Total outstanding of active loans above 100k, by product"
Map<String, BigDecimal> totals = new HashMap<>();
for (Loan l : loans) {
    if (l.isActive() && l.getAmount().compareTo(BIG) > 0) {
        totals.merge(l.getProduct(), l.getOutstanding(), BigDecimal::add);
    }
}`)}
<p>The intent is three steps: keep some, look at one field, group and sum. Streams let you write exactly those steps and leave the iteration to the library.</p>
${J(String.raw`Map<String, BigDecimal> totals = loans.stream()
    .filter(Loan::isActive)
    .filter(l -> l.getAmount().compareTo(BIG) > 0)
    .collect(Collectors.groupingBy(
        Loan::getProduct,
        Collectors.reducing(BigDecimal.ZERO, Loan::getOutstanding, BigDecimal::add)));`)}

<h2>Build it up: the pipeline model</h2>
<p>Every stream has three parts:</p>
<ol>
<li><strong>Source</strong>: a collection, array, file lines, <code>IntStream.range</code>, a generator.</li>
<li><strong>Intermediate operations</strong>: <code>filter</code>, <code>map</code>, <code>flatMap</code>, <code>sorted</code>, <code>distinct</code>, <code>limit</code>. Each returns a new stream. None of them does any work yet.</li>
<li><strong>Terminal operation</strong>: <code>collect</code>, <code>forEach</code>, <code>reduce</code>, <code>count</code>, <code>findFirst</code>, <code>anyMatch</code>. This triggers the whole pipeline.</li>
</ol>
<p>The key mental shift is that elements flow through the pipeline <em>one at a time</em>, vertically, not stage by stage. Run this and read the output:</p>
${J(String.raw`Stream.of("a", "bb", "ccc", "dddd")
    .filter(s -> { System.out.println("filter " + s); return s.length() > 1; })
    .map(s -> { System.out.println("map " + s); return s.toUpperCase(); })
    .findFirst();

// filter a
// filter bb
// map bb        <- stops here. "ccc" and "dddd" are never touched.`,"Laziness plus short-circuiting: only as much work as the result needs")}
<p>This is why <code>limit</code>, <code>findFirst</code> and <code>anyMatch</code> can work on infinite streams such as <code>Stream.iterate(1, n -&gt; n * 2)</code>.</p>

<h3>Stateless vs stateful operations</h3>
<p><code>filter</code> and <code>map</code> decide about one element without seeing others. <code>sorted</code> and <code>distinct</code> cannot: <code>sorted</code> must see every element before emitting the first. That makes them barriers that buffer the whole stream, which matters for memory and parallel performance.</p>

<h3>flatMap</h3>
<p><code>map</code> is one-in, one-out. <code>flatMap</code> is one-in, zero-or-more-out: each element becomes a stream, and the streams are concatenated.</p>
${J(String.raw`List<Order> orders = ...;
List<LineItem> allItems = orders.stream()
    .flatMap(o -> o.getItems().stream())
    .toList();          // Java 16+. On Java 8 use .collect(Collectors.toList())`)}

<h3>Collectors are the real power</h3>
${J(String.raw`// group, then count per group
Map<Status, Long> byStatus = loans.stream()
    .collect(Collectors.groupingBy(Loan::getStatus, Collectors.counting()));

// split into two buckets
Map<Boolean, List<Loan>> parts = loans.stream()
    .collect(Collectors.partitioningBy(l -> l.getRate().compareTo(CAP) > 0));

// to a map keyed by id; third arg resolves duplicate keys
Map<Long, Loan> byId = loans.stream()
    .collect(Collectors.toMap(Loan::getId, l -> l, (a, b) -> a));

String csv = names.stream().collect(Collectors.joining(", ", "[", "]"));`)}

<h2>Under the hood</h2>
<p>A pipeline is built as a linked chain of <code>Sink</code> objects. When the terminal operation runs, the source's <code>Spliterator</code> pushes each element into the first sink, which passes it on to the next. Laziness falls out naturally: nothing calls the spliterator until the terminal op does.</p>
<p><code>parallelStream()</code> uses the same spliterator to split the source in halves, recursively, and runs the pieces on the common <code>ForkJoinPool</code> (size = CPU cores − 1). It only pays off for large, CPU-bound work on splittable sources (arrays, <code>ArrayList</code>), not for <code>LinkedList</code> or I/O.</p>

<h2>Traps</h2>
<ul class="traps">
<li>A stream can be consumed only once. A second terminal call throws <code>IllegalStateException</code>.</li>
<li>Do not mutate shared state from <code>forEach</code> or <code>map</code>. Use a collector instead. With a parallel stream, adding to an <code>ArrayList</code> loses elements or throws.</li>
<li><code>Collectors.toMap</code> throws on duplicate keys and on <code>null</code> values unless you pass a merge function.</li>
<li><code>parallelStream()</code> in a web request steals threads from the shared common pool used by every other parallel stream and <code>CompletableFuture</code> default in the JVM.</li>
<li><code>peek</code> is for debugging. In Java 9+, <code>count()</code> may skip it entirely if the size is known.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why does <code>Stream.iterate(1, x -> x + 1).sorted().findFirst()</code> never finish?","<code>sorted</code> is stateful and must consume the entire stream before emitting anything. The source is infinite, so it never finishes buffering. <code>findFirst</code> never gets a chance to short-circuit.")}
${Q("When is <code>reduce</code> the wrong tool for building a list?","Always for mutable containers. <code>reduce</code> assumes immutable values combined with an associative function. To accumulate into a mutable container, use <code>collect</code>, which is designed for mutable reduction and is safe in parallel.")}
`});

T.push({
id:"j8-optional", track:"java8", title:"Optional", since:"JDK 8", jep:null,
lede:"Optional makes 'there may be no value' part of a method's return type, so the caller cannot forget to handle it.",
html:`
<h2>Start from the problem</h2>
<p>A method that returns <code>Customer</code> might return <code>null</code>. Nothing in the signature tells you. The caller has to read docs, remember, and check. When they forget, you get a <code>NullPointerException</code> far from the cause.</p>
<p>The first-principles fix is to move "absence" from the runtime (a special null reference) into the type system (a different type). If the method returns <code>Optional&lt;Customer&gt;</code>, you cannot call <code>getName()</code> on it directly. The compiler forces you to decide what happens when it is empty.</p>

<h2>Build it up</h2>
${J(String.raw`Optional<Customer> findByEmail(String email) {
    return Optional.ofNullable(repo.get(email));   // null becomes Optional.empty()
}

// Transform and fall back, without a single null check
String city = findByEmail(email)
    .map(Customer::getAddress)        // Optional<Address>
    .map(Address::getCity)            // Optional<String>
    .filter(c -> !c.isBlank())
    .orElse("Unknown");

// When absence is a bug, fail loudly with a meaningful exception
Customer c = findByEmail(email)
    .orElseThrow(() -> new CustomerNotFound(email));`,"map skips the function when empty; orElse/orElseThrow end the chain")}
<p><code>map</code> vs <code>flatMap</code>: if your function already returns an <code>Optional</code>, <code>map</code> would give you <code>Optional&lt;Optional&lt;X&gt;&gt;</code>. <code>flatMap</code> flattens it.</p>
${J(String.raw`Optional<Account> acc = findByEmail(email).flatMap(this::primaryAccount);
// primaryAccount(Customer) returns Optional<Account>`)}

<h3>orElse vs orElseGet</h3>
<p><code>orElse(x)</code> evaluates <code>x</code> <em>always</em>, because Java evaluates arguments before the call. <code>orElseGet(supplier)</code> calls the supplier only when empty. This matters when the fallback is expensive or has side effects.</p>
${J(String.raw`opt.orElse(loadDefaultFromDb());        // DB hit every time, even when present
opt.orElseGet(() -> loadDefaultFromDb()); // DB hit only when empty`)}

<h2>Where Optional belongs</h2>
<p>It was designed as a <strong>return type</strong> for queries that may have no result. It is not a general null replacement.</p>
<ul>
<li>Do: return <code>Optional</code> from finders and lookups (Spring Data does this: <code>findById</code>).</li>
<li>Do not: use it for fields, method parameters, or collection elements. It is not <code>Serializable</code>, adds an allocation, and an <code>Optional</code> parameter still accepts <code>null</code>.</li>
<li>Do not: return <code>Optional&lt;List&lt;X&gt;&gt;</code>. Return an empty list.</li>
</ul>

<h2>Traps</h2>
<ul class="traps">
<li><code>opt.get()</code> without a check is just a null dereference with a different exception. Java 10 added <code>orElseThrow()</code> with no args as the clearer name for it.</li>
<li><code>if (opt.isPresent()) { opt.get() }</code> works, but usually means you wanted <code>map</code>, <code>ifPresent</code> or (Java 9) <code>ifPresentOrElse</code>.</li>
<li><code>Optional.of(null)</code> throws immediately. Use <code>ofNullable</code> when the input may be null.</li>
</ul>

<h2>Check yourself</h2>
${Q("A method returns <code>Optional&lt;User&gt;</code> but sometimes returns <code>null</code>. What happens?","The caller's chain (<code>.map</code>, <code>.orElse</code>) throws a <code>NullPointerException</code> because it is calling methods on a null reference. A method returning Optional must never return null; that defeats the whole contract.")}
`});

T.push({
id:"j8-time", track:"java8", title:"java.time", since:"JDK 8", jep:"JEP 150",
lede:"Separate the instant something happened from how a human in some place would write it down. java.time gives each idea its own type.",
html:`
<h2>Start from the problem</h2>
<p><code>java.util.Date</code> was misnamed (it is an instant, not a date), mutable (anyone holding a reference can change it), had zero-based months, and <code>SimpleDateFormat</code> was not thread-safe. Worse, it blurred together several different concepts.</p>
<p>From first principles there are really three different questions:</p>
<ol>
<li><strong>When did it happen, absolutely?</strong> A point on the global timeline. Same for everyone on Earth.</li>
<li><strong>What did the calendar and clock on the wall say?</strong> "15 March 2026, 09:00", with no location attached.</li>
<li><strong>Where?</strong> A time zone, with rules for offsets and daylight saving that change over history.</li>
</ol>
<p>java.time (designed from Joda-Time) gives each combination its own immutable type.</p>

<div class="table-wrap"><table>
<thead><tr><th>Type</th><th>Holds</th><th>Use for</th></tr></thead>
<tbody>
<tr><td><code>Instant</code></td><td>Seconds + nanos since 1970-01-01T00:00Z</td><td>Timestamps, logs, DB audit columns</td></tr>
<tr><td><code>LocalDate</code></td><td>2026-03-15</td><td>Birthdays, contract start dates, interest periods</td></tr>
<tr><td><code>LocalDateTime</code></td><td>2026-03-15T09:00</td><td>Wall-clock time with no zone. Rarely the right choice for events.</td></tr>
<tr><td><code>ZonedDateTime</code></td><td>Local date-time + <code>ZoneId</code> (Europe/Amsterdam)</td><td>Scheduling things humans experience</td></tr>
<tr><td><code>OffsetDateTime</code></td><td>Local date-time + fixed offset (+02:00)</td><td>APIs and databases; ISO-8601 on the wire</td></tr>
<tr><td><code>Duration</code> / <code>Period</code></td><td>Machine time (seconds) / calendar time (days, months)</td><td>Timeouts vs "add 3 months"</td></tr>
</tbody></table></div>

<h2>Build it up</h2>
${J(String.raw`LocalDate start = LocalDate.of(2026, 3, 31);
LocalDate next  = start.plusMonths(1);          // 2026-04-30, clamped. Immutable: start unchanged.

ZoneId ams = ZoneId.of("Europe/Amsterdam");
ZonedDateTime meeting = ZonedDateTime.of(2026, 3, 28, 9, 0, 0, 0, ams);
meeting.plusDays(1);     // 2026-03-29T09:00+02:00: still 9am, DST already applied
meeting.plus(Duration.ofHours(24));  // 2026-03-29T10:00+02:00: exactly 24h later

Instant now = Instant.now();
ZonedDateTime inPune = now.atZone(ZoneId.of("Asia/Kolkata"));

long days = ChronoUnit.DAYS.between(start, LocalDate.of(2026, 12, 31));
Period p  = Period.between(start, LocalDate.of(2027, 6, 1));  // P1Y2M1D`,"plusDays respects the calendar; plus(Duration) respects physics")}
<p>The DST example above is the clearest demonstration of why <code>Period</code> and <code>Duration</code> are separate. "One day later" and "24 hours later" are different answers on the night clocks change.</p>

<h3>Formatting and parsing</h3>
${J(String.raw`// DateTimeFormatter is immutable and thread-safe: keep it in a static final
static final DateTimeFormatter NL = DateTimeFormatter.ofPattern("dd-MM-yyyy");

LocalDate d = LocalDate.parse("15-03-2026", NL);
String iso  = d.toString();                    // 2026-03-15 (ISO by default)`)}

<h3>Testability: inject a Clock</h3>
${J(String.raw`class InterestService {
    private final Clock clock;
    InterestService(Clock clock) { this.clock = clock; }
    boolean isExpired(LocalDate end) { return LocalDate.now(clock).isAfter(end); }
}

// test
var svc = new InterestService(Clock.fixed(Instant.parse("2026-01-01T00:00:00Z"), ZoneOffset.UTC));`)}

<h2>Traps</h2>
<ul class="traps">
<li>Using <code>LocalDateTime</code> for events. It cannot tell you when something happened, because it does not know where. Store <code>Instant</code> or <code>OffsetDateTime</code>.</li>
<li><code>yyyy</code> vs <code>YYYY</code> in patterns: <code>YYYY</code> is week-based year and gives the wrong year around New Year.</li>
<li><code>LocalDate.now()</code> uses the JVM's default zone. Servers in UTC and users in Amsterdam disagree around midnight.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why can't you add <code>Duration.ofDays(1)</code> to a <code>LocalDate</code>?","A <code>LocalDate</code> has no time-of-day, and a Duration is an exact number of seconds. Adding seconds to a date is meaningless. Use <code>plusDays</code> or a <code>Period</code>, which are calendar-based.")}
`});

T.push({
id:"j8-default", track:"java8", title:"Default & static interface methods", since:"JDK 8", jep:null,
lede:"Default methods let an interface grow without breaking every class that already implements it.",
html:`
<h2>Start from the problem</h2>
<p>Java 8 wanted to add <code>stream()</code> and <code>forEach()</code> to <code>Collection</code>. But <code>Collection</code> is an interface implemented by thousands of classes in libraries the JDK team does not control. Adding an abstract method would break every one of them at compile time, and at runtime they would throw <code>AbstractMethodError</code>.</p>
<p>The minimal fix: let an interface supply a body that implementers inherit unless they override it. That is a <strong>default method</strong>. It is fundamentally a tool for <em>interface evolution</em>.</p>

<h2>Build it up</h2>
${J(String.raw`public interface Collection<E> extends Iterable<E> {
    // ...existing abstract methods...
    default Stream<E> stream() {
        return StreamSupport.stream(spliterator(), false);
    }
    default boolean removeIf(Predicate<? super E> filter) { /* loop + iterator.remove */ }
}

public interface Validator<T> {
    boolean isValid(T t);
    default Validator<T> and(Validator<T> other) { return t -> isValid(t) && other.isValid(t); }
    static <T> Validator<T> alwaysTrue() { return t -> true; }   // static helper on the interface
}`)}

<h3>Resolving conflicts</h3>
<p>Now a class can inherit two bodies for the same method. Java resolves it with three rules, in order:</p>
<ol>
<li><strong>Classes win.</strong> A method from a superclass beats any interface default.</li>
<li><strong>More specific interface wins.</strong> If <code>B extends A</code> and both define <code>hello()</code>, <code>B</code>'s wins.</li>
<li>Otherwise it is ambiguous and you must override and choose explicitly.</li>
</ol>
${J(String.raw`interface Left  { default String name() { return "left"; } }
interface Right { default String name() { return "right"; } }

class Both implements Left, Right {
    @Override public String name() { return Left.super.name(); }  // required
}`)}

<h3>Interfaces vs abstract classes now</h3>
<p>Interfaces still cannot hold instance state (no non-static fields) or constructors. Use an abstract class when implementations share state; use an interface with defaults when they share behaviour built only on other interface methods. Java 9 added <code>private</code> interface methods so defaults can share helper code.</p>

<h2>Traps</h2>
<ul class="traps">
<li>A default cannot override <code>equals</code>, <code>hashCode</code> or <code>toString</code>; the class rule means <code>Object</code>'s versions would always win anyway, so the compiler forbids it.</li>
<li>Adding a default to a widely implemented interface can still silently change behaviour if some implementer already had a method with that signature doing something different.</li>
</ul>
`});

T.push({
id:"j8-cf", track:"java8", title:"CompletableFuture", since:"JDK 8", jep:"JEP 155",
lede:"A Future you can attach the next step to, instead of blocking a thread to wait for it.",
html:`
<h2>Start from the problem</h2>
<p>Java 5's <code>Future</code> represents a result that will arrive later. But the only way to use the result is <code>get()</code>, which blocks the calling thread. If you need to call three services and combine the results, you end up with threads sitting idle waiting on other threads.</p>
<p>The first-principles question: instead of a thread waiting for the value, what if the value, when it arrives, triggered the next piece of work? That is a <strong>callback</strong>, and <code>CompletableFuture</code> is a callback system with composition built in.</p>

<h2>Build it up</h2>
${J(String.raw`ExecutorService io = Executors.newFixedThreadPool(20);

CompletableFuture<Customer> customerF = CompletableFuture.supplyAsync(() -> crm.load(id), io);
CompletableFuture<List<Loan>> loansF  = CompletableFuture.supplyAsync(() -> loanApi.forCustomer(id), io);

CompletableFuture<Dashboard> dash = customerF
    .thenCombine(loansF, Dashboard::new)                  // both done -> combine
    .thenApply(Dashboard::withRiskScore)                  // transform result
    .exceptionally(ex -> Dashboard.degraded(ex));         // recover from failure

Dashboard d = dash.join();   // block only once, at the very edge`,"Two calls run in parallel; total latency is max(a, b) instead of a + b")}

<div class="table-wrap"><table>
<thead><tr><th>Method</th><th>Stream analogue</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><code>thenApply(fn)</code></td><td><code>map</code></td><td>Transform the value</td></tr>
<tr><td><code>thenCompose(fn)</code></td><td><code>flatMap</code></td><td>Next step is itself async; avoids <code>CF&lt;CF&lt;T&gt;&gt;</code></td></tr>
<tr><td><code>thenCombine(other, fn)</code></td><td>zip</td><td>Wait for two, merge them</td></tr>
<tr><td><code>thenAccept / thenRun</code></td><td><code>forEach</code></td><td>Side effect, no new value</td></tr>
<tr><td><code>allOf(...) / anyOf(...)</code></td><td></td><td>Fan-in on many futures</td></tr>
<tr><td><code>exceptionally / handle / whenComplete</code></td><td></td><td>Recover, inspect, or clean up</td></tr>
</tbody></table></div>

<h3>Which thread runs my callback?</h3>
<p>This is the part people get wrong. <code>thenApply</code> (no <code>Async</code> suffix) runs on whichever thread completes the previous stage. If the previous stage is already done when you attach it, it runs <em>immediately on your calling thread</em>. The <code>...Async</code> variants submit to an executor: the one you pass, or <code>ForkJoinPool.commonPool()</code> if you pass none.</p>
${J(String.raw`// Fan out to N calls and collect
List<CompletableFuture<Rate>> fs = ids.stream()
    .map(i -> CompletableFuture.supplyAsync(() -> rateApi.get(i), io))
    .toList();
CompletableFuture<List<Rate>> all = CompletableFuture
    .allOf(fs.toArray(CompletableFuture[]::new))
    .thenApply(v -> fs.stream().map(CompletableFuture::join).toList());

// Java 9+: timeouts without blocking
customerF.orTimeout(2, TimeUnit.SECONDS)
         .completeOnTimeout(Customer.UNKNOWN, 2, TimeUnit.SECONDS);`)}

<h2>Traps</h2>
<ul class="traps">
<li><code>supplyAsync</code> without an executor uses the common pool, sized to CPU cores. Blocking I/O there starves every parallel stream in the JVM. Always pass your own executor for I/O.</li>
<li>Exceptions arrive wrapped in <code>CompletionException</code> (from <code>join</code>) or <code>ExecutionException</code> (from <code>get</code>). Unwrap <code>getCause()</code>.</li>
<li>A chain with no <code>exceptionally</code> and nobody calling <code>join</code> swallows failures silently.</li>
<li><code>cancel(true)</code> does not interrupt the running task. It only completes the future exceptionally.</li>
<li>With Java 21 virtual threads, plain blocking code on a virtual thread is often simpler than a long CompletableFuture chain. See the virtual threads lesson.</li>
</ul>

<h2>Check yourself</h2>
${Q("You call <code>thenApply(heavyCpuWork)</code> on an already-completed future inside a request handler. Where does <code>heavyCpuWork</code> run?","Synchronously on the request thread, right inside the <code>thenApply</code> call. Non-async stages on a completed future run on the caller. Use <code>thenApplyAsync(fn, executor)</code> to move it.")}
`});
/* ===================== PREDICATE, METHOD BY METHOD ===================== */
T.splice(T.findIndex(t => t.id === "j8-lambdas") + 1, 0, {
id:"j8-predicate", track:"java8", title:"Predicate, method by method", since:"JDK 8 / 11", jep:null,
lede:"Predicate is boolean algebra lifted from values to functions. Once you see that, every one of its six methods is the obvious thing to have written.",
mount(root){ mountPredicateLab(root.querySelector("#predLab")); },
html:`
<h2>Start from the problem</h2>
<p>Suppose you filter loans by different criteria in different places. Without a way to pass "a test" around, each combination becomes its own method:</p>
${J(String.raw`List<Loan> active(List<Loan> in)                 { ... if (l.isActive()) ... }
List<Loan> activeAndLarge(List<Loan> in)         { ... if (l.isActive() && l.amount() > 300_000) ... }
List<Loan> activeOrHighRate(List<Loan> in)       { ... if (l.isActive() || l.rate() > 4.0) ... }
List<Loan> notActiveAndLarge(List<Loan> in)      { ... }
// 4 criteria already give dozens of combinations. The loop is copied every time.`)}
<p>Look at what actually varies: only the condition inside the <code>if</code>. A condition on a loan is a function from <code>Loan</code> to <code>boolean</code>. If that function can be a value, one <code>filter</code> method is enough, and the caller passes the condition.</p>
<p>Now take one more step. You already know how to combine <code>boolean</code> <em>values</em>: <code>&amp;&amp;</code>, <code>||</code>, <code>!</code>. If a condition is a value too, you should be able to combine <em>conditions</em> the same way, and get a new condition back, without evaluating anything yet. That is the whole design of <code>Predicate</code>:</p>
<div class="table-wrap"><table>
<thead><tr><th>On boolean values</th><th>On predicates</th><th>Result</th></tr></thead>
<tbody>
<tr><td><code>a &amp;&amp; b</code></td><td><code>p.and(q)</code></td><td>A new predicate: true when both are true</td></tr>
<tr><td><code>a || b</code></td><td><code>p.or(q)</code></td><td>A new predicate: true when either is true</td></tr>
<tr><td><code>!a</code></td><td><code>p.negate()</code>, <code>Predicate.not(p)</code></td><td>A new predicate: the opposite</td></tr>
<tr><td><code>a == x</code></td><td><code>Predicate.isEqual(x)</code></td><td>A predicate that tests equality with <code>x</code></td></tr>
</tbody></table></div>

<h2>The whole interface</h2>
<p>This is the file you shared, with the Javadoc removed. It is short enough to read completely, and every method body is one line of logic.</p>
${J(String.raw`@FunctionalInterface
public interface Predicate<T> {

    boolean test(T t);                                   // the only abstract method

    default Predicate<T> and(Predicate<? super T> other) {
        Objects.requireNonNull(other);
        return (t) -> test(t) && other.test(t);
    }

    default Predicate<T> negate() {
        return (t) -> !test(t);
    }

    default Predicate<T> or(Predicate<? super T> other) {
        Objects.requireNonNull(other);
        return (t) -> test(t) || other.test(t);
    }

    static <T> Predicate<T> isEqual(Object targetRef) {
        return (null == targetRef)
                ? Objects::isNull
                : object -> targetRef.equals(object);
    }

    @SuppressWarnings("unchecked")
    static <T> Predicate<T> not(Predicate<? super T> target) {   // since 11
        Objects.requireNonNull(target);
        return (Predicate<T>) target.negate();
    }
}`,"java.util.function.Predicate (JDK source, comments removed)")}

<h2>Build it yourself first</h2>
<p>Before reading each method, derive the interface from nothing. You need one thing: a type for "a test on a T".</p>
${J(String.raw`interface Check<T> {
    boolean test(T t);
}

// Combining two checks: return a NEW check that runs both
static <T> Check<T> both(Check<T> a, Check<T> b) {
    return t -> a.test(t) && b.test(t);
}

Check<Loan> active = l -> l.status() == ACTIVE;
Check<Loan> large  = l -> l.amount() > 300_000;
Check<Loan> target = both(active, large);       // nothing has been tested yet
target.test(someLoan);                          // now both run`)}
<p>That works, but nested calls read inside-out: <code>both(either(a, b), c)</code>. Java 8 had just added default methods, so the helper can live on the interface itself and read left to right: <code>a.or(b).and(c)</code>. Rename <code>Check</code> to <code>Predicate</code> and <code>both</code> to <code>and</code>, and you have reinvented the JDK class. Every method below is a variation of this one idea.</p>

<h2>test(T t): the only method you implement</h2>
<p>A functional interface has exactly one abstract method, and that is the one a lambda implements. <code>@FunctionalInterface</code> makes the compiler reject a second abstract method. It is optional, but it documents intent and protects the interface from accidental changes.</p>
${J(String.raw`Predicate<Loan> active   = l -> l.status() == Status.ACTIVE;   // lambda becomes test()
Predicate<Loan> isFixed  = Loan::isFixed;                       // method reference
Predicate<String> blank  = String::isBlank;                     // unbound receiver: s -> s.isBlank()
Predicate<String> codeOk = Pattern.compile("[A-Z]{3}").asMatchPredicate();   // JDK 11

active.test(loan);   // true or false`)}
<p>Everything else in the interface is built only out of <code>test</code>. That is why the other methods can be <code>default</code>: they do not need to know how any particular predicate decides, only that it can be asked.</p>

<h2>and(other): conjunction that builds instead of runs</h2>
<p>Read the body: <code>return (t) -&gt; test(t) &amp;&amp; other.test(t);</code>. Four separate ideas are packed into it.</p>
<h3>1. It returns a predicate, it does not test anything</h3>
<p>Calling <code>and</code> evaluates nothing. It creates a new lambda object that remembers two things: <code>this</code> (the predicate on the left, because <code>test(t)</code> inside the lambda means <code>this.test(t)</code>) and <code>other</code>. Composition happens once; evaluation happens later, once per element.</p>
<h3>2. It short-circuits because <code>&amp;&amp;</code> does</h3>
<p>If the left side is false, <code>other.test</code> is never called. The library did not implement this behaviour separately; it inherits it from Java's own <code>&amp;&amp;</code>. Two practical consequences:</p>
${J(String.raw`// Order as a guard: the left side protects the right side
Predicate<Loan> hasOwner  = l -> l.owner() != null;
Predicate<Loan> ownerIsNl = l -> l.owner().country().equals("NL");
hasOwner.and(ownerIsNl);     // safe: ownerIsNl only runs when owner != null
ownerIsNl.and(hasOwner);     // NullPointerException for loans without an owner

// Order for cost: cheap and selective first
Predicate<Loan> inArrears = Loan::inArrears;                       // a field read
Predicate<Loan> riskFlag  = l -> riskApi.isFlagged(l.id());        // a remote call
inArrears.and(riskFlag);     // the remote call runs only for loans in arrears`)}
<h3>3. <code>requireNonNull(other)</code> fails at composition time</h3>
<p>Without that line, <code>a.and(null)</code> would succeed and return a predicate that throws later, inside a stream, maybe on another thread, far from the bug. Checking eagerly moves the failure to the line that caused it. <code>negate()</code> has no such check because it takes no argument.</p>
<h3>4. Why <code>Predicate&lt;? super T&gt;</code> and not <code>Predicate&lt;T&gt;</code></h3>
<p>A predicate only <em>consumes</em> its <code>T</code>. Anything that can test an <code>Object</code> can certainly test a <code>Loan</code>. So <code>and</code> accepts a predicate on <code>T</code> or on any supertype of <code>T</code>. This is the "consumer super" half of PECS (Producer Extends, Consumer Super).</p>
${J(String.raw`Predicate<Loan>   active  = Loan::isActive;
Predicate<Object> notNull = Objects::nonNull;

active.and(notNull);        // compiles: Predicate<Object> is a Predicate<? super Loan>
notNull.and(active);        // does NOT compile: receiver is Predicate<Object>, so other
                            // must be Predicate<? super Object>, and Loan is not a supertype

// To put the null guard first, type it for the element you test:
Predicate<Loan> loanNotNull = Objects::nonNull;    // same method, target type is Loan
loanNotNull.and(active);    // compiles, and the guard runs first`)}
<p>The return type is always <code>Predicate&lt;T&gt;</code>, the receiver's type. Combining keeps the most specific type you started from.</p>

<h2>or(other): disjunction, mirrored</h2>
<p>The body is <code>test(t) || other.test(t)</code>, so everything about <code>and</code> applies in mirror image. It short-circuits when the left side is <em>true</em>. Put the cheapest test, or the one most likely to be true, on the left.</p>
${J(String.raw`Predicate<Loan> needsReview = Loan::inArrears
        .or(l -> l.rate().compareTo(new BigDecimal("6.0")) > 0)
        .or(l -> l.ltv() > 1.0);
// Does not compile! A method reference has no type until it meets a target,
// so you cannot call .or() on Loan::inArrears directly. Give it a type first:

Predicate<Loan> inArrears = Loan::inArrears;
Predicate<Loan> needsReview = inArrears
        .or(l -> l.rate().compareTo(new BigDecimal("6.0")) > 0)
        .or(l -> l.ltv() > 1.0);`)}
<p>Chaining is left-associative, exactly like <code>&amp;&amp;</code> and <code>||</code> written left to right: <code>a.and(b).or(c)</code> means <code>(a &amp;&amp; b) || c</code>. There is no operator precedence to rely on. The call order decides the grouping. For <code>a &amp;&amp; (b || c)</code>, write <code>a.and(b.or(c))</code>.</p>

<div class="fig">
<svg viewBox="0 0 560 236" role="img" aria-label="Evaluation tree of active.and(large).or(highRate) for loan L7: active is false, so large is skipped; highRate is then tested and is true, so the result is true">
<path d="M280 52 L150 96" class="f-line"/><path d="M280 52 L410 96" class="f-line"/>
<path d="M150 130 L80 168" class="f-line"/><path d="M150 130 L220 168" class="f-line"/>
<rect x="220" y="18" width="120" height="34" class="f-acc"/><text x="280" y="40" class="f-t">or → true</text>
<rect x="90" y="96" width="120" height="34" class="f-false"/><text x="150" y="118" class="f-t">and → false</text>
<rect x="350" y="96" width="120" height="34" class="f-acc"/><text x="410" y="118" class="f-t">highRate → true</text>
<rect x="20" y="168" width="120" height="34" class="f-false"/><text x="80" y="190" class="f-t">active → false</text>
<rect x="160" y="168" width="120" height="34" class="f-skip"/><text x="220" y="190" class="f-s">large: skipped</text>
<text x="80" y="224" class="f-s">1st test() call</text><text x="220" y="224" class="f-s">never called</text><text x="410" y="152" class="f-s">2nd test() call</text>
</svg>
<p class="cap"><code>active.and(large).or(highRate)</code> is a tree of lambda objects. Testing loan L7 (closed, 600k, 5.1%) walks it left to right and stops early where <code>&amp;&amp;</code> and <code>||</code> allow.</p>
</div>

<h2>negate(): the opposite of this predicate</h2>
<p>The body is <code>(t) -&gt; !test(t)</code>. It is an instance method, so you need a typed predicate to call it on:</p>
${J(String.raw`Predicate<Loan> active = Loan::isActive;
loans.stream().filter(active.negate()).toList();      // inactive loans

loans.stream().filter(Loan::isActive.negate());       // does not compile: same method-reference rule
loans.stream().filter(l -> !l.isActive());            // the usual workaround, before Java 11`)}
<p>That compile error is exactly the problem the next method solves.</p>

<h2>not(target): negate, but usable with method references</h2>
<p>Added in Java 11. The body simply calls <code>target.negate()</code>. Why add a static method that does the same thing? Because a static method takes the predicate as a <em>parameter</em>, and a parameter gives a method reference the target type it needs:</p>
${J(String.raw`import static java.util.function.Predicate.not;

lines.stream().filter(not(String::isBlank)).toList();
loans.stream().filter(not(Loan::isActive)).count();
codes.removeIf(not(validCodes::contains));            // keep only valid codes`)}
<h3>The unchecked cast, explained</h3>
<p><code>target</code> is a <code>Predicate&lt;? super T&gt;</code>, so <code>target.negate()</code> returns a <code>Predicate</code> of that same unknown supertype. The method promises a <code>Predicate&lt;T&gt;</code>, so it casts. Is that safe? Yes, for the same reason <code>and</code> accepts <code>? super T</code>: a predicate that can test any supertype of <code>T</code> can test a <code>T</code>. <code>Predicate</code> only takes <code>T</code> in and never hands one out, so viewing it as a <code>Predicate&lt;T&gt;</code> can never deliver a value of the wrong type. Because of erasure there is no runtime check at all; the compiler warns anyway, so the JDK suppresses the warning.</p>

<h2>isEqual(targetRef): equality as a predicate</h2>
<p>This one is a <em>factory</em>: a static method that builds a predicate from a value.</p>
${J(String.raw`static <T> Predicate<T> isEqual(Object targetRef) {
    return (null == targetRef)
            ? Objects::isNull                      // decided ONCE, at creation
            : object -> targetRef.equals(object);  // targetRef is known non-null here
}`)}
<p>Notice the decision is made when the predicate is built, not each time it is tested. A naive version would be <code>t -&gt; Objects.equals(targetRef, t)</code>, which re-checks <code>targetRef == null</code> on every call. Here, the null check runs once and the right lambda is chosen. It also guarantees <code>targetRef.equals</code> is never called on null.</p>
${J(String.raw`Predicate<String> isFix = Predicate.isEqual("FIX");
products.stream().filter(isFix).count();

Predicate<String> missing = Predicate.isEqual(null);    // same as Objects::isNull
codes.stream().anyMatch(missing);

// The parameter is Object, not T, so give T explicitly when it can't be inferred
var p = Predicate.<Product>isEqual(Product.FIX);`)}
<p>It uses the <em>target's</em> <code>equals</code>, so it inherits that class's definition of equality. That matters for <code>BigDecimal</code>, where scale is part of equality:</p>
${J(String.raw`Predicate.isEqual(new BigDecimal("3.5")).test(new BigDecimal("3.50"));   // false: scale differs
// For numeric equality use compareTo:
Predicate<BigDecimal> is35 = r -> r.compareTo(new BigDecimal("3.5")) == 0;   // true for 3.50`)}

<h2>Where predicates are consumed: Stream</h2>
<p>The second file you shared, <code>Stream.java</code>, takes a <code>Predicate&lt;? super T&gt;</code> in seven places. Each one asks the same question of an element but does something different with the answer:</p>
<div class="table-wrap"><table>
<thead><tr><th>Method</th><th>Kind</th><th>What it does with each answer</th><th>Stops early?</th><th>Empty stream</th></tr></thead>
<tbody>
<tr><td><code>filter</code></td><td>intermediate</td><td>Keep the element when true</td><td>No: tests every element that reaches it</td><td>empty</td></tr>
<tr><td><code>takeWhile</code> (9)</td><td>intermediate</td><td>Keep elements while true; at the first false, end the stream</td><td>Yes, at first false</td><td>empty</td></tr>
<tr><td><code>dropWhile</code> (9)</td><td>intermediate</td><td>Drop elements while true; from the first false on, keep everything without testing</td><td>Stops <em>testing</em> at first false</td><td>empty</td></tr>
<tr><td><code>anyMatch</code></td><td>terminal</td><td>"Is there at least one?"</td><td>Yes, at first true</td><td><code>false</code></td></tr>
<tr><td><code>allMatch</code></td><td>terminal</td><td>"Do all of them pass?"</td><td>Yes, at first false</td><td><code>true</code></td></tr>
<tr><td><code>noneMatch</code></td><td>terminal</td><td>"Does none of them pass?"</td><td>Yes, at first true</td><td><code>true</code></td></tr>
<tr><td><code>iterate(seed, hasNext, next)</code> (9)</td><td>source</td><td>Loop condition: emit while true</td><td>Ends the stream at first false</td><td>empty if seed fails</td></tr>
</tbody></table></div>
<p>The empty-stream column follows from logic, not convention. "Is there a matching element?" has the answer no when there are no elements. "Does every element match?" has the answer yes, because there is no counter-example. That is the same identity rule you will see with <code>reduce</code> below.</p>
${J(String.raw`List<Payment> history = List.of(onTime1, onTime2, late3, onTime4);   // in date order
Predicate<Payment> onTime = Payment::onTime;

history.stream().filter(onTime).toList();      // [onTime1, onTime2, onTime4]  all tested
history.stream().takeWhile(onTime).toList();   // [onTime1, onTime2]           "on time until the first miss"
history.stream().dropWhile(onTime).toList();   // [late3, onTime4]            "everything from the first miss"

history.stream().anyMatch(onTime.negate());    // true, after testing 3 elements
history.stream().allMatch(onTime);             // false, after testing 3 elements

// iterate with a Predicate as the loop condition: like for (d = start; d.isBefore(end); d = d.plusMonths(1))
Stream.iterate(start, d -> d.isBefore(end), d -> d.plusMonths(1))
      .forEach(this::bookInterest);`)}
<p>In the JDK source, <code>iterate</code>'s spliterator calls <code>hasNext.test(t)</code> on each new element <em>before</em> passing it on, and marks itself finished the first time it returns false. That is a for-loop condition, implemented as a predicate.</p>
<p>Outside <code>Stream</code>, the same type appears in <code>Collection.removeIf</code>, <code>Optional.filter</code>, <code>Collectors.partitioningBy</code> and <code>Collectors.filtering</code> (9). Learn the interface once and it works everywhere.</p>

<h2>Try it: the predicate lab</h2>
<p>Build a predicate from the four tests below, choose what consumes it, and watch which <code>test()</code> calls actually run. Swap the order of two tests and see the call count change while the result stays the same.</p>
<div class="lab" id="predLab"></div>

<h2>Under the hood</h2>
<p>Each <code>and</code>, <code>or</code> and <code>negate</code> allocates one small lambda object holding references to its inputs. A composed predicate is therefore a tree, and calling <code>test</code> walks that tree with ordinary virtual calls. The JIT usually inlines these small calls at a hot call site, so a composed predicate in a hot loop costs about the same as the hand-written <code>if</code>.</p>
<h3>Building predicates from data: reduce</h3>
<p>Because composition returns a predicate, you can fold a list of rules into one. To do that you need a starting value that changes nothing, just as 0 is the starting value for addition. For AND that value is "always true"; for OR it is "always false".</p>
${J(String.raw`List<Predicate<Loan>> rules = List.of(
        Loan::isActive,
        l -> l.amount() > 100_000,
        l -> l.product() == Product.FIX);

Predicate<Loan> all = rules.stream().reduce(x -> true,  Predicate::and);   // every rule passes
Predicate<Loan> any = rules.stream().reduce(x -> false, Predicate::or);    // at least one passes

// With an empty rule list, 'all' is x -> true: matches allMatch on an empty stream.`)}
<p>This is useful for configurable eligibility rules, such as which loans a rate change applies to, where the rules come from configuration instead of code.</p>

<h3>Primitive versions</h3>
<p><code>IntPredicate</code>, <code>LongPredicate</code> and <code>DoublePredicate</code> have the same methods on primitive parameters, so <code>IntStream.filter</code> avoids boxing. <code>BiPredicate&lt;T, U&gt;</code> tests two arguments and has <code>and</code>, <code>or</code> and <code>negate</code>, but no <code>not</code> or <code>isEqual</code>.</p>

<h2>Traps</h2>
<ul class="traps">
<li>The order of <code>and</code>/<code>or</code> changes behaviour when a test can throw or has a cost. A null guard on the right protects nothing.</li>
<li><code>Loan::isActive.negate()</code> and <code>Loan::isActive.and(...)</code> do not compile. Assign the method reference to a <code>Predicate</code> variable first, or use <code>Predicate.not</code>.</li>
<li><code>a.and(b).or(c)</code> is <code>(a &amp;&amp; b) || c</code>. If you meant <code>a &amp;&amp; (b || c)</code>, nest the call: <code>a.and(b.or(c))</code>.</li>
<li><code>Stream</code>'s Javadoc requires predicates to be <em>stateless</em> and <em>non-interfering</em>. A predicate that remembers what it has seen (the popular <code>distinctByKey</code> trick with a <code>Set</code>) works sequentially but cannot be reused across streams, and in a parallel stream which duplicate survives is unpredictable.</li>
<li><code>dropWhile</code> and <code>takeWhile</code> only make sense on ordered data. On a <code>HashSet</code> stream the result can differ from run to run.</li>
<li><code>isEqual</code> uses <code>equals</code>, so <code>BigDecimal</code> values with different scales do not match.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why does <code>Predicate.not</code> exist when <code>negate()</code> already does the same thing?","A method reference such as <code>String::isBlank</code> has no type on its own, so you cannot call an instance method like <code>negate()</code> on it. Passing it as an argument to a static method gives it a target type (<code>Predicate&lt;? super T&gt;</code>), so <code>not(String::isBlank)</code> compiles.")}
${Q("<code>p = a.and(b).or(c)</code>. For an element where a is true, b is false and c is true, which <code>test</code> calls run and what is the result?","a runs (true), so b runs (false); the <code>and</code> part is false, so c runs (true). Three calls, result true.")}
${Q("Why does <code>and</code> call <code>requireNonNull(other)</code> immediately instead of letting <code>other.test</code> throw later?","To fail where the mistake is made. Without it, the composed predicate would be created successfully and throw only when evaluated, possibly much later, in another class or thread. Also, because of short-circuiting, the null might never be reached for most elements, hiding the bug.")}
${Q("What does <code>allMatch</code> return on an empty stream, and why is that the logical answer?","<code>true</code>. \"Every element passes\" is false only if there is a counter-example, and an empty stream has none. It is the same reason the identity for folding predicates with <code>and</code> is <code>x -&gt; true</code>.")}
${Q("Why does <code>isEqual</code> check for null once at creation instead of using <code>t -&gt; Objects.equals(targetRef, t)</code>?","The target never changes, so its null check only needs to happen once. Choosing between <code>Objects::isNull</code> and <code>targetRef::equals</code>-style logic at creation keeps each <code>test</code> call minimal and guarantees <code>equals</code> is never called on a null target.")}
`});

    let p = {kind:$l("lab-op1").value, a:atomNode(1), b:atomNode(2)};
    const op2 = $l("lab-op2").value;
    if (op2 !== "(none)") p = {kind:op2, a:p, b:atomNode(3)};
    if ($l("lab-negall").checked) p = {kind:"negate", x:p};
    return p;
  }
  function code(n){
    switch (n.kind){
      case "atom": return n.name;
      case "not": return `not(${code(n.x)})`;
      case "negate": return `${code(n.x)}.negate()`;
      default: {
        const right = n.b.kind === "and" || n.b.kind === "or" ? code(n.b) : code(n.b);
        return `${code(n.a)}.${n.kind}(${right})`;
      }
    }
  }
  function atomsIn(n, out=[]){
    if (n.kind === "atom") out.push(n.name);
    else if (n.x) atomsIn(n.x, out);
    else { atomsIn(n.a, out); atomsIn(n.b, out); }
    return out;
  }
  function evaluate(n, loan, trace){
    switch (n.kind){
      case "atom": { const v = ATOMS[n.name].fn(loan); trace.push({name:n.name, v}); return v; }
      case "not": case "negate": return !evaluate(n.x, loan, trace);
      case "and": {
        if (!evaluate(n.a, loan, trace)) { atomsIn(n.b).forEach(name => trace.push({name, skip:true})); return false; }
        return evaluate(n.b, loan, trace);
      }
      case "or": {
        if (evaluate(n.a, loan, trace)) { atomsIn(n.b).forEach(name => trace.push({name, skip:true})); return true; }
        return evaluate(n.b, loan, trace);
      }
    }
  }

  function run(){
    $l("lab-term3").hidden = $l("lab-op2").value === "(none)";
    const p = build(), t = $l("lab-terminal").value;
    const pc = code(p);
    const tail = {filter:".filter(p).toList()", anyMatch:".anyMatch(p)", allMatch:".allMatch(p)", noneMatch:".noneMatch(p)", takeWhile:".takeWhile(p).toList()", dropWhile:".dropWhile(p).toList()"}[t];
    $l("lab-code").innerHTML = J(`Predicate<Loan> p = ${pc};\nvar result = loans.stream()${tail};`, "Equivalent Java");

    let calls = 0, tested = 0, stopped = false, dropping = true, result = null;
    const kept = [];
    const rows = LOANS.map((loan, i) => {
      const r = {loan, trace:[], val:null, outcome:"", cls:""};
      if (stopped){ r.outcome = "not reached"; r.cls = "lab-off"; return r; }
      if (t === "dropWhile" && !dropping){ r.outcome = "kept, not tested"; r.cls = "lab-pass"; kept.push(loan.id); return r; }
      r.val = evaluate(p, loan, r.trace);
      tested++; calls += r.trace.filter(x => !x.skip).length;
      switch (t){
        case "filter":    r.outcome = r.val ? "kept" : "dropped"; if (r.val) kept.push(loan.id); break;
        case "anyMatch":  if (r.val){ r.outcome = "match found: stop"; stopped = true; result = true; } else r.outcome = "keep looking"; break;
        case "allMatch":  if (!r.val){ r.outcome = "counter-example: stop"; stopped = true; result = false; } else r.outcome = "keep checking"; break;
        case "noneMatch": if (r.val){ r.outcome = "a match exists: stop"; stopped = true; result = false; } else r.outcome = "keep checking"; break;
        case "takeWhile": if (r.val){ r.outcome = "kept"; kept.push(loan.id); } else { r.outcome = "first false: stream ends"; stopped = true; } break;
        case "dropWhile": if (r.val){ r.outcome = "dropped"; } else { r.outcome = "first false: kept, testing stops"; dropping = false; kept.push(loan.id); } break;
      }
      return r;
    });
    if (result === null){
      if (t === "anyMatch") result = false;
      if (t === "allMatch" || t === "noneMatch") result = true;
    }
    const max = LOANS.length * atomsIn(p).length;
    const outcome = ["filter","takeWhile","dropWhile"].includes(t) ? `[${kept.join(", ")}]` : String(result);
    $l("lab-summary").innerHTML = `Result: <code>${outcome}</code>. Elements tested: <b>${tested}</b> of ${LOANS.length}. Building-block <code>test()</code> calls: <b>${calls}</b> of ${max} possible.`;

    const chip = x => x.skip ? `<span class="chip skip">${x.name}</span>` : `<span class="chip ${x.v?"yes":"no"}">${x.name} ${x.v?"✓":"✗"}</span>`;
    $l("lab-body").innerHTML = rows.map(r => `
      <tr class="${r.cls}">
        <td><b>${r.loan.id}</b></td><td>${r.loan.product}</td><td class="num">${r.loan.amount.toLocaleString("en-US")}</td><td>${r.loan.status}</td><td class="num">${r.loan.rate.toFixed(1)}%</td>
        <td><div class="chips">${r.trace.map(chip).join("") || "<span class='muted'>none</span>"}</div></td>
        <td>${r.val === null ? "<span class='muted'>–</span>" : `<span class="chip ${r.val?"yes":"no"}">${r.val}</span>`}</td>
        <td>${r.outcome}</td>
      </tr>`).join("");
  }
  el.addEventListener("change", run);
  run();
}
/* ===================== GENERICS & ERASURE ===================== */
T.push({
id:"j8-generics", track:"java8", title:"Generics, erasure & why List<int> fails", since:"JDK 5 → Valhalla", jep:"JEP 401",
lede:"Generics are checked by the compiler and then erased. Understanding that one design choice explains every generics limitation in Java, including why List&lt;int&gt; does not compile.",
html:`
<h2>Start from the problem</h2>
<p>Before Java 5, every collection held <code>Object</code>. The compiler could not know what was inside, so you cast on every read, and a wrong element was only discovered at runtime, far from where it was added.</p>
${J(String.raw`List loans = new ArrayList();
loans.add(new Loan(1));
loans.add("oops");                     // compiles fine
Loan l = (Loan) loans.get(1);          // ClassCastException here, at runtime`)}
<p>What we actually want is for the compiler to know "this list only holds <code>Loan</code>", reject the bad <code>add</code>, and insert the cast for us. Notice what this requires: the type knowledge is needed <em>at compile time</em>, to check calls. Whether it also needs to exist at runtime is a separate design decision. Java's answer to that second question shapes everything below.</p>

<h2>Build it up: step 1, the compiler's view</h2>
${J(String.raw`List<Loan> loans = new ArrayList<>();
loans.add(new Loan(1));
loans.add("oops");                     // compile error: String is not a Loan
Loan l = loans.get(0);                 // no cast written`)}
<p>The checking is entirely the compiler's job. That leads to the key question: once the compiler has proven the code type-safe, does the JVM need to know that the list holds <code>Loan</code>?</p>

<h2>Step 2: erasure, the JVM's view</h2>
<p>Java's answer in 2004 was no. After checking, the compiler <strong>erases</strong> type parameters: <code>T</code> becomes <code>Object</code> (or its bound, so <code>T extends Comparable&lt;T&gt;</code> becomes <code>Comparable</code>), and it inserts casts where values come out. There is exactly one <code>ArrayList.class</code>, shared by <code>ArrayList&lt;Loan&gt;</code>, <code>ArrayList&lt;String&gt;</code> and raw <code>ArrayList</code>.</p>
${J(String.raw`// Source
List<String> names = new ArrayList<>();
names.add("Rushi");
String s = names.get(0);

// javap -c (trimmed): no trace of String in the List calls
invokeinterface List.add:(Ljava/lang/Object;)Z
invokeinterface List.get:(I)Ljava/lang/Object;
checkcast       java/lang/String              // the cast the compiler wrote for you`,"Generics live in the compiler. The bytecode is the same as hand-written Java 1.4 code")}
<p>Why choose this? <strong>Migration compatibility</strong>. Millions of lines of code and thousands of compiled JARs already used raw <code>List</code>. With erasure, old binaries and new generic code could pass the same <code>ArrayList</code> objects to each other without recompiling anything. That was the deciding requirement.</p>

<h3>Bridge methods: erasure has to patch overriding</h3>
${J(String.raw`class RateComparator implements Comparator<Rate> {
    public int compare(Rate a, Rate b) { return a.value().compareTo(b.value()); }
}
// After erasure, Comparator's method is compare(Object, Object).
// compare(Rate, Rate) does not override it! So javac adds a synthetic bridge:
public int compare(Object a, Object b) {           // ACC_BRIDGE, ACC_SYNTHETIC
    return compare((Rate) a, (Rate) b);
}`)}
<p>You will see these bridge methods in stack traces and in reflection results (<code>Method.isBridge()</code>).</p>

<h2>Step 3: the consequences you can now predict</h2>
<p>If the runtime does not know <code>T</code>, then anything that needs <code>T</code> at runtime cannot work:</p>
${J(String.raw`class Box<T> {
    T make()            { return new T(); }          // error: which constructor? T is Object at runtime
    T[] arr()           { return new T[10]; }        // error: arrays know their element type at runtime
    boolean is(Object o){ return o instanceof T; }   // error: nothing to check against
    static T shared;                                 // error: one static for ALL Box<X>, so which T?
}

if (obj instanceof List<String>) { }                  // error: only List<?> can be checked
void handle(List<String> a) { }
void handle(List<Integer> a) { }                      // error: both erase to handle(List)`)}
<p>The usual workaround is to pass the type in explicitly, as a <code>Class&lt;T&gt;</code> token or a supplier:</p>
${J(String.raw`<T> T read(String json, Class<T> type) { return mapper.readValue(json, type); }
<T> List<T> fill(int n, Supplier<T> factory) { ... factory.get() ... }
T[] arr = (T[]) Array.newInstance(type, 10);`)}

<h3>Not everything is erased</h3>
<p>Erasure removes type arguments from <em>objects and instructions</em>, but declarations keep them in a <code>Signature</code> attribute in the class file. A field declared <code>List&lt;Loan&gt; loans</code> or a class declared <code>extends Base&lt;Loan&gt;</code> still records <code>Loan</code>. Jackson and Spring read it with reflection. That is the trick behind the "super type token":</p>
${J(String.raw`// An anonymous subclass of TypeReference<List<Loan>> records List<Loan> in its superclass signature
List<Loan> loans = mapper.readValue(json, new TypeReference<List<Loan>>() {});

// Spring does the same with ResolvableType / ParameterizedTypeReference
restClient.get().uri("/loans").retrieve().body(new ParameterizedTypeReference<List<Loan>>() {});`)}

<h2>Step 4: now, why List&lt;int&gt; cannot work</h2>
<p>Follow the erasure model one more step. <code>ArrayList</code> stores its elements in an <code>Object[] elementData</code>. An <code>Object[]</code> holds <strong>references</strong>: pointers to objects on the heap. An <code>int</code> is not a reference. It is a raw 32-bit value with no object around it.</p>
<p>The JVM instruction set is typed by the kind of value. Reading a reference from an array and reading an int from an array are different instructions. <code>long</code> and <code>double</code> are different again, because they occupy two stack slots instead of one.</p>
${J(String.raw`aaload    // load a REFERENCE from an Object[]
iaload    // load an INT from an int[]
laload    // load a LONG (2 slots) from a long[]
daload    // load a DOUBLE (2 slots) from a double[]

aload_1 / iload_1 / lload_1 / dload_1    // same split for local variables
areturn / ireturn / lreturn / dreturn   // and for returns`)}
<p>So the single compiled <code>ArrayList.class</code>, written in terms of <code>aaload</code> and <code>areturn</code>, physically cannot operate on raw ints. To support <code>List&lt;int&gt;</code>, <strong>someone must produce different bytecode for each primitive type</strong>. That is the whole problem, reduced to its core. Every solution below is just a different answer to "who produces that code, and when?"</p>

<h3>What Java does today: boxing</h3>
<p>Java's workaround is to wrap each <code>int</code> in an <code>Integer</code> object so it becomes a reference. Autoboxing (Java 5) hides the wrapping:</p>
${J(String.raw`List<Integer> nums = new ArrayList<>();
nums.add(42);            // compiles to nums.add(Integer.valueOf(42))
int x = nums.get(0);     // compiles to ((Integer) nums.get(0)).intValue()`)}

<p>Boxing also changes semantics, because an <code>Integer</code> is an object with identity:</p>
${J(String.raw`Integer a = 127, b = 127;
a == b;            // true:  Integer.valueOf caches -128..127, same object
Integer c = 128, d = 128;
c == d;            // false: two different objects. Always use equals()

List<Integer> ids = ...;
int first = ids.get(0);   // NullPointerException if the element is null (auto-unboxing)

ids.remove(1);                     // removes the element at INDEX 1
ids.remove(Integer.valueOf(1));    // removes the VALUE 1`)}

<h2>Step 5: the four ways to get real primitive collections</h2>

<h3>Way 1: write the specialised class by hand</h3>
<p>Take <code>ArrayList</code>'s idea (an array plus a size, doubling when full) and replace <code>Object[]</code> with <code>int[]</code>. The bytecode now uses <code>iaload</code> and <code>ireturn</code>, which is exactly what we said was required.</p>
${J(String.raw`public final class IntList {
    private int[] data;
    private int size;

    public IntList()                { this(10); }
    public IntList(int capacity)    { data = new int[capacity]; }

    public void add(int value) {
        if (size == data.length) {
            data = Arrays.copyOf(data, Math.max(4, size * 2));   // amortised O(1), like ArrayList
        }
        data[size++] = value;
    }

    public int get(int index) {
