        Objects.checkIndex(index, size);   // data.length may be larger than size
        return data[index];
    }

    public void set(int index, int value) { Objects.checkIndex(index, size); data[index] = value; }
    public int size()                    { return size; }

    public long sum() {                    // no unboxing, tight loop the JIT can vectorise
        long s = 0;
        for (int i = 0; i < size; i++) s += data[i];
        return s;
    }

    public IntStream stream()          { return Arrays.stream(data, 0, size); }
    public void forEach(IntConsumer c) { for (int i = 0; i < size; i++) c.accept(data[i]); }

    // Interop: a List<Integer> VIEW for APIs that need one. Boxes only when read.
    public List<Integer> asList() {
        return new AbstractList<>() {
            @Override public Integer get(int i)          { return IntList.this.get(i); }
            @Override public Integer set(int i, Integer v){ int old = IntList.this.get(i); IntList.this.set(i, v); return old; }
            @Override public int size()                  { return size; }
        };
    }
}`,"A primitive-specialised list: about 40 lines, and 5× smaller than ArrayList<Integer>")}
${J(String.raw`IntList rates = new IntList();
for (int bp : new int[]{385, 412, 399}) rates.add(bp);   // basis points, no Integer objects
rates.sum();                                             // 1196
rates.stream().max().getAsInt();                         // 412
Collections.max(rates.asList());                         // works with any List API, boxing on demand`)}
<p>The cost is obvious once you need <code>long</code> and <code>double</code>: three copies of nearly identical code, and a separate interface for each (<code>IntConsumer</code>, <code>LongConsumer</code>...).</p>

<h3>Way 2: generate the copies at build time</h3>
<p>If the copies differ only by type name, generate them from one template. This is what fastutil, Eclipse Collections and HPPC do. Their JARs contain classes like <code>IntArrayList</code>, <code>LongArrayList</code>, <code>Int2ObjectOpenHashMap</code>, all produced from shared templates.</p>
${J(String.raw`// Template (pseudo-code): KType is replaced per primitive by the build
public final class KTypeList {
    private ktype[] data;
    public void add(ktype v) { ... }
    public ktype get(int i)  { ... }
}
// Build output: IntList.java, LongList.java, DoubleList.java ...

// Using a real library (fastutil)
IntArrayList ids = new IntArrayList();
ids.add(42);
int x = ids.getInt(0);       // primitive getter; get(int) also exists for List<Integer> compatibility`)}
<p>The JDK did the same thing by hand, and you use the result every day. <code>IntStream</code>, <code>LongStream</code>, <code>DoubleStream</code>, <code>IntFunction</code>, <code>ToIntFunction</code>, <code>IntBinaryOperator</code>, <code>OptionalInt</code> and dozens more exist only because <code>Stream&lt;int&gt;</code> cannot. That "primitive explosion" in <code>java.util.function</code> is the visible price of erasure.</p>

<h3>Way 3: make the compiler copy (the C++ approach)</h3>
<p>The compiler could emit a separate class for every type argument it sees: <code>List&lt;int&gt;</code>, <code>List&lt;String&gt;</code>, <code>List&lt;Loan&gt;</code>, each with its own code. That is <strong>monomorphisation</strong>, used by C++ templates and Rust.</p>
<ul>
<li>It works for primitives naturally, because each copy uses the right instructions.</li>
<li>But a library JAR would have to contain copies for types it has never seen (your <code>Loan</code>), so it breaks Java's separate compilation and binary compatibility. It also multiplies code size.</li>
</ul>

<h3>Way 4: make the JVM specialise at runtime (the C# approach, and Java's plan)</h3>
<p>Keep one generic class file, but keep enough type information that the runtime can generate a specialised version when <code>List&lt;int&gt;</code> is first used. Reference types can still share one copy, because a reference is a reference whatever it points to. This is how .NET's CLR has worked since 2005 (C#'s <em>reified</em> generics).</p>
<p>Java's version of this is <strong>Project Valhalla</strong>, in two steps:</p>
<ol>
<li><strong>Value classes (JEP 401)</strong>: classes whose instances have no identity, so the JVM may store them flat, inline in arrays and fields, just like an <code>int</code>. This turns "primitive vs object" into a property the JVM can optimise rather than a hard split in the type system.</li>
<li><strong>Specialised generics</strong>: the JVM generating flat <code>ArrayList&lt;int&gt;</code>-style code from the existing generic class, while erased code keeps working unchanged.</li>
</ol>
<p>As of this writing, value classes have been available in preview and early-access builds, and specialised generics come after them. Neither is a final feature in an LTS release yet. Check the JEP status before relying on it.</p>

<div class="table-wrap"><table>
<thead><tr><th>Approach</th><th>Who produces the int code</th><th>When</th><th>Cost</th></tr></thead>
<tbody>
<tr><td>Boxing</td><td>Nobody</td><td>Never</td><td>~5× memory, pointer chasing, nulls, <code>==</code> traps</td></tr>
<tr><td>Hand-written <code>IntList</code></td><td>You</td><td>When you write it</td><td>Duplicate code per primitive</td></tr>
<tr><td>Template generation</td><td>A build tool</td><td>Library build</td><td>Many classes in the JAR</td></tr>
<tr><td>Monomorphisation (C++, Rust)</td><td>The compiler</td><td>Compile time</td><td>Code bloat; no separate compilation</td></tr>
<tr><td>Runtime specialisation (C#, Valhalla)</td><td>The JVM</td><td>First use at runtime</td><td>A JVM and class-file format change</td></tr>
</tbody></table></div>

<h2>What to do in real code</h2>
<ul>
<li>Use <code>List&lt;Integer&gt;</code> by default. For a few thousand elements in a request, boxing is not your bottleneck.</li>
<li>Use <code>int[]</code>, <code>IntStream</code> or <code>mapToInt</code> for numeric work: <code>loans.stream().mapToLong(Loan::amountCents).sum()</code>, not <code>.map(...).reduce(0L, Long::sum)</code>.</li>
<li>Reach for fastutil or Eclipse Collections when profiling shows millions of boxed values: big in-memory caches, ID sets, counters.</li>
<li>For money, keep <code>BigDecimal</code> or a <code>long</code> in cents. Boxing is the least of your concerns there.</li>
</ul>

<h2>Traps</h2>
<ul class="traps">
<li>Comparing <code>Integer</code> or <code>Long</code> with <code>==</code> works in tests with small numbers and fails in production with large ones.</li>
<li><code>List&lt;Integer&gt;.remove(int)</code> removes by index; <code>remove(Object)</code> removes by value. Easy to call the wrong one.</li>
<li>Unchecked casts like <code>(List&lt;String&gt;) rawList</code> compile with a warning and only fail later, when an element is read. This is "heap pollution". Do not suppress the warning without a reason.</li>
<li><code>T[]</code> parameters in a generic varargs method create a <code>Object[]</code> at runtime. Mark safe methods with <code>@SafeVarargs</code>, and never store into or return that array.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why can a single <code>ArrayList.class</code> serve both <code>List&lt;String&gt;</code> and <code>List&lt;Loan&gt;</code>, but not <code>List&lt;int&gt;</code>?","Every reference type is stored and moved with the same reference instructions (<code>aaload</code>, <code>areturn</code>), so the compiled code works for any of them once types are erased to <code>Object</code>. An <code>int</code> is a raw value that needs different instructions (<code>iaload</code>, <code>ireturn</code>), so different bytecode is required.")}
${Q("Jackson can deserialise into <code>List&lt;Loan&gt;</code> with <code>new TypeReference&lt;List&lt;Loan&gt;&gt;(){}</code>. If generics are erased, where does it find <code>Loan</code>?","The <code>{}</code> creates an anonymous subclass. A class's declared superclass, including its type arguments, is stored in the class file's <code>Signature</code> attribute and is not erased. Jackson reads it with <code>getGenericSuperclass()</code>.")}
${Q("Why does <code>new T()</code> fail, but <code>Supplier&lt;T&gt;</code> works?","At runtime <code>T</code> is just <code>Object</code>, so the JVM does not know which class to construct. A <code>Supplier&lt;T&gt;</code> is passed by a caller who knows the concrete type at their call site, such as <code>Loan::new</code>, so the knowledge travels as a value instead of a type.")}
${Q("In <code>IntList.get</code>, why check against <code>size</code> rather than relying on the array's own bounds check?","The backing array is usually larger than the number of elements (spare capacity after growth). Indexes between <code>size</code> and <code>data.length</code> are inside the array but are not elements of the list, so the array alone would return a stale 0 instead of throwing.")}
`});
/* ===================== JAVA 9 – 17 ===================== */
T.push({
id:"j17-overview", track:"java17", title:"What changed from 8 to 17", since:"JDK 9–17", jep:null,
lede:"Nine releases in four years. A map of what matters for a backend developer, so the following lessons have context.",
html:`
<h2>Start from the problem</h2>
<p>Java 8 shipped in 2014. Then Java moved to a release every six months, with a Long-Term Support release every few years: 11 (2018), 17 (2021), 21 (2023), 25 (2025). Most companies jump LTS to LTS, so "Java 17" really means everything in 9 through 17 at once.</p>
<p>Two themes run through these releases. First, <strong>say what you mean with less code</strong>: <code>var</code>, records, text blocks, switch expressions. Second, <strong>model data so the compiler can check it</strong>: sealed types and pattern matching. Java 21 completes the second theme.</p>

<div class="table-wrap"><table>
<thead><tr><th>Release</th><th>What you will use daily</th></tr></thead>
<tbody>
<tr><td>9</td><td>Module system (JPMS), <code>List.of</code>/<code>Map.of</code>, <code>Optional.ifPresentOrElse</code>, <code>Stream.takeWhile</code>, JShell, private interface methods</td></tr>
<tr><td>10</td><td><code>var</code> for local variables, <code>List.copyOf</code>, container-aware JVM (respects Docker CPU/memory limits)</td></tr>
<tr><td>11 LTS</td><td><code>HttpClient</code>, <code>String.isBlank/strip/lines/repeat</code>, <code>Files.readString</code>, run a single file with <code>java Main.java</code></td></tr>
<tr><td>12–13</td><td>Compact number format, <code>Collectors.teeing</code></td></tr>
<tr><td>14</td><td>Switch expressions (final), helpful NullPointerException messages</td></tr>
<tr><td>15</td><td>Text blocks (final), ZGC production-ready</td></tr>
<tr><td>16</td><td>Records and <code>instanceof</code> pattern matching (final), <code>Stream.toList()</code></td></tr>
<tr><td>17 LTS</td><td>Sealed classes (final), strong encapsulation of JDK internals, new macOS rendering, <code>RandomGenerator</code></td></tr>
</tbody></table></div>

<h3>The module system in one paragraph</h3>
<p>Java 9 split the JDK into ~70 modules, and since 17, code can no longer reach into JDK internals like <code>sun.misc.*</code> by reflection unless you open them with <code>--add-opens</code>. That is the cause of many "InaccessibleObjectException" errors when upgrading old libraries. Most application code still runs on the classpath and never writes a <code>module-info.java</code>; that is fine.</p>

<h3>Small APIs that remove boilerplate</h3>
${J(String.raw`var rates = new HashMap<String, BigDecimal>();      // 10: type inferred from right side
List<String> codes = List.of("FIX", "VAR", "MIX");   // 9: immutable, rejects nulls
Map<String, Integer> m = Map.of("a", 1, "b", 2);

String body = Files.readString(Path.of("rates.json")); // 11
"  hi  ".strip();        // 11: Unicode-aware trim
"ab".repeat(3);          // 11: "ababab"
" ".isBlank();           // 11: true

List<Integer> evens = IntStream.range(0, 10).filter(i -> i % 2 == 0).boxed().toList(); // 16

HttpClient client = HttpClient.newHttpClient();       // 11: replaces HttpURLConnection
HttpResponse<String> r = client.send(
    HttpRequest.newBuilder(URI.create("https://api.example.com/rates")).build(),
    HttpResponse.BodyHandlers.ofString());`)}

<h3>Helpful NullPointerExceptions (JEP 358)</h3>
${J(String.raw`// Before: java.lang.NullPointerException  (which one?!)
// Now:
// Cannot invoke "Address.getCity()" because the return value of
// "Customer.getAddress()" is null
String city = customer.getAddress().getCity();`)}

<h2>Traps when upgrading 8 → 17</h2>
<ul class="traps">
<li><code>javax.xml.bind</code> (JAXB), <code>javax.annotation</code> and Java EE modules were removed in 11. Add them as Maven dependencies. Spring Boot 3 moved everything to <code>jakarta.*</code> package names.</li>
<li><code>List.of(...)</code> is immutable and throws on <code>null</code>. <code>Arrays.asList</code> allowed set, and nulls.</li>
<li><code>Stream.toList()</code> returns an unmodifiable list; <code>Collectors.toList()</code> returns a mutable <code>ArrayList</code> in practice.</li>
<li>Old Lombok, Mockito, ByteBuddy versions break on newer JDKs. Upgrade build plugins first.</li>
</ul>
`});

T.push({
id:"j17-var", track:"java17", title:"var: local type inference", since:"JDK 10", jep:"JEP 286",
lede:"var is not dynamic typing. The type is still fixed at compile time; you simply stop repeating it.",
html:`
<h2>Start from the problem</h2>
<p>When the right-hand side already states the type, writing it again on the left is pure repetition: <code>Map&lt;String, List&lt;Loan&gt;&gt; byProduct = new HashMap&lt;String, List&lt;Loan&gt;&gt;();</code>. The compiler already knows. <code>var</code> asks it to fill in the declared type from the initializer.</p>
${J(String.raw`var byProduct = new HashMap<String, List<Loan>>();   // type: HashMap<String, List<Loan>>
for (var entry : byProduct.entrySet()) { ... }       // Map.Entry<String, List<Loan>>
try (var in = Files.newBufferedReader(path)) { ... }

var x = 10;
x = "ten";        // compile error: x is an int, forever`)}

<h2>The rules, and why each exists</h2>
<ul>
<li><strong>Local variables only.</strong> Not fields, parameters, or return types. Those are part of an API; their types must be written down for readers and for binary compatibility.</li>
<li><strong>Must have an initializer.</strong> No initializer means nothing to infer from.</li>
<li><strong>Not <code>null</code> alone.</strong> <code>var x = null;</code> has no type to infer.</li>
<li><strong>Lambdas need a target.</strong> <code>var f = () -&gt; 1;</code> fails: a lambda has no type until it meets a functional interface.</li>
</ul>

<h2>When it helps and when it hurts</h2>
${J(String.raw`var list = new ArrayList<Loan>();   // fine: type obvious
var result = service.process(req);  // bad: what is result? Reader must open process()

var items = new ArrayList<>();      // trap: infers ArrayList<Object>`)}
<p>A useful rule: use <code>var</code> when the type is obvious from the line itself, or the variable name says what matters. Prefer explicit types where the type carries meaning the name does not.</p>
<p><code>var</code> is a <em>reserved type name</em>, not a keyword, so existing code with a variable called <code>var</code> still compiles.</p>
`});

T.push({
id:"j17-records", track:"java17", title:"Records", since:"JDK 16", jep:"JEP 395",
lede:"A record declares that a class is nothing more than its data. From that one statement the compiler can write the rest.",
html:`
<h2>Start from the problem</h2>
<p>A DTO with three fields in Java 8 needs: private final fields, a constructor, three getters, <code>equals</code>, <code>hashCode</code>, <code>toString</code>. About 50 lines, all mechanically derivable, all easy to get subtly wrong (forget one field in <code>hashCode</code> and <code>HashSet</code> breaks). Lombok's <code>@Value</code> existed precisely because of this.</p>
<p>First principles: if a class's identity <em>is</em> its data, then its constructor, accessors, equality and string form are all determined by the list of fields. So let the programmer write only the list.</p>

<h2>Build it up</h2>
${J(String.raw`public record RateQuote(String product, int fixedYears, BigDecimal rate) { }

// You get, for free:
//  - private final fields product, fixedYears, rate
//  - canonical constructor RateQuote(String, int, BigDecimal)
//  - accessors product(), fixedYears(), rate()      <- no "get" prefix
//  - equals/hashCode over all components
//  - toString: RateQuote[product=FIX, fixedYears=10, rate=3.85]

var q = new RateQuote("FIX", 10, new BigDecimal("3.85"));
q.rate();                                        // 3.85
q.equals(new RateQuote("FIX", 10, new BigDecimal("3.85")));  // true`)}

<h3>Validation: the compact constructor</h3>
<p>You often need invariants. A compact constructor runs your checks, then the compiler assigns the fields.</p>
${J(String.raw`public record RateQuote(String product, int fixedYears, BigDecimal rate) {
    public RateQuote {                                   // no parameter list
        Objects.requireNonNull(product);
        if (fixedYears < 0) throw new IllegalArgumentException("fixedYears < 0");
        rate = rate.setScale(4, RoundingMode.HALF_UP);   // may normalise parameters
    }
    public static RateQuote variable(BigDecimal r) { return new RateQuote("VAR", 0, r); }
    public RateQuote withRate(BigDecimal r) { return new RateQuote(product, fixedYears, r); } // "wither"
}`)}

<h3>What a record cannot do, and why</h3>
<ul>
<li>Cannot extend a class (it implicitly extends <code>java.lang.Record</code>). It can implement interfaces.</li>
<li>Cannot declare extra instance fields. Extra state would break "the record is its components".</li>
<li>Fields are final. It is <em>shallowly</em> immutable: a <code>List</code> component can still be mutated unless you copy it with <code>List.copyOf</code> in the compact constructor.</li>
</ul>

<h3>Where to use them</h3>
${J(String.raw`// Request/response bodies (Jackson 2.12+ supports records)
public record CreateLoanRequest(@NotBlank String customerId, @Positive BigDecimal amount) { }

// Spring Data projections
public interface LoanRepo extends JpaRepository<Loan, Long> {
    @Query("select new com.x.LoanSummary(l.id, l.status) from Loan l")
    List<LoanSummary> summaries();
}
public record LoanSummary(Long id, Status status) { }

// Map keys and multi-value returns
record Key(String product, int years) { }
Map<Key, BigDecimal> table = new HashMap<>();

// Local records inside a method
record Pair(String name, long count) { }`)}

<h2>Traps</h2>
<ul class="traps">
<li>Records are a poor fit for JPA entities. Entities need a no-arg constructor, mutable state, and identity separate from field values.</li>
<li>Array components use reference equality in <code>equals</code>. Two records with equal-content arrays are not equal.</li>
<li>Accessors are <code>rate()</code>, not <code>getRate()</code>. Old frameworks that look for JavaBean getters may not see them.</li>
</ul>

<h2>Check yourself</h2>
${Q("A record has a <code>List&lt;String&gt; tags</code> component. How do you make it truly immutable?","In the compact constructor: <code>tags = List.copyOf(tags);</code>. This copies into an unmodifiable list, so neither the caller's original list nor callers of <code>tags()</code> can change the record's state.")}
`});

T.push({
id:"j17-sealed", track:"java17", title:"Sealed classes", since:"JDK 17", jep:"JEP 409",
lede:"Sealed types let you say 'these are all the possible kinds', and have the compiler hold you to it.",
html:`
<h2>Start from the problem</h2>
<p>Inheritance in Java has always been open: anyone can extend a non-final class or implement an interface. That is great for frameworks, bad for domain models. If a payment is either a <code>Card</code>, <code>Ideal</code> or <code>BankTransfer</code>, and nothing else, you previously had no way to tell the compiler. So every <code>if/else instanceof</code> chain needed a defensive <code>else throw</code>, and when someone added a fourth type, nothing told you which chains to update.</p>
<p>The idea: a type can list exactly which subtypes are allowed. Now the set of cases is closed and known at compile time, which is what makes exhaustive checking possible.</p>

<h2>Build it up</h2>
${J(String.raw`public sealed interface Payment permits Card, Ideal, BankTransfer { }

public record Card(String last4, String network) implements Payment { }
public record Ideal(String bank)                  implements Payment { }
public record BankTransfer(String iban)          implements Payment { }`)}
<p>Each permitted subclass must say how it continues the hierarchy:</p>
<ul>
<li><code>final</code>: no further subclasses (records are implicitly final).</li>
<li><code>sealed</code>: its own closed list of subclasses.</li>
<li><code>non-sealed</code>: reopens that branch to anyone. An explicit, visible escape hatch.</li>
</ul>
${J(String.raw`public sealed abstract class Shape permits Circle, Polygon { }
public final class Circle extends Shape { ... }
public non-sealed class Polygon extends Shape { ... }   // anyone may extend Polygon`)}

<h3>The payoff (fully realised in Java 21)</h3>
${J(String.raw`String describe(Payment p) {
    return switch (p) {
        case Card c        -> "Card ending " + c.last4();
        case Ideal i       -> "iDEAL via " + i.bank();
        case BankTransfer b -> "Transfer from " + b.iban();
        // no default needed: compiler knows these are all cases
    };
}
// Add "record Klarna(...) implements Payment" to the permits list
// -> every switch like this one stops compiling until you handle it.`)}
<p>Records give you <strong>product types</strong> (this AND that). Sealed interfaces give you <strong>sum types</strong> (this OR that). Together they let you model a domain as algebraic data types, the same idea as Kotlin sealed classes or Rust enums.</p>

<h2>Rules</h2>
<ul>
<li>Permitted subclasses must be in the same module, or the same package if you are on the classpath.</li>
<li>If they are in the same file, you can omit <code>permits</code> and the compiler infers it.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why is a <code>default</code> branch in a switch over a sealed type usually a bad idea?","It silences the exhaustiveness check. When a new subtype is added, the default quietly handles it instead of causing a compile error that points you to every place needing an update.")}
`});

T.push({
id:"j17-switch", track:"java17", title:"Switch expressions & instanceof patterns", since:"JDK 14 / 16", jep:"JEP 361, 394",
lede:"Switch becomes an expression that produces a value, and instanceof learns to bind a variable so the cast disappears.",
html:`
<h2>Start from the problem</h2>
<p>The old switch was a statement copied from C: it falls through unless you remember <code>break</code>, it cannot produce a value directly, and the compiler does not check that you covered every case. Code that "computes a value from a case" had to declare a variable, assign it in each branch and hope none was missed.</p>

<h2>Switch expressions</h2>
${J(String.raw`// Before
int days;
switch (month) {
    case FEBRUARY: days = 28; break;
    case APRIL: case JUNE: case SEPTEMBER: case NOVEMBER: days = 30; break;
    default: days = 31;
}

// Java 14
int days = switch (month) {
    case FEBRUARY -> 28;
    case APRIL, JUNE, SEPTEMBER, NOVEMBER -> 30;
    default -> 31;
};

// Multi-line branch: yield returns the value from a block
String label = switch (status) {
    case ACTIVE -> "Active";
    case DEFAULTED -> {
        audit.log(id);
        yield "In default";
    }
    default -> "Other";
};`)}
<p>Arrow cases never fall through. A switch <em>expression</em> must be exhaustive, so for an enum with all constants listed you need no <code>default</code>, and adding a constant breaks the build where it should.</p>

<h2>Pattern matching for instanceof</h2>
<p>Every <code>instanceof</code> check was followed by a cast that repeated the same type. Pattern matching tests and binds in one step.</p>
${J(String.raw`// Before
if (obj instanceof String) {
    String s = (String) obj;
    return s.length();
}

// Java 16
if (obj instanceof String s && !s.isBlank()) {   // s in scope after && too
    return s.length();
}

// Scope follows definite assignment
if (!(obj instanceof Loan loan)) {
    throw new IllegalArgumentException();
}
loan.approve();       // loan is in scope here, because the if exits otherwise

@Override public boolean equals(Object o) {
    return o instanceof RateQuote q && product.equals(q.product) && rate.equals(q.rate);
}`)}

<h2>Text blocks (JEP 378, JDK 15)</h2>
${J(String.raw`String sql = """
    SELECT id, rate
    FROM interest_rate
    WHERE product = ?
      AND valid_from <= CURRENT_DATE
    """;
// Indentation is stripped up to the closing delimiter's column.
// Use \ at line end to join lines, \s to keep trailing space.

String json = """
    {"product": "%s", "years": %d}
    """.formatted(product, years);`)}
`});
/* ===================== JAVA 21 ===================== */
T.push({
id:"j21-virtual", track:"java21", title:"Virtual threads", since:"JDK 21", jep:"JEP 444",
lede:"Threads become cheap enough to use one per task again, so simple blocking code scales like async code.",
html:`
<h2>Start from the problem</h2>
<p>A classic Java server gives each request its own thread. That is the easiest code to write and debug: straight-line, blocking, with readable stack traces. But a Java thread before 21 is a <strong>platform thread</strong>: a thin wrapper around an operating-system thread. Each one reserves around 1 MB of stack, and the OS scheduler gets slow beyond a few thousand. So a server tops out at a few hundred to a few thousand concurrent requests.</p>
<p>Now look at what those threads do. A typical request spends 5 ms computing and 195 ms waiting on a database or HTTP call. During the wait, the OS thread is parked, holding its memory, doing nothing. The scarce resource is being wasted on waiting.</p>
<p>The industry answer was reactive programming (WebFlux, CompletableFuture chains): never block, so a few threads serve many requests. It works, but you give up straight-line code, stack traces and try/catch. Virtual threads ask a different question: <em>what if blocking were cheap?</em></p>

<h2>Build it up</h2>
<p>A virtual thread is a Java object managed by the JVM, not the OS. Its stack lives on the heap as a chunk of objects that grows and shrinks. The JVM runs virtual threads on a small pool of platform threads called <strong>carrier threads</strong> (a <code>ForkJoinPool</code>, one per CPU core by default).</p>
<p>When a virtual thread hits a blocking call such as a socket read, the JDK does not block the carrier. It <strong>unmounts</strong> the virtual thread: copies its stack frames to the heap, registers interest in the socket, and frees the carrier to run another virtual thread. When data arrives, the virtual thread is <strong>mounted</strong> on any free carrier and continues exactly where it left off.</p>
${J(String.raw`// One virtual thread per task. A million is fine.
try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
    IntStream.range(0, 100_000).forEach(i ->
        executor.submit(() -> {
            Thread.sleep(Duration.ofSeconds(1));   // unmounts, carrier freed
            return i;
        }));
}   // close() waits for all tasks. Finishes in ~1 second, on ~8 carrier threads.

Thread t = Thread.ofVirtual().name("rate-sync-", 0).start(() -> sync());
Thread.startVirtualThread(() -> System.out.println(Thread.currentThread()));
// VirtualThread[#21]/runnable@ForkJoinPool-1-worker-1   <- carrier shown after @`)}

<h3>Spring Boot</h3>
${J(String.raw`# application.properties, Spring Boot 3.2+
spring.threads.virtual.enabled=true
# Tomcat now serves each request on a new virtual thread.
# @Async, @Scheduled task executors and RabbitMQ/Kafka listeners use them too.`)}

<h2>Mental model: what virtual threads change and what they do not</h2>
<ul>
<li>They improve <strong>throughput</strong> (how many concurrent waits you can afford), not <strong>latency</strong>. A 200 ms query still takes 200 ms.</li>
<li>They help I/O-bound work. CPU-bound work still only has as many cores as you have; more threads add nothing.</li>
<li><strong>Do not pool them.</strong> Pools exist because threads were expensive. A virtual thread is cheaper than the bookkeeping of a pool. Create one per task.</li>
<li>To limit concurrency against a scarce resource (a DB with 20 connections, a rate-limited API), use a <code>Semaphore</code>, not a small thread pool.</li>
</ul>
${J(String.raw`private final Semaphore partnerApiLimit = new Semaphore(10);

Rate fetch(String id) throws InterruptedException {
    partnerApiLimit.acquire();
    try { return partnerApi.get(id); }
    finally { partnerApiLimit.release(); }
}`)}

<h2>Pinning: the trap you need to know</h2>
<p>In Java 21, a virtual thread cannot unmount while it is inside a <code>synchronized</code> block or a native method. It <strong>pins</strong> its carrier. If many virtual threads block on I/O inside <code>synchronized</code>, all carriers get pinned and the application stalls even though thousands of threads are "ready".</p>
${J(String.raw`// Pins the carrier during the HTTP call (Java 21-23)
synchronized (cache) {
    value = httpClient.send(req, ofString());
}

// Fix: ReentrantLock lets the virtual thread unmount while waiting
private final ReentrantLock lock = new ReentrantLock();
lock.lock();
try { value = httpClient.send(req, ofString()); }
finally { lock.unlock(); }

// Detect pinning (Java 21):  -Djdk.tracePinnedThreads=full
// or the JFR event jdk.VirtualThreadPinned`)}
<p><strong>JDK 24 (JEP 491)</strong> removed this limitation for <code>synchronized</code>, so on Java 25 LTS it no longer pins. Native calls still do. If you run on 21, prefer <code>ReentrantLock</code> around blocking calls and check libraries (old JDBC drivers used <code>synchronized</code> heavily).</p>

<h2>Other traps</h2>
<ul class="traps">
<li><code>ThreadLocal</code> works, but with a million threads, a large cached object per thread is a million objects. Avoid ThreadLocal caches; see Scoped Values.</li>
<li>Virtual threads are always daemon threads and their priority cannot be changed.</li>
<li>Migrating moves the bottleneck. With unlimited request threads, a 10-connection DB pool now becomes the queue. Size pools and timeouts for that.</li>
</ul>

<h2>Check yourself</h2>
${Q("Your service has 8 cores and does pure image resizing. Will virtual threads make it faster?","No. The work is CPU-bound; 8 cores can do 8 resizes at a time no matter how many threads exist. Virtual threads help when threads spend most of their time waiting.")}
${Q("Why is <code>Executors.newFixedThreadPool(200, Thread.ofVirtual().factory())</code> a smell?","It pools virtual threads, which gives no benefit, and silently caps concurrency at 200 in a way that looks like a performance setting. If you need a limit, a Semaphore states the intent directly.")}
`});

T.push({
id:"j21-patterns", track:"java21", title:"Pattern matching for switch & record patterns", since:"JDK 21", jep:"JEP 440, 441",
lede:"Switch can now match on type and shape, take records apart, and check that every case is handled.",
html:`
<h2>Start from the problem</h2>
<p>Records and sealed types let you model "a Payment is a Card OR an Ideal OR a Transfer, and a Card has a last4 and a network". But consuming that model still required <code>instanceof</code> chains and accessor calls. The final piece is a construct that mirrors the data: match on which kind it is, and pull the components out in the same step.</p>

<h2>Type patterns in switch</h2>
${J(String.raw`static String format(Object o) {
    return switch (o) {
        case null       -> "null";                 // switch can now handle null explicitly
        case Integer i when i > 1000 -> "big " + i; // guard with 'when'
        case Integer i  -> "int " + i;
        case String s   -> "str " + s;
        case int[] arr  -> "array of " + arr.length;
        default         -> o.toString();
    };
}`)}
<p>Order matters: cases are tried top to bottom, and the compiler rejects a case that can never match because an earlier one dominates it (for example, <code>case Integer i</code> before <code>case Integer i when i &gt; 1000</code>).</p>

<h2>Record patterns: deconstruction</h2>
${J(String.raw`sealed interface Shape permits Circle, Rect { }
record Point(double x, double y) { }
record Circle(Point centre, double r) implements Shape { }
record Rect(Point topLeft, Point bottomRight) implements Shape { }

static double area(Shape s) {
    return switch (s) {
        case Circle(Point c, double r) -> Math.PI * r * r;
        case Rect(Point(var x1, var y1), Point(var x2, var y2))   // nested!
            -> Math.abs(x2 - x1) * Math.abs(y2 - y1);
    };   // exhaustive over the sealed interface: no default
}

// Also in instanceof
if (obj instanceof Circle(Point(var x, var y), var r) && r > 0) { ... }`)}

<h3>A realistic example: a result type</h3>
${J(String.raw`sealed interface Result<T> permits Ok, Err { }
record Ok<T>(T value) implements Result<T> { }
record Err<T>(String code, String message) implements Result<T> { }

ResponseEntity<?> toHttp(Result<Loan> r) {
    return switch (r) {
        case Ok<Loan>(var loan)                       -> ResponseEntity.ok(loan);
        case Err<Loan>(var code, var msg) when code.equals("NOT_FOUND")
                                                      -> ResponseEntity.notFound().build();
        case Err<Loan>(var code, var msg)             -> ResponseEntity.badRequest().body(msg);
    };
}`,"Errors become values the compiler forces you to handle")}

<h2>Data-oriented programming</h2>
<p>This combination enables a style where data (records) is separate from the operations on it (functions with pattern switches). It is the opposite trade-off from classic OO polymorphism:</p>
<ul>
<li>OO (a virtual method per subclass): easy to add a new <em>type</em>, hard to add a new <em>operation</em> (touch every class).</li>
<li>Pattern switch over sealed types: easy to add a new <em>operation</em> (one new function), and the compiler lists every switch to fix when you add a new <em>type</em>.</li>
</ul>
<p>Use it for messages, events, commands, parse trees, API results: places where the set of cases is stable and the operations grow.</p>

<h2>Check yourself</h2>
${Q("What happens at runtime if a switch over a sealed interface was compiled as exhaustive, but a new subclass is added and only that subclass is recompiled?","The switch throws <code>MatchException</code>. The compiler inserts a synthetic default for this separate-compilation case.")}
`});

T.push({
id:"j21-sequenced", track:"java21", title:"Sequenced collections", since:"JDK 21", jep:"JEP 431",
lede:"A shared interface for every collection that has a defined first and last element.",
html:`
<h2>Start from the problem</h2>
<p>List, Deque, LinkedHashSet and SortedSet all have an encounter order, but there was no common type for "ordered collection", and getting the last element looked different on each:</p>
${J(String.raw`list.get(list.size() - 1);
deque.getLast();
sortedSet.last();
// LinkedHashSet: iterate the whole thing
// LinkedHashMap: no way to reverse-iterate at all`)}
<h2>Build it up</h2>
<p>Java 21 inserts three interfaces into the hierarchy: <code>SequencedCollection</code>, <code>SequencedSet</code> and <code>SequencedMap</code>.</p>
${J(String.raw`interface SequencedCollection<E> extends Collection<E> {
    SequencedCollection<E> reversed();   // a view, not a copy
    void addFirst(E e);  void addLast(E e);
    E getFirst();        E getLast();
    E removeFirst();     E removeLast();
}

List<String> l = new ArrayList<>(List.of("a", "b", "c"));
l.getLast();                 // "c"
l.reversed().forEach(...);   // c, b, a

LinkedHashMap<String, Integer> m = new LinkedHashMap<>();
m.putFirst("x", 1);
m.firstEntry(); m.pollLastEntry();
m.sequencedKeySet().reversed();`)}
<h2>Trap</h2>
<ul class="traps"><li>A class of your own that already declared a <code>reversed()</code> or <code>getFirst()</code> with a different return type may stop compiling after upgrading to 21. Kotlin code calling <code>list.getFirst()</code> also changed behaviour on older Android targets.</li></ul>
`});

T.push({
id:"j21-structured", track:"java21", title:"Structured concurrency & scoped values", since:"JDK 21 preview → 25", jep:"JEP 453, 446 / 505, 506",
lede:"If threads are cheap, the hard part becomes managing their lifetimes and passing context. These two APIs address that.",
html:`
<h2>Start from the problem</h2>
<p>With an executor, a subtask is unstructured: it can outlive the method that started it. If you fork two calls and the first fails, the second keeps running, wasting resources, and nothing cancels it. If the parent thread is interrupted, the children do not notice. Thread dumps show a flat list of threads with no idea which belongs to which request.</p>
<p>Structured programming solved the same problem for control flow decades ago: a block has one entry and one exit. <strong>Structured concurrency</strong> applies it to threads: subtasks start inside a scope and cannot outlive it.</p>

<h2>Structured concurrency</h2>
<p>This API was a preview in 21 (JEP 453) and is still being refined (JEP 505 in Java 25, with a revised factory-method shape). The idea is stable; the method names may differ by version. Previews need <code>--enable-preview</code>.</p>
${J(String.raw`// Java 21 preview shape
Dashboard load(String id) throws Exception {
    try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {
        Subtask<Customer>   customer = scope.fork(() -> crm.load(id));
        Subtask<List<Loan>> loans    = scope.fork(() -> loanApi.forCustomer(id));

        scope.join()             // wait for both
             .throwIfFailed();   // if either failed: the other was cancelled, rethrow

        return new Dashboard(customer.get(), loans.get());
    }   // scope closed: no subtask can still be running
}

// Java 25 preview shape (JEP 505):
// try (var scope = StructuredTaskScope.open()) { ... scope.join(); ... }`)}
<p>Compare with the CompletableFuture lesson: same parallelism, but cancellation on failure is automatic, the code is straight-line, and thread dumps (<code>jcmd &lt;pid&gt; Thread.dump_to_file -format=json</code>) show subtasks nested under their parent.</p>

<h2>Scoped values</h2>
<p><code>ThreadLocal</code> has three problems: it is mutable (any code can <code>set</code> it), its lifetime is unbounded (forget <code>remove()</code> in a pooled thread and the next request sees stale data), and inheritance to child threads copies values. With millions of virtual threads, that cost adds up.</p>
<p>A <code>ScopedValue</code> is bound for the duration of a call and is immutable within it. When the call returns, the binding is gone. It was finalised in <strong>Java 25 (JEP 506)</strong>.</p>
${J(String.raw`static final ScopedValue<String> TENANT = ScopedValue.newInstance();

// in a filter
ScopedValue.where(TENANT, request.getHeader("X-Tenant"))
           .run(() -> chain.doFilter(req, res));

// deep in the call stack
String tenant = TENANT.get();   // throws if not bound; isBound() to check
// Subtasks forked inside a StructuredTaskScope inherit the binding automatically.`)}
`});
/* ===================== THREADS & CONCURRENCY ===================== */
T.push({
id:"th-basics", track:"threads", title:"What a thread actually is", since:"JDK 1.0", jep:null,
lede:"A thread is an independent program counter and stack that shares the heap with every other thread. Every concurrency problem follows from that one sentence.",
html:`
<h2>Start from the problem</h2>
<p>A CPU core executes one instruction stream at a time. To do several things "at once", the OS gives each task its own <strong>execution context</strong>: an instruction pointer (where am I in the code?), registers, and a <strong>stack</strong> (local variables and the chain of method calls). The OS switches cores between these contexts many times per second. Each context is a thread.</p>
<p>Inside one JVM process, all threads share one <strong>heap</strong>, where objects live. That is the point (threads can cooperate on shared data cheaply) and the danger (they can corrupt it).</p>
<div class="fig">
<svg viewBox="0 0 560 220" role="img" aria-label="Two threads each with their own stack, both pointing into one shared heap">
<rect x="20" y="20" width="150" height="120" class="f-box"/><text x="95" y="42" class="f-t">Thread A stack</text>
<rect x="35" y="55" width="120" height="22" class="f-in"/><text x="95" y="70" class="f-s">handle(req)</text>
<rect x="35" y="82" width="120" height="22" class="f-in"/><text x="95" y="97" class="f-s">local: count = 3</text>
<rect x="390" y="20" width="150" height="120" class="f-box"/><text x="465" y="42" class="f-t">Thread B stack</text>
<rect x="405" y="55" width="120" height="22" class="f-in"/><text x="465" y="70" class="f-s">handle(req)</text>
<rect x="405" y="82" width="120" height="22" class="f-in"/><text x="465" y="97" class="f-s">local: count = 7</text>
<rect x="190" y="150" width="180" height="56" class="f-acc"/><text x="280" y="174" class="f-t">Heap (shared)</text><text x="280" y="193" class="f-s">Account { balance = 100 }</text>
<path d="M95 140 L230 158" class="f-arrow"/><path d="M465 140 L330 158" class="f-arrow"/>
<text x="280" y="70" class="f-s">private: safe</text><text x="280" y="122" class="f-s">shared: needs coordination</text>
</svg>
<p class="cap">Locals are private to each stack. Objects on the heap are reachable by every thread that has a reference.</p>
</div>

<h2>Build it up</h2>
${J(String.raw`Runnable job = () -> System.out.println("on " + Thread.currentThread().getName());

Thread t = new Thread(job, "worker-1");
t.start();     // creates the OS thread and calls run() on it
t.run();       // trap: just calls the method on the CURRENT thread
t.join();      // wait for t to finish`)}

<h3>Lifecycle</h3>
<div class="table-wrap"><table>
<thead><tr><th>State</th><th>Meaning</th><th>You see it when</th></tr></thead>
<tbody>
<tr><td><code>NEW</code></td><td>Created, not started</td><td>Before <code>start()</code></td></tr>
<tr><td><code>RUNNABLE</code></td><td>Running or ready to run. Includes blocked in native socket I/O.</td><td>Busy threads in a dump</td></tr>
<tr><td><code>BLOCKED</code></td><td>Waiting to enter a <code>synchronized</code> block another thread holds</td><td>Lock contention</td></tr>
<tr><td><code>WAITING</code></td><td>Waiting indefinitely: <code>join()</code>, <code>wait()</code>, <code>LockSupport.park()</code></td><td>Idle pool threads on a queue</td></tr>
<tr><td><code>TIMED_WAITING</code></td><td>Same with a timeout: <code>sleep</code>, <code>poll(timeout)</code></td><td>Scheduled tasks, retries</td></tr>
<tr><td><code>TERMINATED</code></td><td><code>run()</code> returned or threw</td><td></td></tr>
</tbody></table></div>

<h3>Interruption: the cooperative stop signal</h3>
<p>Java cannot safely kill a thread from outside (<code>Thread.stop</code> is removed: it could leave objects half-updated). Instead, you <em>ask</em> a thread to stop by setting its interrupt flag. Blocking methods like <code>sleep</code>, <code>wait</code>, and <code>BlockingQueue.take</code> notice and throw <code>InterruptedException</code>.</p>
${J(String.raw`public void run() {
    while (!Thread.currentThread().isInterrupted()) {
        try {
            Task t = queue.take();
            process(t);
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt();   // restore flag, then exit
            return;
        }
    }
}`,"Never swallow InterruptedException with an empty catch")}

<h2>Traps</h2>
<ul class="traps">
<li>Catching <code>InterruptedException</code> clears the flag. If you cannot rethrow it, call <code>interrupt()</code> again so code higher up sees it.</li>
<li>An uncaught exception in a plain thread just kills that thread and prints to stderr. Set an <code>UncaughtExceptionHandler</code> or use an executor and inspect the <code>Future</code>.</li>
<li>Non-daemon threads keep the JVM alive after <code>main</code> ends.</li>
</ul>
`});

T.push({
id:"th-jmm", track:"threads", title:"Java Memory Model: visibility & happens-before", since:"JDK 5", jep:"JSR 133",
lede:"Without a rule that says otherwise, one thread is not guaranteed to ever see another thread's writes, or to see them in order.",
html:`
<h2>Start from the problem</h2>
<p>This loop can run forever on a server JVM, even after another thread sets <code>running = false</code>:</p>
${J(String.raw`class Worker {
    private boolean running = true;
    void stop() { running = false; }          // called from thread B
    void loop() { while (running) { work++; } }  // thread A may never stop
}`)}
<p>How? Two hardware and compiler facts:</p>
<ol>
<li><strong>Caches.</strong> Each core has its own cache. A write on core 1 may sit in a store buffer and not be visible to core 2 for a while.</li>
<li><strong>Reordering.</strong> The JIT compiler and the CPU reorder instructions whenever a single thread could not tell the difference. The JIT sees that <code>loop</code> never writes <code>running</code>, so it may read it once and turn the loop into <code>while (true)</code>.</li>
</ol>
<p>Both are huge performance wins and are invisible in single-threaded code. For multithreaded code, Java needs a contract that says exactly when a write by one thread must be visible to a read by another. That contract is the <strong>Java Memory Model (JMM)</strong>.</p>

<h2>Build it up: happens-before</h2>
<p>The JMM defines a partial order called <strong>happens-before</strong>. If action X happens-before action Y, then Y sees everything X (and everything before X in its thread) wrote. If there is no happens-before edge between a write and a read of the same variable from different threads, that is a <strong>data race</strong>, and the read may return a stale value.</p>
<p>The main edges:</p>
<ul>
<li><strong>Program order</strong>: within one thread, each action happens-before the next.</li>
<li><strong>Monitor lock</strong>: unlocking a monitor happens-before every later lock of the same monitor.</li>
<li><strong>Volatile</strong>: a write to a volatile field happens-before every later read of that field.</li>
<li><strong>Thread start / join</strong>: <code>t.start()</code> happens-before anything in <code>t</code>; everything in <code>t</code> happens-before another thread's <code>t.join()</code> returns.</li>
<li><strong>Transitivity</strong>: if A hb B and B hb C, then A hb C. This is what makes "publish via a volatile flag" work.</li>
<li>Plus: concurrent collections, <code>Future.get</code>, <code>CountDownLatch</code> and executors all document happens-before edges.</li>
</ul>
${J(String.raw`class Config {
    private Map<String, String> values;          // plain field
    private volatile boolean ready;              // the publication flag

    void load() {                                // thread A
        values = readFromDisk();                 // (1)
        ready = true;                            // (2) volatile write
    }
    String get(String k) {                       // thread B
        if (!ready) return null;                 // (3) volatile read sees (2)
        return values.get(k);                    // (4) guaranteed to see (1): 1 hb 2 hb 3 hb 4
    }
}`,"Transitivity: the volatile edge carries the earlier plain write along with it")}

<h3>Volatile: what it does and does not do</h3>
<p><code>volatile</code> guarantees visibility and ordering for that field. It does <strong>not</strong> make compound actions atomic. <code>count++</code> is read, add, write: three steps. Two threads can both read 5 and both write 6.</p>
${J(String.raw`private volatile int count;
count++;                         // still a race: lost updates

private final AtomicInteger count = new AtomicInteger();
count.incrementAndGet();         // atomic via compare-and-swap (CAS)`)}

<h3>Final fields and safe publication</h3>
<p>The JMM gives <code>final</code> fields a special guarantee: once a constructor finishes, any thread that sees a reference to the object sees the correctly initialized final fields, even if the reference was published through a race. That is why immutable objects (all fields final, records) are thread-safe without locks.</p>

<h2>The double-checked locking story</h2>
${J(String.raw`private static volatile Singleton instance;    // volatile is essential
static Singleton get() {
    Singleton s = instance;
    if (s == null) {
        synchronized (Singleton.class) {
            s = instance;
            if (s == null) instance = s = new Singleton();
        }
    }
    return s;
}
// Without volatile, another thread may see a non-null reference to an object
// whose constructor writes are not yet visible. Simpler: use a holder class.
private static class Holder { static final Singleton I = new Singleton(); }`)}

<h2>Check yourself</h2>
${Q("Why does adding <code>System.out.println</code> inside the infinite loop often 'fix' the visibility bug?","<code>println</code> synchronizes internally, which forces a re-read and inhibits the hoisting optimisation. It works by accident, not by contract. The correct fix is <code>volatile</code> or proper synchronization.")}
`});

T.push({
id:"th-locks", track:"threads", title:"synchronized, locks & atomics", since:"JDK 1.0 / 5", jep:null,
lede:"Mutual exclusion makes a group of steps look like one indivisible step to other threads. CAS does the same for a single variable without blocking.",
html:`
<h2>Start from the problem</h2>
<p>A transfer is "subtract from A, add to B". If another thread reads both balances between those two steps, it sees money vanish. We need the two steps to be <strong>atomic</strong>: other threads see either before or after, never the middle. And we need the result to be visible. A lock provides both.</p>

<h2>synchronized: the built-in monitor</h2>
<p>Every Java object has a hidden <strong>monitor</strong>. <code>synchronized(obj)</code> acquires it; only one thread can hold it at a time; others go to <code>BLOCKED</code>. Release on exit creates a happens-before edge to the next acquirer.</p>
${J(String.raw`class Account {
    private long balance;
    synchronized void deposit(long amt) { balance += amt; }   // lock = this
    synchronized long balance() { return balance; }           // reads need the lock too!
}

static synchronized void util() { }   // lock = Account.class

private final Object lock = new Object();   // private lock: outsiders cannot interfere
void transfer(Account to, long amt) {
    synchronized (lock) { ... }
}`)}
<p>Monitors are <strong>reentrant</strong>: a thread already holding a lock can enter another <code>synchronized</code> block on the same object without deadlocking itself.</p>

<h3>wait / notify (and why you rarely write them now)</h3>
${J(String.raw`synchronized (queue) {
    while (queue.isEmpty()) queue.wait();   // releases lock while waiting. ALWAYS loop: spurious wakeups
    item = queue.remove();
}
synchronized (queue) { queue.add(x); queue.notifyAll(); }
// In real code use BlockingQueue, which wraps exactly this pattern.`)}

<h3>ReentrantLock: when you need more control</h3>
${J(String.raw`private final ReentrantLock lock = new ReentrantLock();

if (lock.tryLock(200, TimeUnit.MILLISECONDS)) {   // give up instead of waiting forever
    try { ... } finally { lock.unlock(); }         // unlock in finally, always
} else {
    throw new BusyException();
}

// Read-heavy data: many readers OR one writer
private final ReadWriteLock rw = new ReentrantReadWriteLock();
rw.readLock().lock();  try { return map.get(k); } finally { rw.readLock().unlock(); }`)}

<h3>Atomics and compare-and-swap</h3>
<p>The CPU offers an instruction: "set this memory to <em>new</em> only if it currently equals <em>expected</em>, and tell me if it worked". Retrying it in a loop gives a lock-free update. No thread ever blocks; contended threads just retry.</p>
${J(String.raw`AtomicLong total = new AtomicLong();
total.addAndGet(5);
total.updateAndGet(x -> Math.max(x, candidate));   // CAS loop inside

// What updateAndGet does:
long prev, next;
do { prev = total.get(); next = Math.max(prev, candidate); }
while (!total.compareAndSet(prev, next));

// Heavy contention on one counter: LongAdder spreads it over cells
LongAdder hits = new LongAdder();  hits.increment();  hits.sum();`)}

<h2>Choosing</h2>
<div class="table-wrap"><table>
<thead><tr><th>Need</th><th>Use</th></tr></thead>
<tbody>
<tr><td>Data never changes after construction</td><td>Immutable object / record. No lock at all.</td></tr>
<tr><td>One variable, simple update</td><td><code>AtomicX</code>, <code>LongAdder</code></td></tr>
<tr><td>Shared map or queue</td><td><code>ConcurrentHashMap</code>, <code>BlockingQueue</code></td></tr>
<tr><td>Several fields must change together</td><td><code>synchronized</code></td></tr>
<tr><td>Timeouts, fairness, try-lock, virtual threads on JDK 21</td><td><code>ReentrantLock</code></td></tr>
</tbody></table></div>

<h2>Deadlock</h2>
<p>Thread 1 holds lock A and wants B. Thread 2 holds B and wants A. Both wait forever. Four conditions must all hold: mutual exclusion, hold-and-wait, no preemption, circular wait. Breaking any one prevents it. The practical fix is to break circular wait with a <strong>global lock order</strong>:</p>
${J(String.raw`void transfer(Account a, Account b, long amt) {
    Account first  = a.id() < b.id() ? a : b;    // always lock lower id first
    Account second = a.id() < b.id() ? b : a;
    synchronized (first) { synchronized (second) { a.withdraw(amt); b.deposit(amt); } }
}
// Diagnose: jstack <pid> prints "Found one Java-level deadlock" with both stacks.`)}

<h2>Check yourself</h2>
${Q("Is a <code>synchronized</code> setter with an unsynchronized getter thread-safe?","No. The getter has no happens-before edge with the setter's unlock, so a reader may see a stale value. Both sides of a shared variable need the same lock (or the field needs to be volatile for a simple read).")}
`});

T.push({
id:"th-executors", track:"threads", title:"Executors & thread pools", since:"JDK 5", jep:null,
lede:"Separate what to run (tasks) from how to run it (threads). A pool reuses expensive threads and puts a bound on concurrency.",
html:`
<h2>Start from the problem</h2>
<p>Creating a platform thread per task costs an OS call and a megabyte of stack. Under a burst of 10,000 tasks, you get 10,000 threads and an out-of-memory error. You want to reuse a fixed set of threads and queue the excess. That is a thread pool: <strong>N workers + a task queue</strong>.</p>

<h2>Build it up: ThreadPoolExecutor</h2>
<p>All the <code>Executors.newX()</code> factories are configurations of one class. Learn its rules once:</p>
${J(String.raw`new ThreadPoolExecutor(
    10,                               // corePoolSize
    50,                               // maximumPoolSize
    60, TimeUnit.SECONDS,             // idle time before extra threads die
    new ArrayBlockingQueue<>(500),    // work queue (bounded!)
    Thread.ofPlatform().name("rates-", 0).factory(),   // named threads (Java 21 builder)
    new ThreadPoolExecutor.CallerRunsPolicy());   // what to do when full`)}
<p>When a task is submitted:</p>
<ol>
<li>Fewer than <em>core</em> threads running? Start a new thread for it.</li>
<li>Otherwise, try to put it on the <strong>queue</strong>.</li>
<li>Queue full? Start a thread, up to <em>max</em>.</li>
<li>At max and queue full? Call the <strong>rejection policy</strong>.</li>
</ol>
<p>This surprises everyone: the pool grows beyond <em>core</em> only after the queue is full. With an unbounded queue, max is never reached.</p>

<div class="table-wrap"><table>
<thead><tr><th>Factory</th><th>Configuration</th><th>Risk</th></tr></thead>
<tbody>
<tr><td><code>newFixedThreadPool(n)</code></td><td>core = max = n, unbounded <code>LinkedBlockingQueue</code></td><td>Queue grows forever under overload → OOM</td></tr>
<tr><td><code>newCachedThreadPool()</code></td><td>core 0, max ∞, <code>SynchronousQueue</code></td><td>Unbounded threads under burst</td></tr>
<tr><td><code>newSingleThreadExecutor()</code></td><td>1 thread, unbounded queue</td><td>Ordered execution; same OOM risk</td></tr>
<tr><td><code>newScheduledThreadPool(n)</code></td><td>Delay queue</td><td>One slow task delays others</td></tr>
<tr><td><code>newVirtualThreadPerTaskExecutor()</code></td><td>New virtual thread per task (21)</td><td>No built-in limit; add a Semaphore</td></tr>
</tbody></table></div>

<h3>Rejection policies</h3>
<ul>
<li><code>AbortPolicy</code> (default): throw <code>RejectedExecutionException</code>.</li>
<li><code>CallerRunsPolicy</code>: the submitting thread runs the task itself. Natural back-pressure: producers slow down.</li>
<li><code>DiscardPolicy</code> / <code>DiscardOldestPolicy</code>: drop silently. Only for truly disposable work.</li>
</ul>

<h3>Sizing</h3>
<p>For CPU-bound work: about the number of cores. For I/O-bound work, Little's Law gives the intuition: threads ≈ cores × (1 + wait time / compute time). If a task waits 90 ms and computes 10 ms on 8 cores, roughly 8 × 10 = 80 threads keep the CPU busy. Then measure, because the downstream system (DB pool size, API rate limit) is often the real ceiling.</p>

<h3>Results, failures, shutdown</h3>
${J(String.raw`ExecutorService pool = Executors.newFixedThreadPool(8);
Future<Rate> f = pool.submit(() -> rateApi.fetch(id));
try {
    Rate r = f.get(2, TimeUnit.SECONDS);
} catch (ExecutionException e) {      // task threw: real cause in e.getCause()
} catch (TimeoutException e) {
    f.cancel(true);                    // interrupts the worker
}

List<Future<Rate>> all = pool.invokeAll(tasks);   // wait for all

pool.shutdown();                                  // no new tasks; finish queued
if (!pool.awaitTermination(30, TimeUnit.SECONDS)) pool.shutdownNow();  // interrupt
// Java 19+: ExecutorService is AutoCloseable -> try-with-resources`)}

<h2>Traps</h2>
<ul class="traps">
<li><code>execute()</code> lets exceptions kill the worker and print to stderr. <code>submit()</code> stores them in the Future; if nobody calls <code>get()</code>, they vanish.</li>
<li>Tasks in a pool that wait on other tasks in the same bounded pool can deadlock (thread starvation).</li>
<li>Always name threads (custom <code>ThreadFactory</code>). "pool-7-thread-3" in a thread dump tells you nothing.</li>
<li>ThreadLocals leak between tasks on pooled threads. Clear them in <code>finally</code>.</li>
</ul>
`});

T.push({
id:"th-collections", track:"threads", title:"Concurrent collections & coordination", since:"JDK 5", jep:null,
lede:"Thread-safe building blocks so you rarely write locks yourself: maps, queues, latches, barriers, semaphores.",
html:`
<h2>Start from the problem</h2>
<p><code>Collections.synchronizedMap(map)</code> puts one lock around every method. That is thread-safe for single calls, but it serialises all access, and compound actions are still broken:</p>
${J(String.raw`if (!map.containsKey(k)) map.put(k, v);   // two calls: another thread can put in between`)}
<p>Concurrent collections fix both: finer-grained locking (or none) for throughput, plus <em>atomic compound operations</em> as methods.</p>

<h2>ConcurrentHashMap</h2>
<p>Reads never block. Writes lock only a single bin (the bucket for that key), using CAS for empty bins. So writes to different keys rarely contend.</p>
${J(String.raw`ConcurrentHashMap<String, LongAdder> counts = new ConcurrentHashMap<>();
counts.computeIfAbsent(product, k -> new LongAdder()).increment();   // atomic

cache.computeIfAbsent(key, k -> expensiveLoad(k));    // load at most once per key
map.merge(product, amount, BigDecimal::add);          // atomic read-modify-write
map.putIfAbsent(k, v);

// Trap: the function in compute*/merge runs while the bin is locked.
// Keep it short, never call back into the same map.`)}
<p>Size and iteration are <em>weakly consistent</em>: they do not throw <code>ConcurrentModificationException</code>, but may or may not reflect concurrent updates.</p>

<h2>Other collections</h2>
<div class="table-wrap"><table>
<thead><tr><th>Class</th><th>Use when</th></tr></thead>
<tbody>
<tr><td><code>CopyOnWriteArrayList</code></td><td>Many reads, rare writes (listener lists). Every write copies the array.</td></tr>
<tr><td><code>ArrayBlockingQueue</code> / <code>LinkedBlockingQueue</code></td><td>Producer–consumer. <code>put</code> blocks when full, <code>take</code> when empty.</td></tr>
<tr><td><code>ConcurrentLinkedQueue</code></td><td>Lock-free, non-blocking queue.</td></tr>
<tr><td><code>ConcurrentSkipListMap</code></td><td>Sorted concurrent map.</td></tr>
</tbody></table></div>

<h2>Coordination tools</h2>
${J(String.raw`// CountDownLatch: wait until N things have happened (one-shot)
CountDownLatch ready = new CountDownLatch(3);
for (int i = 0; i < 3; i++) pool.submit(() -> { warmUp(); ready.countDown(); });
ready.await(10, TimeUnit.SECONDS);

// Semaphore: at most N at a time
Semaphore permits = new Semaphore(5);
permits.acquire(); try { callPartner(); } finally { permits.release(); }

// CyclicBarrier: N threads wait for each other, then all continue (reusable)
CyclicBarrier barrier = new CyclicBarrier(4, () -> mergePartialResults());

// Producer / consumer
BlockingQueue<Event> q = new ArrayBlockingQueue<>(1000);
q.put(event);                     // producer: blocks if full -> back-pressure
Event e = q.take();               // consumer: blocks if empty`)}
`});
/* ===================== JVM ===================== */
T.push({
id:"jvm-pipeline", track:"jvm", title:"From .java to running code", since:"all", jep:null,
lede:"Follow one class from source file to machine instructions. Every other JVM topic is a zoom into one step of this path.",
html:`
<h2>Start from the problem</h2>
<p>Java promised "write once, run anywhere". A compiler that outputs x86 instructions cannot keep that promise; the code would only run on x86. So Java compiles to an intermediate instruction set, <strong>bytecode</strong>, for an imaginary machine. Each platform ships a program that runs that imaginary machine: the <strong>Java Virtual Machine</strong>.</p>
<p>Interpreting bytecode is slow, though. So modern JVMs watch what runs often and compile it to native code while the program runs. That gives portability and speed, at the cost of warm-up time.</p>

<div class="fig">
<svg viewBox="0 0 640 150" role="img" aria-label="Pipeline: source file, javac, class file, class loader, interpreter, JIT, native code">
<rect x="10" y="50" width="90" height="44" class="f-box"/><text x="55" y="77" class="f-t">Rate.java</text>
<rect x="130" y="50" width="90" height="44" class="f-box"/><text x="175" y="77" class="f-t">Rate.class</text>
<rect x="250" y="50" width="110" height="44" class="f-in"/><text x="305" y="77" class="f-t">Class loader</text>
<rect x="390" y="12" width="110" height="44" class="f-in"/><text x="445" y="39" class="f-t">Interpreter</text>
<rect x="390" y="90" width="110" height="44" class="f-acc"/><text x="445" y="117" class="f-t">JIT (C1, C2)</text>
<rect x="530" y="50" width="100" height="44" class="f-box"/><text x="580" y="77" class="f-t">CPU</text>
<path d="M100 72 L130 72" class="f-arrow"/><text x="115" y="44" class="f-s">javac</text>
<path d="M220 72 L250 72" class="f-arrow"/>
<path d="M360 66 L390 40" class="f-arrow"/>
<path d="M445 56 L445 90" class="f-arrow"/><text x="478" y="76" class="f-s">hot</text>
<path d="M500 34 L530 62" class="f-arrow"/><path d="M500 112 L530 84" class="f-arrow"/>
</svg>
<p class="cap">Everything starts interpreted. Methods that run often get compiled to native code in the background.</p>
</div>

<h2>Build it up: look at real bytecode</h2>
${J(String.raw`public class Calc {
    int add(int a, int b) { return a + b; }
}

// javac Calc.java && javap -c Calc
int add(int, int);
  Code:
     0: iload_1      // push local variable 1 (a) onto the operand stack
     1: iload_2      // push b
     2: iadd         // pop two ints, push their sum
     3: ireturn      // return the int on top of the stack`)}
<p>The JVM is a <strong>stack machine</strong>: instructions push and pop values on a per-method operand stack rather than naming registers. That keeps bytecode independent of how many registers a real CPU has.</p>

<h3>Class loading</h3>
<p>A class is loaded the first time it is actively used, not at startup. Three phases:</p>
<ol>
<li><strong>Loading</strong>: find the bytes (JAR, directory, network) and create a <code>Class</code> object.</li>
<li><strong>Linking</strong>: <em>verify</em> the bytecode is safe (no stack underflow, type-correct), <em>prepare</em> static fields with default values, <em>resolve</em> symbolic references.</li>
<li><strong>Initialization</strong>: run static initializers (<code>static { }</code> and static field assignments). The JVM guarantees this happens once, thread-safely. That is why the holder-class singleton works.</li>
</ol>
<p>Loaders form a hierarchy: <strong>Bootstrap</strong> (core <code>java.*</code>), <strong>Platform</strong> (other JDK modules), <strong>Application</strong> (your classpath). Each asks its parent first (<em>parent delegation</em>), so nobody can replace <code>java.lang.String</code> with their own.</p>
<p>A class's identity is its name <em>plus</em> its class loader. The same class loaded by two loaders is two different types. That explains the infamous <code>ClassCastException: com.x.Foo cannot be cast to com.x.Foo</code> in app servers and with Spring DevTools' restart loader.</p>

<h2>Check yourself</h2>
${Q("Why does the first request to a freshly started Spring Boot app take much longer than the hundredth?","Classes are loaded lazily on first use, and all code starts interpreted. Early requests pay for class loading, Spring's lazy initialisation and interpretation; later ones run JIT-compiled code. This is JVM warm-up. CDS archives, AOT and CRaC exist to reduce it.")}
`});

T.push({
id:"jvm-memory", track:"jvm", title:"Runtime memory areas", since:"all (Metaspace: 8)", jep:"JEP 122",
lede:"Where every byte of a running Java program lives, and which area each OutOfMemoryError message is pointing at.",
html:`
<h2>Start from the problem</h2>
<p>Data has different lifetimes. A local variable lives as long as one method call. An object lives as long as something references it. Class metadata lives as long as its class loader. Putting all of these in one place would make each harder to manage, so the JVM separates them.</p>

<div class="fig">
<svg viewBox="0 0 600 250" role="img" aria-label="JVM memory: per-thread stacks and PC registers; shared heap with young and old generations; metaspace and code cache outside the heap">
<text x="20" y="20" class="f-s" text-anchor="start">Per thread</text>
<rect x="20" y="30" width="120" height="90" class="f-box"/><text x="80" y="55" class="f-t">JVM stack</text><text x="80" y="75" class="f-s">frames: locals,</text><text x="80" y="91" class="f-s">operand stack</text>
<rect x="20" y="130" width="120" height="34" class="f-box"/><text x="80" y="152" class="f-s">PC register</text>
<text x="170" y="20" class="f-s" text-anchor="start">Shared: heap (-Xmx)</text>
<rect x="170" y="30" width="250" height="134" class="f-acc"/>
<rect x="182" y="44" width="100" height="108" class="f-in"/><text x="232" y="68" class="f-t">Young</text><text x="232" y="90" class="f-s">Eden</text><text x="232" y="110" class="f-s">Survivor S0/S1</text>
<rect x="292" y="44" width="116" height="108" class="f-in"/><text x="350" y="68" class="f-t">Old</text><text x="350" y="90" class="f-s">long-lived</text><text x="350" y="110" class="f-s">objects</text>
<text x="450" y="20" class="f-s" text-anchor="start">Native (off-heap)</text>
<rect x="450" y="30" width="135" height="40" class="f-box"/><text x="517" y="55" class="f-s">Metaspace</text>
<rect x="450" y="78" width="135" height="40" class="f-box"/><text x="517" y="103" class="f-s">Code cache (JIT)</text>
<rect x="450" y="126" width="135" height="38" class="f-box"/><text x="517" y="150" class="f-s">Direct buffers, threads</text>
<text x="300" y="200" class="f-s">Container memory limit must cover ALL of this, not just -Xmx</text>
<path d="M60 190 L540 190" class="f-rule"/>
</svg>
</div>

<h2>Build it up</h2>
${J(String.raw`void handle(Request req) {          // new frame pushed on this thread's stack
    int retries = 3;                  // primitive local: lives in the frame
    Loan loan = new Loan(req);        // 'loan' reference in the frame;
                                      //  the Loan object itself on the heap
    process(loan);                    // another frame on top
}                                     // frame popped; Loan now unreachable -> garbage`)}

<div class="table-wrap"><table>
<thead><tr><th>Area</th><th>Holds</th><th>Error when full</th><th>Flag</th></tr></thead>
<tbody>
<tr><td>Stack</td><td>Frames per method call</td><td><code>StackOverflowError</code> (deep recursion)</td><td><code>-Xss</code></td></tr>
<tr><td>Heap</td><td>All objects and arrays</td><td><code>OOM: Java heap space</code></td><td><code>-Xms</code>, <code>-Xmx</code>, <code>-XX:MaxRAMPercentage</code></td></tr>
<tr><td>Metaspace</td><td>Class metadata, method bytecode</td><td><code>OOM: Metaspace</code> (class loader leak, too many proxies)</td><td><code>-XX:MaxMetaspaceSize</code></td></tr>
<tr><td>Code cache</td><td>JIT-compiled native code</td><td>Warning; JIT stops compiling</td><td><code>-XX:ReservedCodeCacheSize</code></td></tr>
<tr><td>Direct memory</td><td><code>ByteBuffer.allocateDirect</code>, Netty</td><td><code>OOM: Direct buffer memory</code></td><td><code>-XX:MaxDirectMemorySize</code></td></tr>
</tbody></table></div>
<p>Java 8 replaced PermGen with Metaspace, which lives in native memory and grows by default. So "PermGen space" errors are gone, but an unbounded Metaspace can now eat container memory.</p>

<h3>Containers</h3>
${J(String.raw`# Size the heap relative to the container limit, not a hard-coded -Xmx
JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
# 75% leaves room for metaspace, thread stacks, code cache and direct buffers.
# If the pod is OOMKilled but you see no Java OOM, the non-heap areas are the cause.`)}

<h3>Escape analysis</h3>
<p>"Objects live on the heap" is the semantic model. The JIT may do better: if it proves an object never escapes the method, it can replace it with plain locals (<em>scalar replacement</em>). Short-lived small objects are therefore often free.</p>
`});

T.push({
id:"jvm-gc", track:"jvm", title:"Garbage collection", since:"all (G1 default: 9, ZGC gen: 21)", jep:"JEP 248, 439",
lede:"The collector finds objects nothing can reach and reuses their memory. The design question is how to do that without stopping your program for long.",
html:`
<h2>Start from the problem</h2>
<p>Manual <code>free()</code> causes two classes of bug: freeing too early (use-after-free) and never freeing (leaks). Java removes <code>free</code>. Something else must decide when an object is dead.</p>
<p>The first-principles definition: an object is alive if your program can still reach it. Start from <strong>GC roots</strong> (local variables on every thread's stack, static fields, JNI references), follow every reference, and mark what you reach. Everything unmarked is garbage. Cycles are not a problem: two objects pointing at each other but unreachable from a root are both garbage.</p>

<h2>Build it up: why generations</h2>
<p>Measuring real programs shows the <strong>weak generational hypothesis</strong>: most objects die young (a DTO built for one request), and the few that survive tend to live a long time (caches, Spring beans). So:</p>
<ul>
<li>Allocate new objects in a small <strong>young generation</strong> (Eden). Allocation is just bumping a pointer: very fast.</li>
<li>Collect young often. Because almost everything there is dead, the collector only has to <em>copy the few survivors</em> out. Cost is proportional to live objects, not garbage.</li>
<li>Objects surviving several young collections get <strong>promoted</strong> to the old generation, collected rarely.</li>
</ul>

<h3>Stop-the-world and the collectors</h3>
<p>Moving an object means updating every reference to it. If application threads ran simultaneously, they could see half-moved state. The simple fix is to pause all application threads at a <strong>safepoint</strong>: a stop-the-world (STW) pause. Modern collectors differ in how much work they do while your threads keep running.</p>
<div class="table-wrap"><table>
<thead><tr><th>Collector</th><th>Approach</th><th>Choose for</th></tr></thead>
<tbody>
<tr><td>Serial</td><td>Single thread, STW</td><td>Tiny heaps, small containers (default if &lt; 2 CPUs or &lt; 1792 MB)</td></tr>
<tr><td>Parallel</td><td>Many threads, STW</td><td>Batch jobs: maximum throughput, pauses acceptable</td></tr>
<tr><td><strong>G1</strong> (default since 9)</td><td>Heap split into regions; collects regions with most garbage first; aims at a pause target (<code>-XX:MaxGCPauseMillis=200</code>)</td><td>Most services. Good balance.</td></tr>
<tr><td><strong>ZGC</strong></td><td>Almost all work concurrent; pauses under 1 ms regardless of heap size. Generational since 21 (default mode since 23).</td><td>Latency-sensitive APIs, large heaps</td></tr>
<tr><td>Shenandoah</td><td>Concurrent compaction, similar goals to ZGC</td><td>Low latency, in some OpenJDK builds</td></tr>
</tbody></table></div>
${J(String.raw`-XX:+UseG1GC                         # default anyway
-XX:+UseZGC -XX:+ZGenerational       # Java 21 (flag not needed from 23)
-Xlog:gc*:file=gc.log:time,uptime    # unified GC logging (Java 9+)`)}

<h2>Memory leaks still exist</h2>
<p>GC frees unreachable objects. A leak in Java is an object that is still reachable but no longer useful.</p>
${J(String.raw`// Classic leaks
static final Map<String, Session> SESSIONS = new HashMap<>();   // only ever put()
threadLocal.set(bigObject);   // pooled thread lives forever, never remove()d
listeners.add(this);          // never unregistered
// A key class with mutable fields used in hashCode() -> unremovable entries

// Find them:
jcmd <pid> GC.heap_dump /tmp/heap.hprof    // open in Eclipse MAT, look at "dominator tree"`)}

<h3>Reference types</h3>
<p><code>WeakReference</code> lets GC collect the object as soon as it is not strongly reachable (used by <code>WeakHashMap</code>). <code>SoftReference</code> keeps it until memory is low (crude caches). Prefer a real cache like Caffeine with size limits.</p>

<h2>Check yourself</h2>
${Q("Heap usage grows steadily, then a full GC drops it back to the same baseline. Leak or not?","Not a leak. That sawtooth is normal: garbage accumulates until a collection. A leak shows as the baseline after each full GC creeping upward over time.")}
`});

T.push({
id:"jvm-jit", track:"jvm", title:"JIT compilation", since:"all (tiered: 8 default)", jep:null,
lede:"The JIT compiles code using facts it can only know at runtime: which branches run, which types actually appear, which calls are hot.",
html:`
<h2>Start from the problem</h2>
<p>An ahead-of-time compiler sees <code>shape.area()</code> and must emit a virtual call, because any subclass could appear. But at runtime, maybe 100% of calls are on <code>Circle</code>. A compiler running <em>inside</em> the program can observe that and emit a direct, inlined call, with a cheap guard in case the assumption ever breaks.</p>

<h2>Build it up: tiered compilation</h2>
<ol>
<li><strong>Interpreter</strong> runs the method and counts invocations and loop iterations.</li>
<li>Past a threshold, <strong>C1</strong> (client compiler) compiles quickly with light optimisation and adds profiling.</li>
<li>Very hot methods go to <strong>C2</strong> (server compiler), which uses the profile for aggressive optimisation.</li>
</ol>
<p>Key optimisations:</p>
<ul>
<li><strong>Inlining</strong>: copy small callees into the caller. This is the most important one, because it exposes everything else (getters vanish entirely).</li>
<li><strong>Devirtualisation</strong>: a call site that only ever saw one type becomes a direct call.</li>
<li><strong>Escape analysis</strong>: objects that never leave the method are not allocated at all.</li>
<li><strong>Loop optimisations</strong>: unrolling, hoisting invariants, removing bounds checks.</li>
</ul>

<h3>Deoptimisation</h3>
<p>Optimisations based on assumptions carry a guard. If a second subclass suddenly appears, the guard fails, the JVM throws away the compiled code and falls back to the interpreter, then re-profiles. This is why performance can dip briefly after a new code path is first used.</p>
${J(String.raw`-XX:+PrintCompilation          # watch methods getting compiled
jcmd <pid> Compiler.codecache  # code cache usage`)}

<h3>Micro-benchmarks lie unless you use JMH</h3>
${J(String.raw`// Wrong: measures the interpreter, then C1, then C2, and the JIT may delete it as dead code
long t = System.nanoTime(); for (...) compute(); System.out.println(System.nanoTime() - t);

// Right: JMH handles warm-up, forks, and dead-code elimination
@Benchmark @Warmup(iterations = 5) @Fork(2)
public BigDecimal interest(Blackhole bh) { return calc.monthly(principal, rate); }`)}

<h3>Reducing warm-up</h3>
<p>Class Data Sharing (CDS) archives pre-parsed classes. Spring Boot 3.3+ can produce one (<code>-XX:SharedArchiveFile</code>). GraalVM native image compiles everything ahead of time for instant start but loses runtime profiling. Java 24–25 added AOT cache work (Project Leyden) to store loaded and linked classes and profiles from a training run.</p>
`});

T.push({
id:"jvm-diagnose", track:"jvm", title:"Diagnosing a live JVM", since:"JDK 7–11", jep:"JEP 328 (JFR)",
lede:"A practical toolkit: which command answers which production question.",
html:`
<h2>Start from the problem</h2>
<p>In production you cannot attach a debugger. You need to ask a running JVM questions without restarting or slowing it: what are threads doing, what is filling the heap, where is time spent. The JDK ships tools for each.</p>

<div class="table-wrap"><table>
<thead><tr><th>Symptom</th><th>Question</th><th>Tool</th></tr></thead>
<tbody>
<tr><td>Requests hang, CPU low</td><td>What is every thread waiting on?</td><td>Thread dump</td></tr>
<tr><td>CPU at 100%</td><td>Which thread, which method?</td><td><code>top -H</code> + thread dump, or JFR / async-profiler</td></tr>
<tr><td>Memory grows, OOM</td><td>What retains the objects?</td><td>Heap dump + Eclipse MAT</td></tr>
<tr><td>Latency spikes</td><td>Is it GC?</td><td>GC log, JFR</td></tr>
<tr><td>Something odd, unknown</td><td>Everything, cheaply</td><td>JDK Flight Recorder</td></tr>
</tbody></table></div>

${J(String.raw`jcmd                                   # list JVMs and their pids
jcmd <pid> VM.flags                    # effective JVM flags
jcmd <pid> VM.system_properties
jcmd <pid> Thread.print > threads.txt  # thread dump (same as jstack)
jcmd <pid> GC.heap_info
jcmd <pid> GC.class_histogram | head   # object counts by class, no full dump
jcmd <pid> GC.heap_dump /tmp/h.hprof   # full heap dump (pauses the app!)

# JFR: always-on-capable profiler, ~1% overhead
jcmd <pid> JFR.start duration=60s filename=/tmp/rec.jfr settings=profile
# open rec.jfr in JDK Mission Control

# On startup
-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps
