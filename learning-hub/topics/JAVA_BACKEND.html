<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Java Backend Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: fixed topic index on the left, one reading column on the right; drawer on phones. */
:root{
  --paper:#E9EEEC; --sheet:#F7F9F8; --ink:#17201E; --muted:#56635F; --rule:#CCD5D2;
  --accent:#0C6A61; --accent-soft:#D3E8E3; --warn:#8C5200; --warn-soft:#F4E6CF;
  --code-bg:#16201E; --code-fg:#DCE6E2; --code-dim:#7F948E;
  --c-kw:#7FD3C6; --c-str:#E8C27A; --c-com:#7F948E; --c-ann:#C9A6F2; --c-num:#F29B85; --c-type:#A9CCF5;
  --f-ui:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --step-0:1.0625rem; --step-1:1.25rem; --step-2:1.6rem; --step-3:2.35rem;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1513; --sheet:#141C1A; --ink:#E3EBE8; --muted:#94A6A1; --rule:#2A3633;
  --accent:#5CC4B6; --accent-soft:#183A35; --warn:#E3A84E; --warn-soft:#33270F;
  --code-bg:#0A0F0E; --code-fg:#DCE6E2; --code-dim:#6F837E; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F1513; --sheet:#141C1A; --ink:#E3EBE8; --muted:#94A6A1; --rule:#2A3633;
  --accent:#5CC4B6; --accent-soft:#183A35; --warn:#E3A84E; --warn-soft:#33270F;
  --code-bg:#0A0F0E; --code-fg:#DCE6E2; --code-dim:#6F837E; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper); color:var(--ink); font-family:var(--f-ui); font-size:15px; line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.app{display:grid; grid-template-columns:300px minmax(0,1fr); min-height:100%}

/* ---------- index ---------- */
.index{position:sticky; top:env(safe-area-inset-top,0px); height:100vh; height:100dvh; overflow-y:auto;
  border-right:1px solid var(--rule); padding:22px 18px 40px; display:flex; flex-direction:column; gap:18px; background:var(--paper)}
.brand{display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink)}
.brand b{font-size:1.05rem; font-weight:700; letter-spacing:-.01em}
.brand span{color:var(--muted); font-size:.82rem}
.search{position:relative}
.search input{width:100%; font:inherit; font-size:.9rem; padding:8px 10px 8px 32px; border:1px solid var(--rule); border-radius:6px; background:var(--sheet); color:var(--ink)}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--muted); fill:none}
.overall{font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:6px}
.bar{height:4px; background:var(--rule); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
.tracks{display:flex; flex-direction:column; gap:14px}
.track h3{margin:0 0 4px; font-size:.78rem; font-weight:600; color:var(--muted); display:flex; justify-content:space-between; gap:8px; letter-spacing:.02em}
.track h3 em{font-style:normal; font-variant-numeric:tabular-nums; font-weight:500}
.track ul{list-style:none; margin:0; padding:0}
.track a{display:flex; align-items:baseline; gap:8px; padding:5px 8px; border-radius:5px; text-decoration:none; color:var(--ink); font-size:.9rem; line-height:1.3}
.track a:hover{background:var(--sheet)}
.track a[aria-current="page"]{background:var(--accent-soft); color:var(--ink); font-weight:600}
.track a .dot{flex:none; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--muted); transform:translateY(-1px)}
.track a.done .dot{background:var(--accent); border-color:var(--accent)}
.empty-search{font-size:.85rem; color:var(--muted)}

/* ---------- reading column ---------- */
main{min-width:0; padding-inline:clamp(16px,4vw,56px); padding-block:28px 80px}
.sheet{max-width:46rem; margin-inline:auto}
.topbar{display:none}
.crumb{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.82rem; color:var(--muted)}
.tag{font-family:var(--f-code); font-size:.74rem; padding:2px 7px; border:1px solid var(--rule); border-radius:4px; color:var(--muted); background:var(--sheet)}
.tag.jep{border-color:var(--accent); color:var(--accent)}
h1{font-size:var(--step-3); line-height:1.1; letter-spacing:-.025em; margin:10px 0 14px; text-wrap:balance; font-weight:700}
.lede{font-family:var(--f-read); font-size:1.3rem; line-height:1.45; color:var(--ink); margin:0 0 28px; padding-left:18px; border-left:3px solid var(--accent); font-style:italic; max-width:40rem}
.prose{font-family:var(--f-read); font-size:var(--step-0); line-height:1.68}
.prose p, .prose li{max-width:40rem}
.prose h2{font-family:var(--f-ui); font-size:var(--step-2); letter-spacing:-.015em; margin:2.4em 0 .6em; text-wrap:balance; line-height:1.2}
.prose h2:first-child{margin-top:0}
.prose h3{font-family:var(--f-ui); font-size:var(--step-1); margin:1.9em 0 .5em; line-height:1.25}
.prose h4{font-family:var(--f-ui); font-size:1.05rem; margin:1.6em 0 .4em; line-height:1.3}
.prose strong{font-weight:600}
.prose code{font-family:var(--f-code); font-size:.84em; background:var(--accent-soft); padding:1px 5px; border-radius:3px; overflow-wrap:anywhere}
.prose ol,.prose ul{padding-left:1.4em}
.prose li{margin:.35em 0}
.table-wrap{overflow-x:auto; margin:1.4em 0; border:1px solid var(--rule); border-radius:6px; background:var(--sheet)}
table{border-collapse:collapse; width:100%; font-family:var(--f-ui); font-size:.88rem; line-height:1.45}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
th{font-weight:600; color:var(--muted); font-size:.8rem; background:var(--paper)}
tr:last-child td{border-bottom:0}
td code{background:transparent; padding:0; white-space:nowrap}

/* code */
figure.code{margin:1.5em 0; background:var(--code-bg); color:var(--code-fg); border-radius:8px; overflow:hidden; font-family:var(--f-ui)}
figure.code .head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 10px 7px 14px; border-bottom:1px solid rgba(127,148,142,.25)}
figure.code figcaption{font-size:.8rem; color:var(--code-dim); min-width:0}
figure.code .copy{flex:none; font:inherit; font-size:.75rem; color:var(--code-fg); background:transparent; border:1px solid rgba(127,148,142,.4); border-radius:4px; padding:3px 9px; cursor:pointer}
figure.code .copy:hover{border-color:var(--c-kw)}
figure.code pre{margin:0; padding:14px 16px 16px; overflow-x:auto; font-family:var(--f-code); font-size:.82rem; line-height:1.6; tab-size:4}
figure.code pre code{background:none; padding:0; font-size:inherit; overflow-wrap:normal}
.k{color:var(--c-kw)} .s{color:var(--c-str)} .c{color:var(--c-com); font-style:italic} .a{color:var(--c-ann)} .n{color:var(--c-num)} .t{color:var(--c-type)}

/* traps & questions */
ul.traps{list-style:none; padding:0; display:flex; flex-direction:column; gap:10px}
ul.traps li{background:var(--warn-soft); padding:11px 14px 11px 40px; border-radius:6px; position:relative; margin:0; max-width:none; font-size:.98rem}
ul.traps li::before{content:"!"; position:absolute; left:13px; top:11px; width:17px; height:17px; border-radius:50%; background:var(--warn); color:var(--sheet); font:700 .72rem/17px var(--f-ui); text-align:center}
details.q{border:1px solid var(--rule); border-radius:6px; background:var(--sheet); margin:10px 0}
details.q summary{cursor:pointer; padding:12px 14px 12px 38px; position:relative; font-family:var(--f-ui); font-weight:500; font-size:.95rem; line-height:1.45; list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"?"; position:absolute; left:12px; top:12px; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--accent); color:var(--accent); font:600 .72rem/15px var(--f-ui); text-align:center}
details.q[open] summary{border-bottom:1px solid var(--rule)}
details.q .ans{padding:12px 14px 14px 38px; font-size:.98rem}

/* figures */
.fig{margin:1.6em 0; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:14px; overflow-x:auto}
.fig svg{display:block; width:100%; min-width:520px; height:auto}
.fig .cap{font-family:var(--f-ui); font-size:.82rem; color:var(--muted); margin:8px 0 0}
.fig text{font-family:var(--f-ui); fill:var(--ink); text-anchor:middle}
.fig text[text-anchor="start"]{text-anchor:start}
.f-t{font-size:12.5px; font-weight:600}
.f-s{font-size:11px; fill:var(--muted)!important}
.f-box{fill:var(--paper); stroke:var(--rule); stroke-width:1.2; rx:6}
.f-in{fill:var(--sheet); stroke:var(--rule); stroke-width:1; rx:4}
.f-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; rx:6}
.f-arrow{stroke:var(--muted); stroke-width:1.4; fill:none; marker-end:url(#arr)}
.f-rule{stroke:var(--rule); stroke-dasharray:3 4}
#arr path{fill:var(--muted)}

/* lesson footer */
.done-row{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:44px 0 18px; padding:16px 0; border-top:1px solid var(--rule)}
.btn{font:inherit; font-size:.9rem; font-weight:600; padding:9px 16px; border-radius:6px; border:1.5px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--sheet)}
.done-row small{color:var(--muted)}
.pager{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pager a{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border:1px solid var(--rule); border-radius:6px; text-decoration:none; color:var(--ink); background:var(--sheet); min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager a span{font-size:.78rem; color:var(--muted)}
.pager a b{font-weight:600; font-size:.95rem}
.pager a.next{text-align:right; grid-column:2}

/* start page */
.release{margin:28px 0 36px; overflow-x:auto}
.release svg{display:block; min-width:600px; width:100%; height:auto}
.release text{font-family:var(--f-ui); fill:var(--ink); text-anchor:middle}
.release .yr{font-size:11px; fill:var(--muted)}
.release .ver{font-size:15px; font-weight:700}
.release .lts{fill:var(--accent)}
.release .nonlts{fill:var(--rule)}
.release line{stroke:var(--rule); stroke-width:2}
.release a:hover .ver{fill:var(--accent)}
.release .hl{font-size:11px; fill:var(--muted)}
.trackgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin:18px 0 0}
.trackcard{border:1px solid var(--rule); border-radius:8px; padding:16px; background:var(--sheet); display:flex; flex-direction:column; gap:8px; min-width:0}
.trackcard h3{margin:0; font-size:1.05rem}
.trackcard p{margin:0; font-size:.88rem; color:var(--muted); font-family:var(--f-ui); line-height:1.45}
.trackcard ol{margin:4px 0 0; padding-left:1.2em; font-family:var(--f-ui); font-size:.88rem}
.trackcard ol a{color:var(--ink); text-decoration:none}
.trackcard ol a:hover{color:var(--accent); text-decoration:underline}
.anatomy{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-family:var(--f-ui); font-size:.92rem; margin:14px 0}
.anatomy b{font-weight:600}


/* predicate lab + tree figure */
.f-line{stroke:var(--muted); stroke-width:1.3; fill:none}
.f-false{fill:var(--warn-soft); stroke:var(--warn); stroke-width:1.2; rx:6}
.f-skip{fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:4 3; rx:6}
.lab{margin:1.4em 0; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); padding:16px; font-family:var(--f-ui); display:flex; flex-direction:column; gap:12px; min-width:0}
.lab figure.code{margin:0}
.lab-controls{display:flex; flex-direction:column; gap:10px}
.lab-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.lab-term{display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--paper)}
.lab select{font:inherit; font-size:.88rem; padding:5px 8px; border-radius:5px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink)}
.lab-not{display:inline-flex; align-items:center; gap:5px; font-size:.86rem; color:var(--muted); cursor:pointer}
.lab-sel{display:inline-flex; align-items:center; gap:8px; font-size:.86rem; color:var(--muted)}
.lab-summary{margin:0; font-size:.92rem; line-height:1.5}
.lab-summary code{font-family:var(--f-code); font-size:.84em; background:var(--accent-soft); padding:1px 5px; border-radius:3px}
.lab .table-wrap{margin:0}
.lab-table td{white-space:nowrap}
.lab-table td.num{font-variant-numeric:tabular-nums; text-align:right}
.lab-table tr.lab-off td{color:var(--muted); opacity:.6}
.chips{display:flex; gap:4px; flex-wrap:nowrap}
.chip{display:inline-block; font-family:var(--f-code); font-size:.74rem; padding:1px 6px; border-radius:4px; border:1px solid transparent; white-space:nowrap}
.chip.yes{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.chip.no{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}
.chip.skip{color:var(--muted); border:1px dashed var(--muted); text-decoration:line-through}
.muted{color:var(--muted)}



/* words to know */
.terms{background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:14px 18px 6px; margin:0 0 2.2em; font-family:var(--f-ui); max-width:40rem}
.terms h3{margin:0 0 10px!important; font-size:.95rem!important; color:var(--accent)}
.terms dl{margin:0; display:flex; flex-direction:column}
.terms .term{display:grid; grid-template-columns:minmax(7.5rem, 30%) minmax(0,1fr); gap:4px 14px; padding:8px 0; border-top:1px solid var(--rule)}
.terms dt{font-weight:600; font-size:.92rem; overflow-wrap:anywhere}
.terms dd{margin:0; font-size:.92rem; line-height:1.5; color:var(--ink)}
.terms code{font-size:.82em}
@media (max-width: 520px){ .terms .term{grid-template-columns:minmax(0,1fr)} }

/* stream simulation */
.sim{margin:1.4em 0; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); padding:16px; font-family:var(--f-ui); display:flex; flex-direction:column; gap:14px; min-width:0; max-width:none}
.sim li{margin:0; max-width:none}
.sim p{max-width:none}
.sim-modes{display:flex; flex-wrap:wrap; gap:6px}
.sim-modes button{font:inherit; font-size:.86rem; padding:7px 12px; border-radius:6px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); cursor:pointer; min-height:36px}
.sim-modes button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--sheet); font-weight:600}
.sim-cfg{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:.86rem}
.sim-cfg label{display:inline-flex; align-items:center; gap:6px; cursor:pointer}
.sim-cfg select,.sim-speed select{font:inherit; font-size:.86rem; padding:5px 8px; border-radius:5px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink)}
.sim-flow{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:stretch}
.sim-srcrow{position:relative}
.sim-box{position:relative; flex:1 1 104px; min-width:0; border:1px solid var(--rule); border-radius:8px; background:var(--paper); padding:10px; display:flex; flex-direction:column; gap:6px}
.sim-box + .sim-box::before{content:"→"; position:absolute; left:-19px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px}
.sim-srcrow .sim-box{flex:none}
.sim-srcrow + .sim-flow{position:relative; padding-top:18px}
.sim-srcrow + .sim-flow::before{content:"↓"; position:absolute; top:-3px; left:28px; color:var(--muted); font-size:15px}
.sim-box.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.sim-box h4{margin:0; font-size:.86rem; font-weight:600; display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap}
.sim-box h4 span{font-weight:400; color:var(--muted); font-variant-numeric:tabular-nums; font-size:.78rem}
.sim-box .op{font-family:var(--f-code); font-size:.74rem; color:var(--muted); overflow-wrap:anywhere}
.sim-val{font-family:var(--f-code); font-size:.8rem; min-height:1.6em; display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; overflow-wrap:anywhere}
.sim-tag{font-family:var(--f-ui); font-size:.7rem; font-weight:600; padding:1px 6px; border-radius:4px; border:1px solid var(--rule); color:var(--muted); white-space:nowrap}
.sim-tag.v-pass,.sim-tag.v-read,.sim-tag.v-emit{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.sim-tag.v-drop,.sim-tag.v-stop{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.sim-chips{display:flex; flex-wrap:wrap; gap:4px}
.sim-chip{font-family:var(--f-code); font-size:.78rem; min-width:2.3em; text-align:center; padding:2px 6px; border-radius:4px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink); font-variant-numeric:tabular-nums}
.sim-chip.cur{border-color:var(--accent); background:var(--accent); color:var(--sheet); font-weight:600}
.sim-chip.read{color:var(--muted); background:transparent}
.sim-chip.never{border-style:dashed; border-color:var(--warn); color:var(--warn); text-decoration:line-through; background:transparent}
.sim-chip.out{border-color:var(--accent); color:var(--accent)}
.sim-now{margin:0; font-size:.95rem; line-height:1.5; padding:10px 14px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 6px 6px 0; min-height:3.2em}
.sim-play{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.sim-play button{font:inherit; font-size:.88rem; font-weight:600; padding:7px 14px; border-radius:6px; border:1.5px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; min-height:38px}
.sim-play button.primary{background:var(--accent); color:var(--sheet)}
.sim-play button:disabled{opacity:.4; cursor:default}
.sim-speed{display:inline-flex; align-items:center; gap:6px; font-size:.84rem; color:var(--muted)}
.sim-play .pos{font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums; margin-left:auto}
.sim-stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.sim-stat{border:1px solid var(--rule); border-radius:6px; padding:8px 10px; background:var(--paper); min-width:0}
.sim-stat b{display:block; font-family:var(--f-code); font-size:1rem; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.sim-stat span{font-size:.74rem; color:var(--muted)}
.sim-grid{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:14px}
.sim-panel{min-width:0; display:flex; flex-direction:column; gap:6px}
.sim-panel h5{margin:0; font-size:.78rem; font-weight:600; color:var(--muted)}
.sim-code{margin:0; background:var(--code-bg); color:var(--code-fg); border-radius:8px; padding:10px 0; overflow-x:auto; font-family:var(--f-code); font-size:.76rem; line-height:1.65}
.sim-code .ln{display:block; padding:0 12px; white-space:pre; border-left:3px solid transparent; min-width:max-content}
.sim-code .ln.hot{background:rgba(127,211,198,.17); border-left-color:var(--c-kw)}
.sim-stack{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; font-family:var(--f-code); font-size:.74rem}
.sim-stack li{padding:5px 8px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); overflow-wrap:anywhere}
.sim-stack li:first-child{border-width:1.5px; border-color:var(--ink)}
.sim-stack li.you{border-color:var(--accent); background:var(--accent-soft)}
.sim-stack li.idle{color:var(--muted)}
.sim-stack .who{font-family:var(--f-ui); font-size:.68rem; font-weight:600; color:var(--accent); white-space:nowrap}

<script>
const T = [];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW = "abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits yield when non-sealed true false null";
const HL = new RegExp(String.raw`(\/\*[\s\S]*?\*\/|\/\/[^\n]*|^[ \t]*#[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*")|(@[A-Za-z_]\w*)|\b(` + KW.split(" ").map(k=>k.replace("-","\\-")).join("|") + String.raw`)\b|\b(\d[\d_]*(?:\.\d+)?[LlFfDd]?)\b|\b([A-Z][A-Za-z0-9_]*)\b`, "gm");
function hl(src){
  let out = "", last = 0, m; HL.lastIndex = 0;
  while ((m = HL.exec(src))){
    out += esc(src.slice(last, m.index));
    const cls = m[1]?"c":m[2]?"s":m[3]?"a":m[4]?"k":m[5]?"n":"t";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = HL.lastIndex;
    if (m[0].length === 0) HL.lastIndex++;
  }
  return out + esc(src.slice(last));
}
let codeId = 0;
function J(code, cap){
  const id = "code" + (codeId++);
  return `<figure class="code"><div class="head"><figcaption>${cap ? esc(cap) : ""}</figcaption><button class="copy" data-copy="${id}" type="button">Copy</button></div><pre><code id="${id}">${hl(code.replace(/^\n+|\s+$/g,""))}</code></pre></figure>`;
}
function W(pairs){
  return '<aside class="terms" aria-label="Words to know"><h3>Words to know</h3><dl>' +
    pairs.map(p => '<div class="term"><dt>' + p[0] + '</dt><dd>' + p[1] + '</dd></div>').join("") + '</dl></aside>';
}
function Q(q, a){ return `<details class="q"><summary>${q}</summary><div class="ans">${a}</div></details>`; }
</script>
<script>
/* ===================== JAVA 8 ===================== */
T.push({
id:"j8-lambdas", track:"java8", title:"Lambdas & functional interfaces", since:"JDK 8", jep:"JEP 126",
lede:"A lambda is a short way to write a small piece of code that you can hand to another method, so that method can run it when it needs to.",
html:`
${W([
 ["Lambda","A small function without a name, written with an arrow: <code>(a, b) -&gt; a + b</code>. Read the arrow as \"becomes\"."],
 ["Functional interface","An interface with exactly one method that has no body. A lambda is a quick way to fill in that one method."],
 ["Method reference","A shortcut for a lambda that only calls an existing method, written <code>Person::getName</code>."],
 ["Capture","When a lambda uses a variable that belongs to the method around it."]
])}
<h2>The problem</h2>
<p>Before Java 8, you could pass numbers, text and objects to a method. You could not pass a piece of code.</p>
<p>Say you want to sort a list of people by name. The <code>sort</code> method needs to know <em>how to compare two people</em>. The only way to give it that was to write a whole class, just to hold one line of logic:</p>
${J(String.raw`// Java 7: six lines of ceremony around ONE line of real logic
Collections.sort(people, new Comparator<Person>() {
    @Override
    public int compare(Person a, Person b) {
        return a.getName().compareTo(b.getName());
    }
});`,"Before Java 8: an anonymous class was the only way to pass behaviour")}
<p>Now ask a simple question: what does Java really need from us here? It already knows that <code>sort</code> wants a <code>Comparator</code>. A <code>Comparator</code> has only one method to fill in, <code>compare</code>. So the only new information is the names of the two inputs and the line that compares them. Java could work out everything else by itself.</p>

<h2>The idea, step by step</h2>
<h3>1. Write only the part that matters</h3>
<p>A lambda is exactly that missing piece: the inputs, an arrow, and the code.</p>
${J(String.raw`people.sort((a, b) -> a.getName().compareTo(b.getName()));

// Even shorter: name an existing method instead of writing the code again
people.sort(Comparator.comparing(Person::getName));`)}

<h3>2. Java works out the type from where you put it</h3>
<p>You can use a lambda anywhere Java expects an interface with exactly one empty method. Such an interface is called a <strong>functional interface</strong>. Java looks at the place where you put the lambda and works out which interface you mean. The same lambda text can become a <code>Comparator</code> in one place and something else in another.</p>

<h3>3. Java ships ready-made interfaces for common shapes</h3>
<p>You rarely need to create your own. The package <code>java.util.function</code> has general-purpose ones. Learn these four and the rest are small variations:</p>
<div class="table-wrap"><table>
<thead><tr><th>Interface</th><th>Shape</th><th>In plain words</th></tr></thead>
<tbody>
<tr><td><code>Supplier&lt;T&gt;</code></td><td><code>() -&gt; T</code></td><td>Takes nothing, gives you something. Like a factory.</td></tr>
<tr><td><code>Consumer&lt;T&gt;</code></td><td><code>T -&gt; void</code></td><td>Takes something, gives nothing back. Like printing or saving.</td></tr>
<tr><td><code>Function&lt;T,R&gt;</code></td><td><code>T -&gt; R</code></td><td>Turns one thing into another.</td></tr>
<tr><td><code>Predicate&lt;T&gt;</code></td><td><code>T -&gt; boolean</code></td><td>Answers yes or no about something.</td></tr>
</tbody></table></div>
<p>Name prefixes tell you about variations. <code>Bi</code> means two inputs (<code>BiFunction</code>). <code>Int</code>, <code>Long</code> and <code>Double</code> mean it works directly with plain numbers (<code>IntPredicate</code>), which is faster. <code>UnaryOperator&lt;T&gt;</code> is a <code>Function</code> whose input and output have the same type.</p>
${J(String.raw`Predicate<String> notBlank  = s -> !s.isBlank();
Predicate<String> shortWord = s -> s.length() < 5;
Predicate<String> both      = notBlank.and(shortWord);   // combine two tests into one

Function<Integer, Integer> doubled = x -> x * 2;
Function<Integer, Integer> plusOne = x -> x + 1;
doubled.andThen(plusOne).apply(5);   // (5 * 2) + 1 = 11
doubled.compose(plusOne).apply(5);   // (5 + 1) * 2 = 12

@FunctionalInterface               // optional: the compiler complains if you add a 2nd empty method
interface RateRule {
    BigDecimal apply(BigDecimal baseRate);
}`,"Functional interfaces can be combined, because they are just objects")}

<h3>4. Using variables from outside the lambda</h3>
<p>A lambda can read local variables of the method it is written in. There is one rule: you must not change that variable after setting it. Java calls this <strong>effectively final</strong>.</p>
<p>Why? A lambda may run later, maybe after the method has already finished, maybe on another thread. Local variables disappear when their method finishes. So Java gives the lambda its own <em>copy</em> of the value. If the original variable could still change, the copy would quietly go out of date. Banning changes keeps the copy correct.</p>
${J(String.raw`int threshold = 10;
list.removeIf(x -> x > threshold);   // OK: threshold never changes

int count = 0;
list.forEach(x -> count++);          // compile error: count is changed`)}

<h2>Behind the scenes</h2>
<p>The old anonymous class became a separate file, <code>Outer$1.class</code>. A lambda does not. The compiler moves the lambda's body into a hidden private method. At the place where the lambda is used, it leaves a special instruction, <code>invokedynamic</code>, which means \"create the object for this the first time you get here\". The JVM then builds one tiny class for it at runtime and reuses it. That is why lambdas are cheap.</p>
${J(String.raw`// javap -c -p Demo.class   (shortened)
invokedynamic #7, 0  // creates the Comparator object the first time
...
private static int lambda$main$0(Person, Person);   // your lambda body, moved here`)}
<p>One visible difference: inside a lambda, <code>this</code> means the object around it. Inside an anonymous class, <code>this</code> means the anonymous object itself.</p>

<h2>Common mistakes</h2>
<ul class="traps">
<li>Calling a method that throws a checked exception, such as <code>Files.readString</code>, inside a lambda does not compile. <code>Function.apply</code> is not allowed to throw it. Catch it inside the lambda, or write your own interface whose method says <code>throws IOException</code>.</li>
<li><code>executor.submit(() -&gt; doWork())</code> can match both <code>Runnable</code> (returns nothing) and <code>Callable</code> (returns a value). If <code>doWork</code> returns something, Java picks <code>Callable</code>. Be aware of which one you get.</li>
<li>Long lambdas are hard to read and give confusing error messages. If one grows beyond three lines, move it into a named method and use a method reference.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>A lambda is a small piece of code you can pass to a method.</li>
<li>It can be used wherever Java expects an interface with exactly one empty method.</li>
<li>It can read local variables from outside, but those variables must not change.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why must local variables used inside a lambda never change, while fields can be changed freely?","A local variable lives only while its method runs, so the lambda receives a copy of its value. If the variable changed later, the copy would be wrong. A field lives inside an object, and the lambda keeps a link to that object, so it always reads the current value. There is only one copy of the field, so nothing can go out of date.")}
${Q("<code>Comparator</code> declares two methods, <code>compare</code> and <code>equals</code>. Is it still a functional interface?","Yes. Every class already has an <code>equals</code> method inherited from <code>Object</code>, so a lambda never needs to provide it. Only methods you would still have to fill in count, and that is just <code>compare</code>. Methods with a body (default and static methods) do not count either.")}
`});

T.push({
id:"j8-streams", track:"java8", title:"Streams", since:"JDK 8", jep:"JEP 107",
lede:"A stream is a recipe for processing a collection. You list the steps, and Java runs them only when you ask for the final result.",
html:`
${W([
 ["Stream","A sequence of elements you process step by step. It is not a collection: it holds no data of its own."],
 ["Intermediate operation","A step such as <code>filter</code> or <code>map</code>. It returns a new stream and does not run yet."],
 ["Terminal operation","The final step, such as <code>toList</code> or <code>count</code>. Calling it runs all the steps."],
 ["Lazy","Work is postponed until someone actually needs the result."],
 ["Collector","Instructions for gathering results into something, such as a list, a map or a total."]
])}
<h2>The problem</h2>
<p>Most loops over a collection do one of a few jobs: keep some items, change each item, or combine items into a total. In a normal loop, <em>what</em> you want is mixed up with <em>how</em> to loop, plus temporary lists and counters.</p>
${J(String.raw`// "Total outstanding amount of active loans above 100k, per product"
Map<String, BigDecimal> totals = new HashMap<>();
for (Loan l : loans) {
    if (l.isActive() && l.getAmount().compareTo(BIG) > 0) {
        totals.merge(l.getProduct(), l.getOutstanding(), BigDecimal::add);
    }
}`)}
<p>The real intent has three steps: keep some loans, look at one field, group and add up. Streams let you write exactly those three steps and leave the looping to Java.</p>
${J(String.raw`Map<String, BigDecimal> totals = loans.stream()
    .filter(Loan::isActive)                                    // step 1: keep active loans
    .filter(l -> l.getAmount().compareTo(BIG) > 0)             //         ...above 100k
    .collect(Collectors.groupingBy(                            // step 2 and 3: group and add up
        Loan::getProduct,
        Collectors.reducing(BigDecimal.ZERO, Loan::getOutstanding, BigDecimal::add)));`)}

<h2>The idea, step by step</h2>
<h3>1. Every stream has three parts</h3>
<ol>
<li><strong>A source</strong>: where the elements come from. A list, an array, the lines of a file, or a number range.</li>
<li><strong>Intermediate operations</strong>: the steps, such as <code>filter</code>, <code>map</code>, <code>sorted</code>, <code>distinct</code> and <code>limit</code>. Each one returns a new stream. None of them does any work yet.</li>
<li><strong>A terminal operation</strong>: the final step, such as <code>collect</code>, <code>toList</code>, <code>forEach</code>, <code>count</code>, <code>findFirst</code> or <code>anyMatch</code>. This is what starts the work.</li>
</ol>

<h3>2. Elements travel one at a time through all the steps</h3>
<p>Think of an assembly line. Each item travels down the whole line before the next item starts. Java does <em>not</em> run all items through step 1, then all through step 2. Run this code and read the output:</p>
${J(String.raw`Stream.of("a", "bb", "ccc", "dddd")
    .filter(s -> { System.out.println("filter " + s); return s.length() > 1; })
    .map(s -> { System.out.println("map " + s); return s.toUpperCase(); })
    .findFirst();

// filter a
// filter bb
// map bb        <- stops here. "ccc" and "dddd" are never touched.`,"Java only does as much work as the result needs")}
<p>Because nothing runs until the end, and items go one at a time, Java can stop as soon as it has the answer. That is why <code>limit</code>, <code>findFirst</code> and <code>anyMatch</code> even work on endless sources such as <code>Stream.iterate(1, n -&gt; n * 2)</code>.</p>

<h3>3. Some steps have to wait for everything</h3>
<p><code>filter</code> and <code>map</code> can decide about one item without seeing the others. <code>sorted</code> and <code>distinct</code> cannot. To give you the smallest item first, <code>sorted</code> must first look at <em>all</em> items. Such a step works like a wall: everything piles up behind it until the source is empty. That costs memory and stops the early-exit trick from step 2.</p>

<h3>4. flatMap: one item in, many out</h3>
<p><code>map</code> turns each item into exactly one new item. <code>flatMap</code> turns each item into a stream of items and joins all those streams into one.</p>
${J(String.raw`List<Order> orders = ...;
List<LineItem> allItems = orders.stream()
    .flatMap(o -> o.getItems().stream())   // each order becomes its line items
    .toList();          // Java 16+. On Java 8 use .collect(Collectors.toList())`)}

<h3>5. Collectors do the heavy lifting at the end</h3>
${J(String.raw`// group, then count per group
Map<Status, Long> byStatus = loans.stream()
    .collect(Collectors.groupingBy(Loan::getStatus, Collectors.counting()));

// split into two groups: true and false
Map<Boolean, List<Loan>> parts = loans.stream()
    .collect(Collectors.partitioningBy(l -> l.getRate().compareTo(CAP) > 0));

// to a map by id. The third argument says what to do if two loans have the same id.
Map<Long, Loan> byId = loans.stream()
    .collect(Collectors.toMap(Loan::getId, l -> l, (a, b) -> a));

String csv = names.stream().collect(Collectors.joining(", ", "[", "]"));   // "[Ann, Bob]"`)}

<h2>Behind the scenes</h2>
<p>When you add steps, Java only links small objects together, one per step. When the terminal operation runs, the source pushes each element into the first step, which passes it on to the next, and so on. Nothing can happen earlier, because nothing pushes until the end. The lesson <a href="#j8-stream-iter">Streams vs iterators</a> builds this from scratch and has a simulation you can step through.</p>
<p><code>parallelStream()</code> splits the source into halves again and again, and runs the pieces on several threads at once. It only helps for big amounts of calculation on sources that are easy to split, such as arrays and <code>ArrayList</code>. It does not help for small lists, linked lists, or work that waits on a database or network.</p>

<h2>Common mistakes</h2>
<ul class="traps">
<li>A stream can only be used once. Calling a second terminal operation on it throws <code>IllegalStateException</code>.</li>
<li>Do not change an outside list or counter from inside <code>map</code> or <code>forEach</code>. Let a collector build the result. With a parallel stream, adding to a shared <code>ArrayList</code> loses items or crashes.</li>
<li><code>Collectors.toMap</code> throws an exception if two items have the same key, unless you pass the third argument that says which one to keep.</li>
<li><code>parallelStream()</code> inside a web request shares one pool of threads with every other parallel stream in the application. A slow one slows down all of them.</li>
<li><code>peek</code> is for debugging only. Java may skip it, for example when <code>count()</code> already knows the size.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>Source, then steps, then one final step. Nothing runs until the final step.</li>
<li>Items go through all the steps one at a time, so Java can stop early.</li>
<li><code>sorted</code> and <code>distinct</code> must see everything first.</li>
<li>Build results with collectors, not by changing outside variables.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why does <code>Stream.iterate(1, x -&gt; x + 1).sorted().findFirst()</code> never finish?","The source never ends, and <code>sorted</code> has to see every item before it can hand out the smallest one. So it keeps collecting forever, and <code>findFirst</code> never receives anything to stop on.")}
${Q("Why should you not use <code>reduce</code> to build a list?","<code>reduce</code> is meant for combining values that never change, like adding numbers. If you give it a list to add to, all parallel workers add to that same list at once and the result is broken. Even on one thread it is slow, because each step copies the list. <code>collect</code> is built for this job: each worker gets its own list, and the lists are joined at the end.")}
`});

T.push({
id:"j8-optional", track:"java8", title:"Optional", since:"JDK 8", jep:null,
lede:"Optional is a box that may or may not hold a value. When a method returns one, its signature itself says: this might be empty, so decide what to do in that case.",
html:`
${W([
 ["null","A special value meaning \"no object here\"."],
 ["NullPointerException","The error you get when you call a method on <code>null</code>."],
 ["Optional","A small wrapper that is either empty or holds exactly one value."],
 ["Method signature","The first line of a method: its name, its parameters and its return type."]
])}
<h2>The problem</h2>
<p>A method that returns <code>Customer</code> might return <code>null</code> when nothing was found. Nothing in its signature tells you that. You have to read the documentation, remember it, and check for <code>null</code> yourself. When you forget, you get a <code>NullPointerException</code>, often far away from the real cause.</p>
<p>The fix is to make \"maybe nothing\" part of the <em>return type</em>. If the method returns <code>Optional&lt;Customer&gt;</code>, you cannot call <code>getName()</code> on the result directly. Java forces you to decide what happens when it is empty.</p>

<h2>The idea, step by step</h2>
${J(String.raw`Optional<Customer> findByEmail(String email) {
    return Optional.ofNullable(repo.get(email));   // null becomes an empty Optional
}

// Change the value step by step, with no null checks at all
String city = findByEmail(email)
    .map(Customer::getAddress)        // Optional<Address>
    .map(Address::getCity)            // Optional<String>
    .filter(c -> !c.isBlank())        // empty if the city is blank
    .orElse("Unknown");               // the fallback when anything was empty

// When a missing value is a real error, fail with a clear message
Customer c = findByEmail(email)
    .orElseThrow(() -> new CustomerNotFound(email));`,"map skips its function when the box is empty; orElse picks a fallback")}
<p><code>map</code> only runs its function if there is a value. If the box is empty, it stays empty, and the chain simply passes the empty box along to <code>orElse</code>.</p>
<p><code>map</code> vs <code>flatMap</code>: if your function itself returns an <code>Optional</code>, <code>map</code> would give you a box inside a box, <code>Optional&lt;Optional&lt;X&gt;&gt;</code>. <code>flatMap</code> unpacks it to one box.</p>
${J(String.raw`Optional<Account> acc = findByEmail(email).flatMap(this::primaryAccount);
// primaryAccount(Customer) returns Optional<Account>`)}

<h3>orElse vs orElseGet</h3>
<p><code>orElse(x)</code> always calculates <code>x</code>, even when the box has a value, because Java works out a method's arguments before calling it. <code>orElseGet(...)</code> takes a lambda and only runs it when the box is empty. Use it when the fallback is slow or has side effects.</p>
${J(String.raw`opt.orElse(loadDefaultFromDb());          // database call EVERY time, even when not needed
opt.orElseGet(() -> loadDefaultFromDb());  // database call only when empty`)}

<h2>Where Optional belongs</h2>
<p>It was designed for one job: the <strong>return type</strong> of a method that looks something up and might find nothing. It is not a general replacement for <code>null</code>.</p>
<ul>
<li>Do: return <code>Optional</code> from find and lookup methods. Spring Data does this with <code>findById</code>.</li>
<li>Do not: use it for fields, method parameters or items in a list. It adds an extra object and cannot be serialized, and an <code>Optional</code> parameter can still be passed <code>null</code>.</li>
<li>Do not: return <code>Optional&lt;List&lt;X&gt;&gt;</code>. Return an empty list instead.</li>
</ul>

<h2>Common mistakes</h2>
<ul class="traps">
<li>Calling <code>opt.get()</code> without checking is just a <code>null</code> error with a different name. Java 10 added <code>orElseThrow()</code> as a clearer name for it.</li>
<li><code>if (opt.isPresent()) { opt.get() }</code> works, but usually <code>map</code>, <code>ifPresent</code> or <code>ifPresentOrElse</code> (Java 9) says it better.</li>
<li><code>Optional.of(null)</code> throws straight away. Use <code>ofNullable</code> when the value might be <code>null</code>.</li>
</ul>

<h2>Remember</h2>
<ul>
<li><code>Optional</code> is a box that is empty or holds one value.</li>
<li>Use it as a return type for lookups that might find nothing.</li>
<li>A method that returns <code>Optional</code> must never return <code>null</code>.</li>
</ul>

<h2>Check yourself</h2>
${Q("A method returns <code>Optional&lt;User&gt;</code> but sometimes returns <code>null</code>. What happens to the caller?","The caller trusts the type and calls <code>.map</code> or <code>.orElse</code> on the result. Calling a method on <code>null</code> throws a <code>NullPointerException</code>. The method broke its own promise: it should return <code>Optional.empty()</code>, never <code>null</code>.")}
`});

T.push({
id:"j8-time", track:"java8", title:"java.time", since:"JDK 8", jep:"JEP 150",
lede:"java.time gives each kind of date and time question its own type, so a calendar date, an exact moment and a time zone can no longer be mixed up by accident.",
html:`
${W([
 ["Instant","An exact moment in time, the same everywhere on Earth. Stored as seconds since 1 January 1970 (UTC)."],
 ["Time zone","A region's rules for its clock, such as Europe/Amsterdam. Includes when daylight saving time starts and ends."],
 ["Daylight saving time (DST)","Moving clocks one hour forward in spring and back in autumn. On those days, a day has 23 or 25 hours."],
 ["Immutable","Cannot be changed after it is created. Methods return a new object instead."]
])}
<h2>The problem</h2>
<p>The old <code>java.util.Date</code> had many problems. Its name was wrong (it stores a moment, not a date). Anyone holding it could change it. Months started counting at 0. And <code>SimpleDateFormat</code> broke when two threads used it at the same time.</p>
<p>The deeper problem was that it mixed up three different questions:</p>
<ol>
<li><strong>When did it happen?</strong> An exact moment, the same for everyone on Earth.</li>
<li><strong>What did the calendar and the clock on the wall say?</strong> \"15 March 2026, 09:00\", without saying where.</li>
<li><strong>Where?</strong> Which time zone, with its own rules for daylight saving time.</li>
</ol>
<p>java.time (based on the Joda-Time library) gives each combination its own type. All of them are immutable, so they are safe to share.</p>
<div class="table-wrap"><table>
<thead><tr><th>Type</th><th>Holds</th><th>Use it for</th></tr></thead>
<tbody>
<tr><td><code>Instant</code></td><td>An exact moment</td><td>Timestamps, logs, \"created at\" columns</td></tr>
<tr><td><code>LocalDate</code></td><td>2026-03-15</td><td>Birthdays, contract start dates, interest periods</td></tr>
<tr><td><code>LocalDateTime</code></td><td>2026-03-15T09:00</td><td>A wall-clock time with no place. Rarely right for events.</td></tr>
<tr><td><code>ZonedDateTime</code></td><td>Date and time + a zone such as Europe/Amsterdam</td><td>Things people plan, like meetings</td></tr>
<tr><td><code>OffsetDateTime</code></td><td>Date and time + a fixed offset such as +02:00</td><td>APIs and databases</td></tr>
<tr><td><code>Duration</code> / <code>Period</code></td><td>Exact seconds / calendar days, months, years</td><td>Timeouts / \"add 3 months\"</td></tr>
</tbody></table></div>

<h2>The idea, step by step</h2>
${J(String.raw`LocalDate start = LocalDate.of(2026, 3, 31);
LocalDate next  = start.plusMonths(1);          // 2026-04-30 (April has no 31st). start is unchanged.

ZoneId ams = ZoneId.of("Europe/Amsterdam");
ZonedDateTime meeting = ZonedDateTime.of(2026, 3, 28, 9, 0, 0, 0, ams);
meeting.plusDays(1);                    // 2026-03-29T09:00+02:00  still 9am on the calendar
meeting.plus(Duration.ofHours(24));     // 2026-03-29T10:00+02:00  exactly 24 hours later

Instant now = Instant.now();
ZonedDateTime inPune = now.atZone(ZoneId.of("Asia/Kolkata"));   // same moment, Indian wall clock

long days = ChronoUnit.DAYS.between(start, LocalDate.of(2026, 12, 31));
Period p  = Period.between(start, LocalDate.of(2027, 6, 1));     // P1Y2M1D = 1 year, 2 months, 1 day`,"plusDays follows the calendar; plus(Duration) follows the stopwatch")}
<p>The daylight saving example shows why there are two kinds of \"amount of time\". On the night the clocks change, \"one day later\" and \"24 hours later\" are different answers. <code>Period</code> counts calendar days. <code>Duration</code> counts exact seconds.</p>

<h3>Formatting and parsing text</h3>
${J(String.raw`// DateTimeFormatter never changes and is safe for many threads: keep one in a constant
static final DateTimeFormatter NL = DateTimeFormatter.ofPattern("dd-MM-yyyy");

LocalDate d = LocalDate.parse("15-03-2026", NL);
String iso  = d.toString();                    // 2026-03-15 (the standard ISO format)`)}

<h3>Making time testable: pass in a Clock</h3>
<p>If your code calls <code>LocalDate.now()</code> directly, a test cannot control what \"today\" is. Pass a <code>Clock</code> in, and tests can give it a fixed date.</p>
${J(String.raw`class InterestService {
    private final Clock clock;
    InterestService(Clock clock) { this.clock = clock; }
    boolean isExpired(LocalDate end) { return LocalDate.now(clock).isAfter(end); }
}

// in a test: "today" is always 1 January 2026
var svc = new InterestService(Clock.fixed(Instant.parse("2026-01-01T00:00:00Z"), ZoneOffset.UTC));`)}

<h2>Common mistakes</h2>
<ul class="traps">
<li>Storing events as <code>LocalDateTime</code>. It does not say where, so it cannot say exactly when. Store an <code>Instant</code> or <code>OffsetDateTime</code>.</li>
<li>Writing <code>YYYY</code> instead of <code>yyyy</code> in a pattern. <code>YYYY</code> is the \"week-based year\" and shows the wrong year in the last days of December.</li>
<li><code>LocalDate.now()</code> uses the server's time zone. A server set to UTC and a user in Amsterdam disagree about the date around midnight.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>An exact moment is an <code>Instant</code>. A calendar date is a <code>LocalDate</code>. A zone turns one into the other.</li>
<li><code>Period</code> is calendar time; <code>Duration</code> is stopwatch time.</li>
<li>All java.time types are immutable; methods return new objects.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why can't you add <code>Duration.ofDays(1)</code> to a <code>LocalDate</code>?","A <code>Duration</code> is an exact number of seconds, and a <code>LocalDate</code> has no time of day to add seconds to. Java throws an exception. Use <code>plusDays(1)</code> or a <code>Period</code>, which count in calendar days.")}
`});

T.push({
id:"j8-default", track:"java8", title:"Default & static interface methods", since:"JDK 8", jep:null,
lede:"A default method is an interface method that comes with a body. It lets you add new methods to an interface without breaking every class that already implements it.",
html:`
${W([
 ["Interface","A list of methods that a class promises to provide."],
 ["Implement","When a class says <code>implements X</code>, it must provide all of X's methods."],
 ["Default method","An interface method with a ready-made body. Classes get it for free, but may replace it."],
 ["Override","Replacing an inherited method with your own version."]
])}
<h2>The problem</h2>
<p>Java 8 wanted to add <code>stream()</code> and <code>forEach()</code> to the <code>Collection</code> interface. But thousands of classes in libraries all over the world implement <code>Collection</code>. If Java added a method without a body, every one of those classes would stop compiling, because they do not provide that new method.</p>
<p>The smallest possible fix: let the interface itself supply a body. Classes that do nothing get that body automatically. That is a <strong>default method</strong>. Its main purpose is to let interfaces grow over time.</p>

<h2>The idea, step by step</h2>
${J(String.raw`public interface Collection<E> extends Iterable<E> {
    // ...the old methods without bodies...
    default Stream<E> stream() {                       // new, and comes with a body
        return StreamSupport.stream(spliterator(), false);
    }
    default boolean removeIf(Predicate<? super E> filter) { /* loop and remove */ }
}

public interface Validator<T> {
    boolean isValid(T t);
    default Validator<T> and(Validator<T> other) { return t -> isValid(t) && other.isValid(t); }
    static <T> Validator<T> alwaysTrue() { return t -> true; }   // a helper that lives on the interface
}`)}

<h3>When two bodies compete</h3>
<p>A class can now inherit two different bodies for the same method. Java settles it with three rules, checked in order:</p>
<ol>
<li><strong>Classes win.</strong> A method from a parent class always beats an interface default.</li>
<li><strong>The more specific interface wins.</strong> If <code>B extends A</code> and both have a body, <code>B</code>'s is used.</li>
<li>Otherwise Java refuses to guess. You must override the method and choose.</li>
</ol>
${J(String.raw`interface Left  { default String name() { return "left"; } }
interface Right { default String name() { return "right"; } }

class Both implements Left, Right {
    @Override public String name() { return Left.super.name(); }  // you must choose
}`)}

<h3>Interface or abstract class?</h3>
<p>Interfaces still cannot hold data per object (no normal fields) and have no constructors. Use an abstract class when the classes share data. Use an interface with default methods when they only share behaviour built from other interface methods. Since Java 9, interfaces can also have <code>private</code> methods, so defaults can share helper code.</p>

<h2>Common mistakes</h2>
<ul class="traps">
<li>A default method cannot be <code>equals</code>, <code>hashCode</code> or <code>toString</code>. The \"classes win\" rule means <code>Object</code>'s versions would always win, so Java forbids it.</li>
<li>Adding a default method to a popular interface can still change behaviour if some class already had a method with the same name doing something different.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>A default method is an interface method with a body.</li>
<li>It exists so interfaces can gain methods without breaking old classes.</li>
<li>If two bodies conflict: class wins, then the more specific interface, else you choose.</li>
</ul>
`});

T.push({
id:"j8-cf", track:"java8", title:"CompletableFuture", since:"JDK 8", jep:"JEP 155",
lede:"A CompletableFuture is a result that will arrive later, plus a way to say \"when it arrives, do this next\", without keeping a thread waiting.",
html:`
${W([
 ["Thread","One line of work being carried out. A program can run many threads side by side."],
 ["Blocking","A thread stops and waits, for example for a database answer. While it waits, it does nothing useful."],
 ["Executor / thread pool","A group of reusable threads that you hand tasks to."],
 ["Callback","Code you register now, to be run later when something has finished."]
])}
<h2>The problem</h2>
<p>Java 5's <code>Future</code> stands for a result that will arrive later. But the only way to use the result is <code>get()</code>, which <strong>blocks</strong>: your thread stops and waits. If you call three services and combine their answers, you end up with threads sitting idle, waiting on other threads.</p>
<p>A better idea: instead of a thread waiting for the value, let the arrival of the value <em>start the next piece of work</em>. That is a callback. <code>CompletableFuture</code> is a callback system that lets you chain and combine steps.</p>

<h2>The idea, step by step</h2>
${J(String.raw`ExecutorService io = Executors.newFixedThreadPool(20);

// Start two calls at the same time
CompletableFuture<Customer> customerF = CompletableFuture.supplyAsync(() -> crm.load(id), io);
CompletableFuture<List<Loan>> loansF  = CompletableFuture.supplyAsync(() -> loanApi.forCustomer(id), io);

CompletableFuture<Dashboard> dash = customerF
    .thenCombine(loansF, Dashboard::new)                  // when BOTH are done, combine them
    .thenApply(Dashboard::withRiskScore)                  // then change the result
    .exceptionally(ex -> Dashboard.degraded(ex));         // if anything failed, use a fallback

Dashboard d = dash.join();   // wait only once, at the very end`,"The two calls run side by side: total time is the slower one, not both added")}
<div class="table-wrap"><table>
<thead><tr><th>Method</th><th>Similar stream method</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><code>thenApply(fn)</code></td><td><code>map</code></td><td>Change the result</td></tr>
<tr><td><code>thenCompose(fn)</code></td><td><code>flatMap</code></td><td>The next step is itself asynchronous. Avoids a future inside a future.</td></tr>
<tr><td><code>thenCombine(other, fn)</code></td><td></td><td>Wait for two results, then merge them</td></tr>
<tr><td><code>thenAccept</code> / <code>thenRun</code></td><td><code>forEach</code></td><td>Do something with the result, return nothing</td></tr>
<tr><td><code>allOf(...)</code> / <code>anyOf(...)</code></td><td></td><td>Wait for all of many, or for the first of many</td></tr>
<tr><td><code>exceptionally</code> / <code>handle</code> / <code>whenComplete</code></td><td></td><td>Recover from errors, inspect the result, or clean up</td></tr>
</tbody></table></div>

<h3>Which thread runs my next step?</h3>
<p>This is the part that confuses people. <code>thenApply</code> (without <code>Async</code> in the name) runs on whichever thread finished the previous step. If the previous step is <em>already finished</em> when you call <code>thenApply</code>, there is no other thread to run it, so it runs <em>right away on your own thread</em>. The methods ending in <code>Async</code> always hand the work to an executor: the one you pass, or Java's shared pool if you pass none.</p>
${J(String.raw`// Start one call per id, then collect all the answers
List<CompletableFuture<Rate>> fs = ids.stream()
    .map(i -> CompletableFuture.supplyAsync(() -> rateApi.get(i), io))
    .toList();
CompletableFuture<List<Rate>> all = CompletableFuture
    .allOf(fs.toArray(CompletableFuture[]::new))
    .thenApply(v -> fs.stream().map(CompletableFuture::join).toList());

// Java 9+: give up after 2 seconds without blocking anything
customerF.orTimeout(2, TimeUnit.SECONDS);
customerF.completeOnTimeout(Customer.UNKNOWN, 2, TimeUnit.SECONDS);   // or use a default`)}

<h2>Common mistakes</h2>
<ul class="traps">
<li><code>supplyAsync</code> without an executor uses Java's shared pool, which has only as many threads as CPU cores. Slow database or network calls there block every parallel stream in the application. Always pass your own executor for such calls.</li>
<li>Errors arrive wrapped. <code>join()</code> throws <code>CompletionException</code> and <code>get()</code> throws <code>ExecutionException</code>. The real error is in <code>getCause()</code>.</li>
<li>A chain with no <code>exceptionally</code>, where nobody ever calls <code>join</code>, hides failures completely.</li>
<li><code>cancel(true)</code> does not stop a task that is already running. It only marks the future as cancelled.</li>
<li>With Java 21 virtual threads, plain step-by-step code is often simpler than a long chain. See the virtual threads lesson.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>A <code>CompletableFuture</code> is a future result you can attach next steps to.</li>
<li>Start independent calls together, combine them, and wait only once at the end.</li>
<li>Steps without <code>Async</code> can run on your own thread. Pass your own executor for slow work.</li>
</ul>

<h2>Check yourself</h2>
${Q("Inside a web request you call <code>thenApply(heavyWork)</code> on a future that has already finished. Which thread runs <code>heavyWork</code>?","Your own request thread, immediately, inside the <code>thenApply</code> call. There is no other thread waiting to do it. To move the work elsewhere, use <code>thenApplyAsync(fn, executor)</code>.")}
`});
/* ===================== PREDICATE, METHOD BY METHOD ===================== */
T.splice(T.findIndex(t => t.id === "j8-lambdas") + 1, 0, {
id:"j8-predicate", track:"java8", title:"Predicate, method by method", since:"JDK 8 / 11", jep:null,
lede:"A Predicate is a yes-or-no test you can store in a variable. Its methods let you combine tests the same way you combine true and false with &&, || and !.",
mount(root){ mountPredicateLab(root.querySelector("#predLab")); },
html:`
${W([
 ["Predicate","A test that answers true or false about one value, such as \"is this loan active?\""],
 ["Compose","Build a bigger test out of smaller ones, without running any of them yet."],
 ["Short-circuit","Stop evaluating as soon as the answer is known. In <code>a &amp;&amp; b</code>, if <code>a</code> is false, <code>b</code> is never checked."],
 ["Default method","A method with a body inside an interface. Most of Predicate's methods are default methods."],
 ["Static method","A method you call on the interface itself, such as <code>Predicate.not(...)</code>, not on an object."]
])}
<h2>The problem</h2>
<p>Suppose you filter loans in different ways in different places. Without a way to pass a test around, every combination needs its own method:</p>
${J(String.raw`List<Loan> active(List<Loan> in)                 { ... if (l.isActive()) ... }
List<Loan> activeAndLarge(List<Loan> in)         { ... if (l.isActive() && l.amount() > 300_000) ... }
List<Loan> activeOrHighRate(List<Loan> in)       { ... if (l.isActive() || l.rate() > 4.0) ... }
List<Loan> notActiveAndLarge(List<Loan> in)      { ... }
// 4 conditions already give dozens of combinations, each with the same copied loop.`)}
<p>Look at what actually changes between these methods: only the condition inside the <code>if</code>. A condition about a loan is just a function from <code>Loan</code> to <code>true</code>/<code>false</code>. If that function can be stored in a variable, one <code>filter</code> method is enough, and each caller passes in its own condition.</p>
<p>Now one more step. You already know how to combine <code>true</code>/<code>false</code> values with <code>&amp;&amp;</code>, <code>||</code> and <code>!</code>. If a test is a value too, you should be able to combine <em>tests</em> the same way and get a new test back. That is the whole design of <code>Predicate</code>:</p>
<div class="table-wrap"><table>
<thead><tr><th>With true/false values</th><th>With predicates</th><th>Gives you</th></tr></thead>
<tbody>
<tr><td><code>a &amp;&amp; b</code></td><td><code>p.and(q)</code></td><td>A new test: true when both are true</td></tr>
<tr><td><code>a || b</code></td><td><code>p.or(q)</code></td><td>A new test: true when at least one is true</td></tr>
<tr><td><code>!a</code></td><td><code>p.negate()</code>, <code>Predicate.not(p)</code></td><td>A new test: the opposite answer</td></tr>
<tr><td><code>a == x</code></td><td><code>Predicate.isEqual(x)</code></td><td>A test: \"is this equal to x?\"</td></tr>
</tbody></table></div>

<h2>The whole interface</h2>
<p>This is the JDK source file you shared, with the comments removed. It is short enough to read in one go, and each method has only one line of real logic.</p>
${J(String.raw`@FunctionalInterface
public interface Predicate<T> {

    boolean test(T t);                                   // the only method without a body

    default Predicate<T> and(Predicate<? super T> other) {
        Objects.requireNonNull(other);
        return (t) -> test(t) && other.test(t);
    }

    default Predicate<T> negate() {
        return (t) -> !test(t);
    }

    default Predicate<T> or(Predicate<? super T> other) {
        Objects.requireNonNull(other);
        return (t) -> test(t) || other.test(t);
    }

    static <T> Predicate<T> isEqual(Object targetRef) {
        return (null == targetRef)
                ? Objects::isNull
                : object -> targetRef.equals(object);
    }

    @SuppressWarnings("unchecked")
    static <T> Predicate<T> not(Predicate<? super T> target) {   // added in Java 11
        Objects.requireNonNull(target);
        return (Predicate<T>) target.negate();
    }
}`,"java.util.function.Predicate (JDK source, comments removed)")}

<h2>Build it yourself first</h2>
<p>Before reading each method, try inventing the interface yourself. You need just one thing: a type for \"a test on a T\".</p>
${J(String.raw`interface Check<T> {
    boolean test(T t);
}

// Combining two checks means returning a NEW check that runs both
static <T> Check<T> both(Check<T> a, Check<T> b) {
    return t -> a.test(t) && b.test(t);
}

Check<Loan> active = l -> l.status() == ACTIVE;
Check<Loan> large  = l -> l.amount() > 300_000;
Check<Loan> target = both(active, large);       // nothing has been tested yet
target.test(someLoan);                          // NOW both tests run`)}
<p>That works, but nested calls read inside-out: <code>both(either(a, b), c)</code>. Java 8 had just added default methods, so the helper could move onto the interface itself and read from left to right: <code>a.or(b).and(c)</code>. Rename <code>Check</code> to <code>Predicate</code> and <code>both</code> to <code>and</code>, and you have reinvented the JDK interface. Every method below is a variation of this one idea.</p>

<h2>test(T t): the one method you write</h2>
<p>A functional interface has exactly one method without a body, and that is the method your lambda provides. <code>@FunctionalInterface</code> makes the compiler complain if someone adds a second one by mistake.</p>
${J(String.raw`Predicate<Loan> active   = l -> l.status() == Status.ACTIVE;   // a lambda becomes test()
Predicate<Loan> isFixed  = Loan::isFixed;                       // a method reference works too
Predicate<String> blank  = String::isBlank;                     // means: s -> s.isBlank()
Predicate<String> codeOk = Pattern.compile("[A-Z]{3}").asMatchPredicate();   // Java 11

active.test(loan);   // true or false`)}
<p>All the other methods are built only from <code>test</code>. That is why they can have bodies already: they never need to know <em>how</em> a test decides, only that it can be asked.</p>

<h2>and(other): \"both must be true\"</h2>
<p>Read the body: <code>return (t) -&gt; test(t) &amp;&amp; other.test(t);</code>. Four separate ideas are packed into that line.</p>
<h3>1. It builds a test; it does not run one</h3>
<p>Calling <code>and</code> checks nothing. It creates a new lambda that remembers two things: the test on the left (<code>test(t)</code> here means <code>this.test(t)</code>) and the test passed in, <code>other</code>. Building happens once. Checking happens later, once per item.</p>
<h3>2. It stops early, because &amp;&amp; does</h3>
<p>If the left test is false, <code>other.test</code> is never called. <code>Predicate</code> did not implement this itself; it gets it for free from Java's <code>&amp;&amp;</code>. Two practical results:</p>
${J(String.raw`// Order as a safety guard: the left test protects the right one
Predicate<Loan> hasOwner  = l -> l.owner() != null;
Predicate<Loan> ownerIsNl = l -> l.owner().country().equals("NL");
hasOwner.and(ownerIsNl);     // safe: ownerIsNl only runs when there is an owner
ownerIsNl.and(hasOwner);     // NullPointerException for loans without an owner

// Order for speed: put the cheap test first
Predicate<Loan> inArrears = Loan::inArrears;                       // reads a field: fast
Predicate<Loan> riskFlag  = l -> riskApi.isFlagged(l.id());        // calls another service: slow
inArrears.and(riskFlag);     // the slow call only happens for loans in arrears`)}
<h3>3. requireNonNull(other) fails immediately</h3>
<p>Without that line, <code>a.and(null)</code> would succeed and return a test that crashes later, maybe deep inside a stream, maybe on another thread, far away from the real mistake. Checking right away makes the error point to the line that caused it. <code>negate()</code> has no such check because it takes no argument.</p>
<h3>4. Why the parameter is Predicate&lt;? super T&gt;</h3>
<p>A predicate only <em>receives</em> its value; it never hands one back. Anything that can test any <code>Object</code> can certainly test a <code>Loan</code>. So <code>and</code> accepts a test on <code>T</code> or on any parent type of <code>T</code>. Java developers remember this rule as \"PECS\": Producer Extends, Consumer Super.</p>
${J(String.raw`Predicate<Loan>   active  = Loan::isActive;
Predicate<Object> notNull = Objects::nonNull;

active.and(notNull);        // compiles: a test on Object can test a Loan
notNull.and(active);        // does NOT compile: a test on Loans cannot test any Object

// To put the null check first, create it as a test on Loan:
Predicate<Loan> loanNotNull = Objects::nonNull;    // same method, used as a Loan test
loanNotNull.and(active);    // compiles, and the null check runs first`)}

<h2>or(other): \"at least one must be true\"</h2>
<p>The body is <code>test(t) || other.test(t)</code>, so everything about <code>and</code> applies in mirror image. It stops early when the left test is <em>true</em>. Put the cheapest test, or the one most often true, on the left.</p>
${J(String.raw`Predicate<Loan> needsReview = Loan::inArrears
        .or(l -> l.rate().compareTo(new BigDecimal("6.0")) > 0);
// Does not compile! A method reference has no type until it is put somewhere,
// so you cannot call .or() on Loan::inArrears directly. Give it a type first:

Predicate<Loan> inArrears = Loan::inArrears;
Predicate<Loan> needsReview2 = inArrears
        .or(l -> l.rate().compareTo(new BigDecimal("6.0")) > 0)
        .or(l -> l.ltv() > 1.0);`)}
<p>Chains are read from left to right: <code>a.and(b).or(c)</code> means <code>(a &amp;&amp; b) || c</code>. There is no operator priority; the order of the calls decides the grouping. For <code>a &amp;&amp; (b || c)</code>, nest the call: <code>a.and(b.or(c))</code>.</p>

<div class="fig">
<svg viewBox="0 0 560 236" role="img" aria-label="How active.and(large).or(highRate) is checked for loan L7: active is false, so large is skipped; highRate is then checked and is true, so the result is true">
<path d="M280 52 L150 96" class="f-line"/><path d="M280 52 L410 96" class="f-line"/>
