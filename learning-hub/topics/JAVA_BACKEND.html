<h2>negate(): the opposite answer</h2>
<p>The body is <code>(t) -&gt; !test(t)</code>. Because it is called on an object, you need a predicate stored in a variable first:</p>
${J(String.raw`Predicate<Loan> active = Loan::isActive;
loans.stream().filter(active.negate()).toList();      // loans that are NOT active

loans.stream().filter(Loan::isActive.negate());       // does not compile: same rule as above
loans.stream().filter(l -> !l.isActive());            // the usual workaround before Java 11`)}
<p>That compile error is exactly what the next method fixes.</p>

<h2>not(target): negate, but works with method references</h2>
<p>Added in Java 11. Its body simply calls <code>target.negate()</code>. Why add a method that does the same thing? Because a static method receives the test as a <em>parameter</em>, and being a parameter gives a method reference the type it was missing:</p>
${J(String.raw`import static java.util.function.Predicate.not;

lines.stream().filter(not(String::isBlank)).toList();
loans.stream().filter(not(Loan::isActive)).count();
codes.removeIf(not(validCodes::contains));            // keep only the valid codes`)}
<h3>About the cast in its source</h3>
<p><code>target</code> is a test on some parent type of <code>T</code>, so <code>target.negate()</code> is too. The method promises to return a test on <code>T</code>, so it casts. That is safe for the same reason as before: a test that works on a parent type also works on <code>T</code>, and a predicate never hands a value back. The compiler cannot see that and warns anyway, so the JDK hides the warning with <code>@SuppressWarnings</code>.</p>

<h2>isEqual(targetRef): \"is it equal to this?\"</h2>
<p>This one is a <em>factory</em>: a static method that builds a predicate for you from a value.</p>
${J(String.raw`static <T> Predicate<T> isEqual(Object targetRef) {
    return (null == targetRef)
            ? Objects::isNull                      // decided ONCE, when the test is built
            : object -> targetRef.equals(object);  // here targetRef is certainly not null
}`)}
<p>Notice that the null check happens once, when the test is built, not every time it runs. A simpler version, <code>t -&gt; Objects.equals(targetRef, t)</code>, would repeat that check on every call. Choosing the right lambda up front keeps each check minimal and guarantees <code>equals</code> is never called on <code>null</code>.</p>
${J(String.raw`Predicate<String> isFix = Predicate.isEqual("FIX");
products.stream().filter(isFix).count();

Predicate<String> missing = Predicate.isEqual(null);    // same as Objects::isNull
codes.stream().anyMatch(missing);

// The parameter is Object, so tell Java the type when it cannot guess it
var p = Predicate.<Product>isEqual(Product.FIX);`)}
<p>It uses the target's own <code>equals</code> method. For <code>BigDecimal</code>, <code>equals</code> also compares the number of decimals, so 3.5 and 3.50 are not equal:</p>
${J(String.raw`Predicate.isEqual(new BigDecimal("3.5")).test(new BigDecimal("3.50"));   // false: different scale
// To compare the numbers only, use compareTo:
Predicate<BigDecimal> is35 = r -> r.compareTo(new BigDecimal("3.5")) == 0;   // true for 3.50`)}

<h2>Where predicates are used: Stream</h2>
<p>The second file you shared, <code>Stream.java</code>, accepts a <code>Predicate</code> in seven places. Each asks the same yes/no question about an item but does something different with the answer:</p>
<div class="table-wrap"><table>
<thead><tr><th>Method</th><th>Kind</th><th>What it does with each answer</th><th>Stops early?</th><th>Empty stream gives</th></tr></thead>
<tbody>
<tr><td><code>filter</code></td><td>step</td><td>Keeps the item when true</td><td>No, checks every item</td><td>empty</td></tr>
<tr><td><code>takeWhile</code> (9)</td><td>step</td><td>Keeps items while true; at the first false, ends the stream</td><td>Yes, at the first false</td><td>empty</td></tr>
<tr><td><code>dropWhile</code> (9)</td><td>step</td><td>Skips items while true; from the first false on, keeps everything without checking</td><td>Stops <em>checking</em> at the first false</td><td>empty</td></tr>
<tr><td><code>anyMatch</code></td><td>final</td><td>\"Is there at least one?\"</td><td>Yes, at the first true</td><td><code>false</code></td></tr>
<tr><td><code>allMatch</code></td><td>final</td><td>\"Do all of them pass?\"</td><td>Yes, at the first false</td><td><code>true</code></td></tr>
<tr><td><code>noneMatch</code></td><td>final</td><td>\"Does none of them pass?\"</td><td>Yes, at the first true</td><td><code>true</code></td></tr>
<tr><td><code>iterate(seed, hasNext, next)</code> (9)</td><td>source</td><td>Like a for-loop condition: keep producing while true</td><td>Ends at the first false</td><td>empty if the first value fails</td></tr>
</tbody></table></div>
<p>The last column follows from plain logic. \"Is there a matching item?\" is <em>no</em> when there are no items. \"Does every item match?\" is <em>yes</em>, because nobody can point at an item that fails.</p>
${J(String.raw`List<Payment> history = List.of(onTime1, onTime2, late3, onTime4);   // in date order
Predicate<Payment> onTime = Payment::onTime;

history.stream().filter(onTime).toList();      // [onTime1, onTime2, onTime4]  every item checked
history.stream().takeWhile(onTime).toList();   // [onTime1, onTime2]           "on time until the first late one"
history.stream().dropWhile(onTime).toList();   // [late3, onTime4]            "everything from the first late one"

history.stream().anyMatch(onTime.negate());    // true, after checking 3 items
history.stream().allMatch(onTime);             // false, after checking 3 items

// iterate with a predicate as the loop condition, like: for (d = start; d.isBefore(end); d = d.plusMonths(1))
Stream.iterate(start, d -> d.isBefore(end), d -> d.plusMonths(1))
      .forEach(this::bookInterest);`)}
<p>Outside <code>Stream</code>, the same type is used by <code>Collection.removeIf</code>, <code>Optional.filter</code>, <code>Collectors.partitioningBy</code> and <code>Collectors.filtering</code> (Java 9). Learn it once, use it everywhere.</p>

<h2>Try it: the predicate lab</h2>
<p>Build a test from the four building blocks below, choose what uses it, and watch which <code>test()</code> calls actually run. Swap the order of two tests: the number of calls changes, but the result stays the same.</p>
<div class="lab" id="predLab"></div>

<h2>Behind the scenes</h2>
<p>Each <code>and</code>, <code>or</code> and <code>negate</code> creates one small object that remembers its inputs. A combined predicate is therefore a little tree of objects, and calling <code>test</code> walks that tree. The JVM's optimiser usually flattens such small calls, so a combined predicate runs about as fast as a hand-written <code>if</code>.</p>
<h3>Building one test from a list of rules</h3>
<p>Because combining returns a predicate, you can fold a whole list of rules into one. You need a starting value that changes nothing, just as 0 is the start for adding up numbers. For \"and\", that start is \"always true\". For \"or\", it is \"always false\".</p>
${J(String.raw`List<Predicate<Loan>> rules = List.of(
        Loan::isActive,
        l -> l.amount() > 100_000,
        l -> l.product() == Product.FIX);

Predicate<Loan> all = rules.stream().reduce(x -> true,  Predicate::and);   // every rule passes
Predicate<Loan> any = rules.stream().reduce(x -> false, Predicate::or);    // at least one passes

// With an empty list of rules, 'all' is x -> true, which matches allMatch on an empty stream.`)}
<p>This is handy when the rules come from configuration instead of code, for example which loans a rate change applies to.</p>
<h3>Versions for plain numbers and for two values</h3>
<p><code>IntPredicate</code>, <code>LongPredicate</code> and <code>DoublePredicate</code> work on plain numbers, so <code>IntStream.filter</code> avoids wrapping each number in an object. <code>BiPredicate&lt;T, U&gt;</code> tests two values at once; it has <code>and</code>, <code>or</code> and <code>negate</code>, but no <code>not</code> or <code>isEqual</code>.</p>

<h2>Common mistakes</h2>
<ul class="traps">
<li>The order inside <code>and</code>/<code>or</code> matters when a test can crash or is slow. A null check on the right side protects nothing.</li>
<li><code>Loan::isActive.negate()</code> and <code>Loan::isActive.and(...)</code> do not compile. Store the method reference in a <code>Predicate</code> variable first, or use <code>Predicate.not</code>.</li>
<li><code>a.and(b).or(c)</code> means <code>(a &amp;&amp; b) || c</code>. If you meant <code>a &amp;&amp; (b || c)</code>, write <code>a.and(b.or(c))</code>.</li>
<li>A predicate passed to a stream should not remember anything between calls. Tricks like a \"distinct by key\" predicate with a <code>Set</code> inside work on one thread, but give unpredictable results in a parallel stream.</li>
<li><code>takeWhile</code> and <code>dropWhile</code> only make sense on ordered data. On a <code>HashSet</code> the result can change from run to run.</li>
<li><code>isEqual</code> uses <code>equals</code>, so <code>BigDecimal</code> values with different numbers of decimals do not match.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>A <code>Predicate</code> is a stored yes/no test. <code>and</code>, <code>or</code> and <code>negate</code> build new tests without running anything.</li>
<li>They stop early like <code>&amp;&amp;</code> and <code>||</code>, so put guards and cheap tests on the left.</li>
<li>Use <code>Predicate.not(...)</code> to negate a method reference.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why does <code>Predicate.not</code> exist when <code>negate()</code> already does the same thing?","A method reference such as <code>String::isBlank</code> has no type until Java sees where it is used, so you cannot call <code>negate()</code> on it. Passing it as an argument to a static method gives it a type, so <code>not(String::isBlank)</code> compiles.")}
${Q("<code>p = a.and(b).or(c)</code>. For an item where a is true, b is false and c is true, which tests run and what is the result?","a runs (true), so b must run (false). The <code>and</code> part is therefore false, so c must run (true). Three tests run and the result is true.")}
${Q("Why does <code>and</code> call <code>requireNonNull(other)</code> immediately instead of letting <code>other.test</code> crash later?","So the error appears on the line that made the mistake. Otherwise the combined test would be created without complaint and crash only when used, possibly much later and elsewhere. Because <code>and</code> stops early, the <code>null</code> might even be reached only for a few items, hiding the bug for a long time.")}
${Q("What does <code>allMatch</code> return on an empty stream, and why is that logical?","<code>true</code>. \"Every item passes\" is only false if you can point at an item that fails, and an empty stream has none. For the same reason, combining an empty list of rules with <code>and</code> starts from \"always true\".")}
${Q("Why does <code>isEqual</code> check for null once, when the test is built, instead of using <code>t -&gt; Objects.equals(targetRef, t)</code>?","The value you compare against never changes, so checking it for null every time is wasted work. Deciding once which lambda to return keeps each check as small as possible, and makes sure <code>equals</code> is never called on null.")}
`});

/* ---------- Predicate lab (runs after the lesson is rendered) ---------- */
function mountPredicateLab(el){
  if (!el) return;
  const LOANS = [
    {id:"L1", product:"FIX", amount:250000, status:"ACTIVE",  rate:3.8},
    {id:"L2", product:"VAR", amount:420000, status:"ACTIVE",  rate:4.6},
    {id:"L3", product:"FIX", amount:510000, status:"CLOSED",  rate:3.2},
    {id:"L4", product:"VAR", amount:180000, status:"ACTIVE",  rate:4.3},
    {id:"L5", product:"FIX", amount:330000, status:"ARREARS", rate:4.9},
    {id:"L6", product:"FIX", amount:120000, status:"ACTIVE",  rate:3.5},
    {id:"L7", product:"VAR", amount:600000, status:"CLOSED",  rate:5.1},
    {id:"L8", product:"FIX", amount:400000, status:"ACTIVE",  rate:4.1}
  ];
  const ATOMS = {
    active:   {code:"l -> l.status() == ACTIVE", fn:l => l.status === "ACTIVE"},
    large:    {code:"l -> l.amount() > 300_000", fn:l => l.amount > 300000},
    fixed:    {code:"l -> l.product() == FIX",   fn:l => l.product === "FIX"},
    highRate: {code:"l -> l.rate() > 4.0",        fn:l => l.rate > 4.0}
  };
  const TERMINALS = ["filter","anyMatch","allMatch","noneMatch","takeWhile","dropWhile"];
  const names = Object.keys(ATOMS);
  const opt = (vals, sel) => vals.map(v => `<option value="${v}"${v===sel?" selected":""}>${v}</option>`).join("");
  const term = (n, atom, show=true) => `
    <span class="lab-term" id="lab-term${n}" ${show?"":"hidden"}>
      <label class="lab-not"><input type="checkbox" id="lab-not${n}"> not</label>
      <select id="lab-atom${n}" aria-label="Test ${n}">${opt(names, atom)}</select>
    </span>`;

  el.innerHTML = `
    <div class="lab-defs">${J(names.map(n => `Predicate<Loan> ${n.padEnd(8)} = ${ATOMS[n].code};`).join("\n"), "The four building blocks")}</div>
    <div class="lab-controls">
      <div class="lab-row">
        ${term(1,"active")}
        <select id="lab-op1" aria-label="First combinator">${opt(["and","or"],"and")}</select>
        ${term(2,"large")}
        <select id="lab-op2" aria-label="Second combinator">${opt(["(none)","and","or"],"(none)")}</select>
        ${term(3,"highRate",false)}
      </div>
      <div class="lab-row">
        <label class="lab-not"><input type="checkbox" id="lab-negall"> .negate() the whole thing</label>
        <label class="lab-sel">Consumed by <select id="lab-terminal">${opt(TERMINALS,"filter")}</select></label>
      </div>
    </div>
    <div id="lab-code"></div>
    <p class="lab-summary" id="lab-summary" aria-live="polite"></p>
    <div class="table-wrap"><table class="lab-table">
      <thead><tr><th>Loan</th><th>Product</th><th>Amount</th><th>Status</th><th>Rate</th><th>test() calls, in order</th><th>p.test</th><th>Outcome</th></tr></thead>
      <tbody id="lab-body"></tbody>
    </table></div>`;

  const $l = id => el.querySelector("#" + id);

  function build(){
    const atomNode = n => {
      const node = {kind:"atom", name:$l("lab-atom"+n).value};
      return $l("lab-not"+n).checked ? {kind:"not", x:node} : node;
    };
    let p = {kind:$l("lab-op1").value, a:atomNode(1), b:atomNode(2)};
    const op2 = $l("lab-op2").value;
    if (op2 !== "(none)") p = {kind:op2, a:p, b:atomNode(3)};
    if ($l("lab-negall").checked) p = {kind:"negate", x:p};
    return p;
  }
  function code(n){
    switch (n.kind){
      case "atom": return n.name;
      case "not": return `not(${code(n.x)})`;
      case "negate": return `${code(n.x)}.negate()`;
      default: {
        const right = n.b.kind === "and" || n.b.kind === "or" ? code(n.b) : code(n.b);
        return `${code(n.a)}.${n.kind}(${right})`;
      }
    }
  }
  function atomsIn(n, out=[]){
    if (n.kind === "atom") out.push(n.name);
    else if (n.x) atomsIn(n.x, out);
    else { atomsIn(n.a, out); atomsIn(n.b, out); }
    return out;
  }
  function evaluate(n, loan, trace){
    switch (n.kind){
      case "atom": { const v = ATOMS[n.name].fn(loan); trace.push({name:n.name, v}); return v; }
      case "not": case "negate": return !evaluate(n.x, loan, trace);
      case "and": {
        if (!evaluate(n.a, loan, trace)) { atomsIn(n.b).forEach(name => trace.push({name, skip:true})); return false; }
        return evaluate(n.b, loan, trace);
      }
      case "or": {
        if (evaluate(n.a, loan, trace)) { atomsIn(n.b).forEach(name => trace.push({name, skip:true})); return true; }
        return evaluate(n.b, loan, trace);
      }
    }
  }

  function run(){
    $l("lab-term3").hidden = $l("lab-op2").value === "(none)";
    const p = build(), t = $l("lab-terminal").value;
    const pc = code(p);
    const tail = {filter:".filter(p).toList()", anyMatch:".anyMatch(p)", allMatch:".allMatch(p)", noneMatch:".noneMatch(p)", takeWhile:".takeWhile(p).toList()", dropWhile:".dropWhile(p).toList()"}[t];
    $l("lab-code").innerHTML = J(`Predicate<Loan> p = ${pc};\nvar result = loans.stream()${tail};`, "Equivalent Java");

    let calls = 0, tested = 0, stopped = false, dropping = true, result = null;
    const kept = [];
    const rows = LOANS.map((loan, i) => {
      const r = {loan, trace:[], val:null, outcome:"", cls:""};
      if (stopped){ r.outcome = "not reached"; r.cls = "lab-off"; return r; }
      if (t === "dropWhile" && !dropping){ r.outcome = "kept, not tested"; r.cls = "lab-pass"; kept.push(loan.id); return r; }
      r.val = evaluate(p, loan, r.trace);
      tested++; calls += r.trace.filter(x => !x.skip).length;
      switch (t){
        case "filter":    r.outcome = r.val ? "kept" : "dropped"; if (r.val) kept.push(loan.id); break;
        case "anyMatch":  if (r.val){ r.outcome = "match found: stop"; stopped = true; result = true; } else r.outcome = "keep looking"; break;
        case "allMatch":  if (!r.val){ r.outcome = "counter-example: stop"; stopped = true; result = false; } else r.outcome = "keep checking"; break;
        case "noneMatch": if (r.val){ r.outcome = "a match exists: stop"; stopped = true; result = false; } else r.outcome = "keep checking"; break;
        case "takeWhile": if (r.val){ r.outcome = "kept"; kept.push(loan.id); } else { r.outcome = "first false: stream ends"; stopped = true; } break;
        case "dropWhile": if (r.val){ r.outcome = "dropped"; } else { r.outcome = "first false: kept, testing stops"; dropping = false; kept.push(loan.id); } break;
      }
      return r;
    });
    if (result === null){
      if (t === "anyMatch") result = false;
      if (t === "allMatch" || t === "noneMatch") result = true;
    }
    const max = LOANS.length * atomsIn(p).length;
    const outcome = ["filter","takeWhile","dropWhile"].includes(t) ? `[${kept.join(", ")}]` : String(result);
    $l("lab-summary").innerHTML = `Result: <code>${outcome}</code>. Elements tested: <b>${tested}</b> of ${LOANS.length}. Building-block <code>test()</code> calls: <b>${calls}</b> of ${max} possible.`;

    const chip = x => x.skip ? `<span class="chip skip">${x.name}</span>` : `<span class="chip ${x.v?"yes":"no"}">${x.name} ${x.v?"✓":"✗"}</span>`;
    $l("lab-body").innerHTML = rows.map(r => `
      <tr class="${r.cls}">
        <td><b>${r.loan.id}</b></td><td>${r.loan.product}</td><td class="num">${r.loan.amount.toLocaleString("en-US")}</td><td>${r.loan.status}</td><td class="num">${r.loan.rate.toFixed(1)}%</td>
        <td><div class="chips">${r.trace.map(chip).join("") || "<span class='muted'>none</span>"}</div></td>
        <td>${r.val === null ? "<span class='muted'>–</span>" : `<span class="chip ${r.val?"yes":"no"}">${r.val}</span>`}</td>
        <td>${r.outcome}</td>
      </tr>`).join("");
  }
  el.addEventListener("change", run);
  run();
}

id:"j8-stream-iter", track:"java8", title:"Streams vs iterators", since:"JDK 1.2 / 8", jep:null,
lede:"With an iterator, your code asks for one item at a time and decides what to do with it. With a stream, you describe what you want and Java feeds the items through for you. Same data, opposite direction of control.",
mount(root){ mountStreamSim(root.querySelector("#streamSim")); },
html:`
${W([
 ["Iterator","An object that walks through a collection for you. You ask <code>hasNext()</code> (\"is there more?\") and <code>next()</code> (\"give me the next one\")."],
 ["Pull","Your code asks for each item. You are in charge of the loop."],
 ["Push","The library hands each item to your code. The library is in charge of the loop."],
 ["Call stack","The list of methods currently running, each one called by the one below it. The top one is running right now."],
 ["Short-circuit","Stopping early because the answer is already known, such as after <code>limit(2)</code> has its 2 items."]
])}
<h2>The problem</h2>
<p>There are only two ways to visit every item in a collection. A kitchen comparison helps:</p>
<ul>
<li><strong>Pull</strong>: you walk to the shelf, take one ingredient, prepare it, then go back for the next one. You decide everything, including when to stop.</li>
<li><strong>Push</strong>: you hand a recipe to a kitchen assistant. The assistant brings each ingredient to each station in turn. You only described what should happen to each one.</li>
</ul>
<p>An <code>Iterator</code> (Java 1.2) is the pull model. Even the normal for-each loop is just a shorter way to write it:</p>
${J(String.raw`for (Loan l : loans) { process(l); }

// is turned by the compiler into exactly this
for (Iterator<Loan> it = loans.iterator(); it.hasNext(); ) {
    Loan l = it.next();
    process(l);
}`,"A for-each loop is an Iterator in disguise")}
<p>Being in charge of the loop gives you full freedom: <code>break</code>, <code>continue</code>, <code>return</code>, throwing checked exceptions, and changing as many local variables as you like. The downside: Java learns nothing about what you are trying to do. It cannot combine steps, stop early for you, or spread the work over several CPU cores. All it sees is a series of <code>next()</code> calls.</p>
<p>A <code>Stream</code> (Java 8) is the push model. You describe the whole job first. Because Java sees the full description before anything runs, it can choose how to run it: in one pass instead of many, stopping as soon as the answer is known, or in parallel.</p>

<h2>Build both from scratch</h2>
<h3>A pull iterator</h3>
<p>An iterator is a bookmark: a position in the data, plus two questions you can ask it.</p>
${J(String.raw`final class ArrayIter<T> implements Iterator<T> {
    private final T[] data;
    private int cursor = 0;                       // the bookmark: everything the iterator remembers

    ArrayIter(T[] data) { this.data = data; }

    public boolean hasNext() { return cursor < data.length; }
    public T next() {
        if (!hasNext()) throw new NoSuchElementException();
        return data[cursor++];                    // hand ONE item back to the caller
    }
}`)}

<h3>A push stream in 40 lines</h3>
<p>Now the other direction. Think of each step as a <strong>station</strong> on an assembly line (the JDK calls it a <em>sink</em>). A station receives an item, does its job, and passes the result to the next station. The final operation builds the last station and tells the source to start sending items.</p>
${J(String.raw`interface Sink<T> {
    void accept(T t);                               // "here is the next item"
    default boolean cancelled() { return false; }   // "I don't need any more items"
}

final class MiniStream<T> {
    // A stream is just: "give me the next station, and I'll push every item into it"
    private final Consumer<Sink<T>> source;
    private MiniStream(Consumer<Sink<T>> source) { this.source = source; }

    static <T> MiniStream<T> of(List<T> list) {
        return new MiniStream<>(sink -> {
            for (T t : list) {
                if (sink.cancelled()) return;          // early-stop check, once per item
                sink.accept(t);
            }
        });
    }

    MiniStream<T> filter(Predicate<T> p) {
        return new MiniStream<>(down -> source.accept(new Sink<T>() {
            public void accept(T t) { if (p.test(t)) down.accept(t); }   // pass it on only if it passes
            public boolean cancelled() { return down.cancelled(); }
        }));
    }

    <R> MiniStream<R> map(Function<T, R> f) {
        return new MiniStream<>(down -> source.accept(new Sink<T>() {
            public void accept(T t) { down.accept(f.apply(t)); }        // change it, then pass it on
            public boolean cancelled() { return down.cancelled(); }
        }));
    }

    MiniStream<T> limit(int n) {
        return new MiniStream<>(down -> {
            int[] left = {n};                          // a fresh counter for every run
            source.accept(new Sink<T>() {
                public void accept(T t) { if (left[0] > 0) { left[0]--; down.accept(t); } }
                public boolean cancelled() { return left[0] == 0 || down.cancelled(); }
            });
        });
    }

    List<T> toList() {                                 // the final step: only HERE does anything run
        List<T> out = new ArrayList<>();
        source.accept(out::add);
        return out;
    }
}

List<Integer> r = MiniStream.of(List.of(3, 8, 1, 12, 5, 9, 4, 15))
        .filter(x -> x > 4).map(x -> x * 10).limit(2).toList();   // [80, 120]`,"Laziness and early stopping come for free from the push design")}
<p>Three behaviours of real streams appear here without any extra code:</p>
<ol>
<li><strong>Nothing runs early.</strong> <code>filter</code>, <code>map</code> and <code>limit</code> only wrap one piece of code inside another. No item moves until <code>toList</code> starts the source.</li>
<li><strong>One item at a time.</strong> The source sends 8 into filter, filter sends it to map, map sends 80 to limit, all before the source even looks at the next item. No in-between lists are created.</li>
<li><strong>Stopping early.</strong> Once limit has let 2 items through, its <code>cancelled()</code> answers true. The source asks before each item, and stops.</li>
</ol>
<p>Compare the call stack (the chain of methods currently running) at the moment your <code>map</code> code runs. With a stream, your lambda is on top, but Java's own methods sit between it and your <code>main</code>. With an iterator, your loop is always in charge and <code>next()</code> simply returns to it.</p>
${J(String.raw`// Push (stream): Java calls your code
main → toList → source loop → filter station(8) → map station(8) → your lambda: 8 * 10

// Pull (iterator): your code calls Java, and Java returns to you
main: your while loop → it.next()   ← returns 8, then your loop continues`)}

<h3>What the real JDK adds</h3>
<p>The JDK uses the same shape, with two richer interfaces:</p>
<ul>
<li><code>Spliterator</code> is the source. <code>tryAdvance</code> sends one item; <code>forEachRemaining</code> sends all of them. <code>trySplit</code> hands half of the remaining items to a second spliterator, which is what makes <code>parallel()</code> possible. It can also report facts such as \"I know my size\" or \"my items are sorted\", which lets Java skip work.</li>
<li><code>Sink</code> is the station. It has <code>begin(size)</code>, <code>accept(item)</code>, <code>end()</code> and <code>cancellationRequested()</code>. <code>begin</code> and <code>end</code> exist for steps like <code>sorted</code>: it collects items in <code>accept</code>, then sorts and sends them on in <code>end</code>.</li>
<li>If any step can stop early (<code>limit</code>, <code>findFirst</code>, <code>anyMatch</code>, <code>takeWhile</code>), Java sends items one by one with <code>tryAdvance</code> and asks <code>cancellationRequested()</code> in between. If none can, it calls <code>forEachRemaining</code> and never asks.</li>
</ul>

<h2>Side by side</h2>
<div class="table-wrap"><table>
<thead><tr><th></th><th>Iterator</th><th>Stream</th></tr></thead>
<tbody>
<tr><td>Who runs the loop</td><td>Your code asks with <code>hasNext</code>/<code>next</code></td><td>Java sends items into your lambdas</td></tr>
<tr><td>What you write</td><td>How to loop, step by step</td><td>What result you want</td></tr>
<tr><td>When work happens</td><td>Each time you call <code>next()</code></td><td>Only when the final operation runs</td></tr>
<tr><td>Stopping early</td><td><code>break</code> or <code>return</code>, anywhere</td><td>Only through early-stop steps: <code>limit</code>, <code>findFirst</code>, <code>anyMatch</code>, <code>takeWhile</code></td></tr>
<tr><td>Using it again</td><td>One pass; ask the collection for a new iterator</td><td>Once only, then <code>IllegalStateException</code></td></tr>
<tr><td>Changing the collection while looping</td><td><code>it.remove()</code> is the only safe way</td><td>Never allowed</td></tr>
<tr><td>Checked exceptions, changing local variables</td><td>Allowed: it is your own code</td><td>Not inside lambdas</td></tr>
<tr><td>Running in parallel</td><td>Impossible: one bookmark, one position</td><td><code>parallel()</code> splits the work with <code>trySplit</code></td></tr>
<tr><td>Sorting, removing duplicates, grouping</td><td>You write it yourself</td><td>Built in: <code>sorted</code>, <code>distinct</code>, collectors</td></tr>
<tr><td>Plain numbers</td><td><code>Iterator&lt;Integer&gt;</code> wraps each number in an object</td><td><code>IntStream</code>, <code>LongStream</code>, <code>DoubleStream</code></td></tr>
<tr><td>Debugging</td><td>Simple: step through your own loop</td><td>Harder: many Java methods in the stack. Put a breakpoint inside the lambda, or use <code>peek</code>.</td></tr>
</tbody></table></div>

        Spliterators.spliteratorUnknownSize(legacyIterator, Spliterator.ORDERED), false);

<p><code>stream.iterator()</code> turns push back into pull. To do that, Java runs the stations for one source item at a time and keeps whatever comes out in a small buffer, because one source item can produce no results (<code>filter</code>) or many (<code>flatMap</code>).</p>

<h2>Simulation: watch a stream run</h2>
<p>Choose how the work is run and which steps to use, then press <strong>Step</strong> or <strong>Play</strong>. Watch three things: the order in which values move, the call stack (who is calling whom), and which source items are never read at all.</p>
<div id="streamSim"></div>
<p>Things to try:</p>
<ol>
<li><strong>Stream</strong> with filter, map and limit(2): only 4 of the 8 numbers are read, and your lambdas run 6 times. 5, 9, 4 and 15 are never touched.</li>
<li>Turn on <strong>sorted()</strong>: now all 8 are read and the lambdas run 13 times. <code>sorted</code> cannot hand out its smallest value until it has seen every value, so the early stop from <code>limit</code> cannot reach the source.</li>
<li>Switch to <strong>Eager</strong> with sorted off: the result is the same <code>[80, 120]</code>, but your code runs 13 times and three values are thrown away after being filtered and mapped. JavaScript's <code>array.filter().map()</code> and Kotlin's <code>List.filter</code> work this way.</li>
<li>Switch to <strong>Iterator loop</strong>: values move in the same order as the stream, and the same 4 numbers are read. The difference is in the call stack: your loop is always at the bottom and in charge.</li>
<li>Choose <strong>anyMatch</strong>: the stream stops as soon as one value passes the test.</li>
</ol>

<h2>When to use which</h2>
<ul>
<li>Use a stream when the job is a chain of \"keep some, change each, add up or group\".</li>
<li>Use a loop when the control flow is the point: breaking out of nested loops, updating several results at once, working with positions (indexes), or code that throws checked exceptions.</li>
<li>Use an iterator directly only when you need <code>remove()</code> while looping, or when you are writing your own data structure.</li>
</ul>

<h2>Common mistakes</h2>
<ul class="traps">
<li>A stream can only be used once. Keep the collection, or a <code>Supplier&lt;Stream&lt;T&gt;&gt;</code>, if you need two passes.</li>
<li>Calling <code>next()</code> without checking <code>hasNext()</code> first throws <code>NoSuchElementException</code> at the end.</li>
<li>Code with side effects inside <code>map</code> or <code>filter</code> may run for fewer items than you expect, or not at all, because streams stop early and skip work.</li>
<li>An <code>Iterable</code> made from <code>stream::iterator</code> fails on the second for-each loop.</li>
<li><code>Files.lines()</code> keeps a file open. Close the stream with try-with-resources.</li>
<li>Removing an item inside a for-each loop does not always throw. Removing the second-to-last item often \"works\" because the loop ends before the check runs. Do not rely on it.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>Iterator = pull: your loop asks for each item and is in charge.</li>
<li>Stream = push: you describe the steps, and Java sends each item through them.</li>
<li>Streams do nothing until the final step, handle one item at a time, and can stop early.</li>
<li><code>sorted</code> must see every item first, so it blocks early stopping.</li>
</ul>

/* ---------- Stream simulation ---------- */
function mountStreamSim(el){
  if (!el) return;
  const SRC = [3, 8, 1, 12, 5, 9, 4, 15];
  const ORDER = ["filter", "map", "sorted", "limit"];
  const STG = {
    filter:{call:"filter(x -> x > 4)", op:"x -> x > 4"},
    map:   {call:"map(x -> x * 10)",   op:"x -> x * 10"},
    sorted:{call:"sorted()",           op:"natural order"},
    limit: {call:"limit(2)",           op:"first 2"}
  };
  const TERM = {
    toList:   {call:"toList()"},
    findFirst:{call:"findFirst()"},
    anyMatch: {call:"anyMatch(v -> v > 100)"}
  };
  const TAG = {pass:"passed on", drop:"dropped", hold:"held", stop:"stop", emit:"sorted", read:"read", info:"start"};
  const F = (t, you) => ({t, you:!!you});
  const cfg = {mode:"stream", on:{filter:true, map:true, sorted:false, limit:true}, term:"toList"};

  function rec(){
    const E = {ev:[], out:[], buf:[], res:undefined};
    E.emit = e => { e.snapOut = E.out.slice(); e.snapBuf = E.buf.slice(); e.snapRes = E.res; E.ev.push(e); };
    return E;
  }
  function fmt(mode, T, out, res){
    if (T === "toList") return "[" + out.join(", ") + "]";
    if (T === "findFirst") return mode === "stream" ? (res === undefined ? "Optional.empty" : "Optional[" + res + "]") : (res === undefined ? "null" : String(res));
    return String(!!res);
  }
  function finish(E, mode, T, code, line){
    const read = E.ev.some(e => e.readAll) ? SRC.length : E.ev.filter(e => e.readIdx != null).length;
    const calls = E.ev.filter(e => e.lambda).length;
    const result = fmt(mode, T, E.out, E.res);
    E.emit({stage:"done", final:true, result, count:false, line, stack:[],
      text:`Done. result = ${result}. ${read} of ${SRC.length} source elements were read, and your ${mode === "stream" ? "lambdas" : "code"} ran ${calls} times.`});
    return {ev:E.ev, code, result};
  }

  /* ---- lazy push pipeline, modelled on the JDK's sink chain ---- */
  function genStream(on){
    const E = rec(), T = cfg.term, sc = cfg.on.limit || T !== "toList";
    const decl = {toList:"List<Integer> result = ", findFirst:"Optional<Integer> result = ", anyMatch:"boolean result = "}[T];
    const code = [decl + "Stream.of(3, 8, 1, 12, 5, 9, 4, 15)"], line = {};
    on.forEach(k => { line[k] = code.length; code.push("        ." + STG[k].call); });
    line.term = code.length; code.push("        ." + TERM[T].call + ";");
    const base = [F("main: result = ...." + TERM[T].call, true),
                  F(sc ? "copyIntoWithCancel: tryAdvance loop" : "copyInto: spliterator.forEachRemaining")];
    let left = 2, found = false, matched = false;

    E.emit({stage:"term", verdict:"info", count:false, brief:"starts the run", line:line.term, stack:[F("main: calls " + TERM[T].call, true)],
      text:`Building the pipeline only linked the stages together. No element has been read yet. Calling ${TERM[T].call} is what starts the source.`});

    const cancelled = i => {
      if (i >= on.length) return T === "findFirst" ? found : T === "anyMatch" ? matched : false;
      if (on[i] === "sorted") return false;
      if (on[i] === "limit") return left === 0 || cancelled(i + 1);
      return cancelled(i + 1);
    };
    function push(i, v, st){
      if (i >= on.length){
        const fr = st.concat(F(`terminal sink.accept(${v})`));
        if (T === "toList"){
          E.out.push(v);
          E.emit({stage:"term", value:v, verdict:"pass", brief:`add(${v})`, line:line.term, stack:fr.concat(F(`ArrayList.add(${v})`)), text:`toList adds ${v} to the result list.`});
        } else if (T === "findFirst"){
          found = true; E.res = v;
          E.emit({stage:"term", value:v, verdict:"stop", brief:`keeps ${v}`, line:line.term, stack:fr, text:`findFirst keeps ${v}. From now on its cancellationRequested() returns true.`});
        } else {
          const r = v > 100;
          if (r){ matched = true; E.res = true; }
          E.emit({stage:"term", value:v, got:r, verdict:r ? "stop" : "drop", lambda:true, brief:`${v} > 100 → ${r}`, line:line.term,
            stack:fr.concat(F(`your lambda: ${v} > 100 → ${r}`, true)),
            text: r ? `anyMatch tests ${v} > 100: true. It has its answer, so cancellationRequested() now returns true.` : `anyMatch tests ${v} > 100: false. It needs more elements.`});
        }
        return;
      }
      const k = on[i], fr = st.concat(F(`${k} sink.accept(${v})`));
      if (k === "filter"){
        const r = v > 4;
        E.emit({stage:k, value:v, got:r, verdict:r ? "pass" : "drop", lambda:true, brief:`${v} > 4 → ${r}`, line:line[k],
          stack:fr.concat(F(`your lambda: ${v} > 4 → ${r}`, true)),
          text: r ? `filter: ${v} > 4 is true, so filter pushes ${v} into the next stage.` : `filter: ${v} > 4 is false. ${v} is dropped and control goes back to the source.`});
        if (r) push(i + 1, v, fr);
      } else if (k === "map"){
        const r = v * 10;
        E.emit({stage:k, value:v, got:r, verdict:"pass", lambda:true, brief:`${v} → ${r}`, line:line[k],
          stack:fr.concat(F(`your lambda: ${v} * 10 → ${r}`, true)), text:`map turns ${v} into ${r} and pushes it into the next stage.`});
        push(i + 1, r, fr);
      } else if (k === "sorted"){
        E.buf.push(v);
        E.emit({stage:k, value:v, verdict:"hold", brief:`holds ${v}`, line:line[k], stack:fr.concat(F(`buffer.add(${v})`)),
          text:`sorted puts ${v} in its buffer. It cannot pass anything on until it has seen every element.`});
      } else if (k === "limit"){
        if (left > 0){
          left--;
          E.emit({stage:k, value:v, verdict:"pass", brief:`${v} (${2 - left} of 2)`, line:line[k], stack:fr,
            text: left === 0 ? `limit lets ${v} through. That is the 2nd, so limit's cancellationRequested() now returns true.` : `limit lets ${v} through (1 of 2).`});
          push(i + 1, v, fr);
        } else {
          E.emit({stage:k, value:v, verdict:"drop", brief:`${v} ignored`, line:line[k], stack:fr, text:`limit has already passed 2 elements, so ${v} is ignored.`});
        }
      }
    }

    for (let j = 0; j < SRC.length; j++){
      if (sc && cancelled(0)){
        E.emit({stage:"source", verdict:"stop", count:false, brief:"cancelled", line:0, stack:base.concat(F("cancellationRequested() → true")),
          text:`Before reading ${SRC[j]}, the loop asks cancellationRequested(). The answer is true, so the source stops. ${SRC.slice(j).join(", ")} are never read.`});
        break;
      }
      const v = SRC[j], fr = base.concat(F(sc ? `tryAdvance() reads ${v}` : `forEachRemaining reads ${v}`));
      E.emit({stage:"source", value:v, readIdx:j, verdict:"read", brief:`reads ${v}`, line:0, stack:fr, text:`The source reads ${v} and pushes it into the first stage.`});
      push(0, v, fr);
    }
    if (cfg.on.sorted){
      const s = on.indexOf("sorted"), sorted = E.buf.slice().sort((a, b) => a - b);
      E.buf = sorted.slice();
      const st = base.concat(F("sorted sink.end()"));
      E.emit({stage:"sorted", verdict:"emit", count:false, brief:`[${sorted.join(", ")}]`, line:line.sorted, stack:st,
        text:`The source is exhausted, so end() reaches sorted. It sorts its buffer into [${sorted.join(", ")}] and now pushes the values downstream in order.`});
      for (let q = 0; q < sorted.length; q++){
        if (cancelled(s + 1)){
          E.emit({stage:"sorted", verdict:"stop", count:false, brief:"downstream done", line:line.sorted, stack:st,
            text:`The next stage reports cancellationRequested() = true, so sorted stops. ${sorted.slice(q).join(", ")} stay in the buffer.`});
          break;
        }
        E.buf = sorted.slice(q + 1);
        push(s + 1, sorted[q], st);
      }
    }
    return finish(E, "stream", T, code, line.term);
  }

  /* ---- a hand-written Iterator loop that computes the same result ---- */
  function genIter(){
    const E = rec(), T = cfg.term, on = cfg.on, code = [], L = {};
    const put = (k, s) => { if (k) L[k] = code.length; code.push(s); };
    const decl = {toList:"List<Integer> result = new ArrayList<>();", findFirst:"Integer result = null;", anyMatch:"boolean result = false;"}[T];
    const termLine = {toList:"result.add(x);", findFirst:"result = x; break;", anyMatch:"if (x > 100) { result = true; break; }"}[T];
    const body = () => { put("term", "    " + termLine); if (on.limit) put("limit", "    if (++taken == 2) break;   // limit(2)"); };
    put("it", "Iterator<Integer> it = source.iterator();");
    if (on.sorted) put("buf", "List<Integer> buffer = new ArrayList<>();");
    else { put("decl", decl); if (on.limit) put("taken", "int taken = 0;"); }
    put("while", "while (it.hasNext()) {");
    put("next", "    int x = it.next();");
    if (on.filter) put("filter", "    if (!(x > 4)) continue;   // filter");
    if (on.map) put("map", "    x = x * 10;               // map");
    if (on.sorted) put("sorted", "    buffer.add(x);            // sorted needs everything first");
    else body();
    put(null, "}");
    if (on.sorted){
      put("sort", "Collections.sort(buffer);");
      put("decl", decl); if (on.limit) put("taken", "int taken = 0;");
      put("for2", "for (int x : buffer) {");
      body();
      put(null, "}");
    }
    let taken = 0;
    const rest = (j, second) => second ? "The rest of the sorted buffer is skipped."
      : (j + 1 < SRC.length ? `Your loop stops, so ${SRC.slice(j + 1).join(", ")} are never read.` : "That was the last element anyway.");
    function termStep(x, st, j, second){
      if (T === "toList"){
        E.out.push(x);
        E.emit({stage:"term", value:x, verdict:"pass", brief:`add(${x})`, line:L.term, stack:st, text:`Your code calls result.add(${x}).`});
      } else if (T === "findFirst"){
        E.res = x;
        E.emit({stage:"term", value:x, verdict:"stop", brief:`result = ${x}`, line:L.term, stack:st, text:`result = ${x}; break. ${rest(j, second)}`});
        return true;
      } else {
        const r = x > 100;
        E.emit({stage:"term", value:x, got:r, verdict:r ? "stop" : "drop", lambda:true, brief:`${x} > 100 → ${r}`, line:L.term, stack:st,
          text: r ? `${x} > 100 is true: result = true; break. ${rest(j, second)}` : `${x} > 100 is false, so the loop goes on.`});
        if (r){ E.res = true; return true; }
      }
      if (on.limit){
        taken++;
        if (taken === 2){
          E.emit({stage:"limit", value:x, verdict:"stop", brief:"taken = 2", line:L.limit, stack:st, text:`++taken is 2, so break. ${rest(j, second)}`});
          return true;
        }
        E.emit({stage:"limit", value:x, verdict:"pass", brief:"taken = 1", line:L.limit, stack:st, text:"taken is now 1, so the loop continues."});
      }
      return false;
    }
    const st = [F("main: your while loop", true)];
    let broke = false;
    for (let j = 0; j < SRC.length && !broke; j++){
      const v = SRC[j];
      E.emit({stage:"source", value:v, readIdx:j, verdict:"read", brief:`next() → ${v}`, line:L.next,
        stack:[F("main: your while loop", true), F(`ArrayList$Itr.next() → returns ${v}`)],
        text:`Your loop calls it.hasNext(), which is true, then it.next(), which returns ${v} to your code.`});
      let x = v;
      if (on.filter){
        const r = x > 4;
        E.emit({stage:"filter", value:x, got:r, verdict:r ? "pass" : "drop", lambda:true, brief:`${x} > 4 → ${r}`, line:L.filter, stack:st,
          text: r ? `Your if: ${x} > 4 is true, so your loop keeps going with ${x}.` : `Your if: ${x} > 4 is false, so continue jumps back to it.hasNext().`});
        if (!r) continue;
      }
      if (on.map){
        const y = x * 10;
        E.emit({stage:"map", value:x, got:y, verdict:"pass", lambda:true, brief:`${x} → ${y}`, line:L.map, stack:st, text:`Your code sets x = ${x} * 10 = ${y}.`});
        x = y;
      }
      if (on.sorted){
        E.buf.push(x);
        E.emit({stage:"sorted", value:x, verdict:"hold", brief:`buffer.add(${x})`, line:L.sorted, stack:st,
          text:`buffer.add(${x}). To sort, you must keep every element before you can use any of them.`});
        continue;
      }
      if (termStep(x, st, j, false)) broke = true;
    }
    if (!broke) E.emit({stage:"source", verdict:"stop", count:false, brief:"hasNext() → false", line:L.while,
      stack:[F("main: your while loop", true), F("ArrayList$Itr.hasNext() → false")], text:"it.hasNext() returns false, so the while loop ends."});
    if (on.sorted){
      const sorted = E.buf.slice().sort((a, b) => a - b);
      E.buf = sorted.slice();
      E.emit({stage:"sorted", verdict:"emit", count:false, brief:`[${sorted.join(", ")}]`, line:L.sort, stack:[F("main", true), F("Collections.sort(buffer)")],
        text:`Collections.sort(buffer) gives [${sorted.join(", ")}]. Now a second loop walks the sorted buffer.`});
      const st2 = [F("main: your for loop over buffer", true)];
      for (let q = 0; q < sorted.length; q++){
        E.buf = sorted.slice(q + 1);
        if (termStep(sorted[q], st2, q, true)) break;
      }
    }
    return finish(E, "iterator", T, code, L.term);
  }

  /* ---- eager: every stage builds a complete new list ---- */
  function genEager(on){
    const E = rec(), T = cfg.term, code = [], L = {};
    const put = (k, s) => { if (k) L[k] = code.length; code.push(s); };
    put("src", "List<Integer> s0 = List.of(3, 8, 1, 12, 5, 9, 4, 15);");
    let cur = "s0", n = 0, list = SRC.slice();
    E.emit({stage:"source", verdict:"read", readAll:true, count:false, brief:"all 8 in memory", line:L.src, stack:[F("main", true)],
      text:"Eager style: each stage takes a complete list and builds a new complete list. All 8 values are in memory before any stage runs."});
    for (const k of on){
      const nv = "s" + (++n), st = [F("main", true), F(`${k}: full pass over ${cur}`)];
      if (k === "filter"){
        put(null, `List<Integer> ${nv} = new ArrayList<>();`);
        put("filter", `for (int x : ${cur}) if (x > 4) ${nv}.add(x);`);
        const next = [];
        for (const x of list){
          const r = x > 4;
          E.emit({stage:k, value:x, got:r, verdict:r ? "pass" : "drop", lambda:true, brief:`${x} > 4 → ${r}`, line:L.filter, stack:st,
            text: r ? `filter pass: ${x} > 4 is true, so ${x} goes into ${nv}.` : `filter pass: ${x} > 4 is false.`});
          if (r) next.push(x);
        }
        list = next;
      } else if (k === "map"){
        put(null, `List<Integer> ${nv} = new ArrayList<>();`);
        put("map", `for (int x : ${cur}) ${nv}.add(x * 10);`);
        list = list.map(x => {
          E.emit({stage:k, value:x, got:x * 10, verdict:"pass", lambda:true, brief:`${x} → ${x * 10}`, line:L.map, stack:st, text:`map pass: ${x} becomes ${x * 10} in ${nv}.`});
          return x * 10;
        });
      } else if (k === "sorted"){
        put(null, `List<Integer> ${nv} = new ArrayList<>(${cur});`);
        put("sorted", `Collections.sort(${nv});`);
        list = list.slice().sort((a, b) => a - b);
        E.buf = list.slice();
        E.emit({stage:k, verdict:"emit", brief:`[${list.join(", ")}]`, line:L.sorted, stack:st, text:`Sort the whole list: [${list.join(", ")}].`});
      } else if (k === "limit"){
        put("limit", `List<Integer> ${nv} = ${cur}.subList(0, Math.min(2, ${cur}.size()));`);
        const kept = list.slice(0, 2), dropped = list.slice(2);
        E.emit({stage:k, verdict:dropped.length ? "stop" : "pass", brief:`keeps [${kept.join(", ")}]`, line:L.limit, stack:st,
          text: dropped.length ? `subList keeps [${kept.join(", ")}] and throws away [${dropped.join(", ")}]. The work already done on those ${dropped.length} values is wasted.` : `subList keeps all ${kept.length} values.`});
        list = kept;
      }
      cur = nv;
    }
    const st = [F("main", true)];
    if (T === "toList"){
      put("term", `List<Integer> result = ${cur};`);
      E.out = list.slice();
      E.emit({stage:"term", verdict:"pass", brief:`[${list.join(", ")}]`, line:L.term, stack:st, text:`The result is the last list: [${list.join(", ")}].`});
    } else if (T === "findFirst"){
      put("term", `Integer result = ${cur}.isEmpty() ? null : ${cur}.get(0);`);
      E.res = list[0];
      E.emit({stage:"term", verdict:"stop", brief:`get(0) → ${list[0]}`, line:L.term, stack:st, text:`Take the first element of the final list: ${list[0]}. Everything after it was computed for nothing.`});
    } else {
      put(null, "boolean result = false;");
      put("term", `for (int x : ${cur}) if (x > 100) { result = true; break; }`);
      for (const x of list){
        const r = x > 100;
        E.emit({stage:"term", value:x, got:r, verdict:r ? "stop" : "drop", lambda:true, brief:`${x} > 100 → ${r}`, line:L.term, stack:st,
          text: r ? `${x} > 100 is true, so result = true.` : `${x} > 100 is false.`});
        if (r){ E.res = true; break; }
      }
    }
    return finish(E, "eager", T, code, L.term);
  }

  /* ---- UI ---- */

  el.innerHTML = `

    </div>
    <div class="sim-cfg">

  function build(){

  function replay(n){
    const s = {cur:null, read:new Set(), calls:{}, last:{}, lambda:0, finished:false, result:null, out:[], buf:[], res:undefined};
    for (let i = 0; i < n; i++){
      const e = sim.ev[i];
      s.cur = e;
      if (e.readIdx != null) s.read.add(e.readIdx);
      if (e.readAll) SRC.forEach((_, j) => s.read.add(j));
      if (e.stage && e.stage !== "done"){
        if (e.count !== false) s.calls[e.stage] = (s.calls[e.stage] || 0) + 1;
        s.last[e.stage] = e;
      }
      if (e.lambda) s.lambda++;
      s.out = e.snapOut; s.buf = e.snapBuf; s.res = e.snapRes;
      if (e.final){ s.finished = true; s.result = e.result; }

  }
  const chips = (vals, cls) => `<div class="sim-chips">${vals.length ? vals.map(v => `<span class="sim-chip ${cls || ""}">${v}</span>`).join("") : `<span class="muted">empty</span>`}</div>`;

  const calls = n => (n || 0) + ((n || 0) === 1 ? " call" : " calls");
  function boxHTML(k, s){
    const active = s.cur && s.cur.stage === k ? " on" : "";
    if (k === "source"){
      const op = cfg.mode === "stream" ? "Stream.of(...)" : cfg.mode === "iterator" ? "source.iterator()" : "List.of(...)";
      const src = SRC.map((v, j) => {
        const c = s.cur && s.cur.readIdx === j ? "cur" : s.read.has(j) ? "read" : s.finished ? "never" : "";
        return `<span class="sim-chip ${c}" title="${c === "never" ? "never read" : c === "read" ? "read" : ""}">${v}</span>`;
      }).join("");
      return `<div class="sim-box src${active}"><h4>Source <span>${s.read.size}/${SRC.length} read</span></h4><div class="op">${op}</div><div class="sim-chips">${src}</div></div>`;
    }
    if (k === "term"){
      const res = cfg.term === "toList" ? chips(s.out, "out") : `<div class="sim-val">result: ${s.finished ? esc(s.result) : (s.res === undefined ? "–" : esc(String(s.res)))}</div>`;
      return `<div class="sim-box${active}"><h4>${esc(TERM[cfg.term].call)} <span>${calls(s.calls.term)}</span></h4><div class="op">terminal</div>${lastLine(s.last.term)}${res}</div>`;
    }
    const extra = k === "sorted" ? `<div class="op">buffer</div>${chips(s.buf)}` : "";
    return `<div class="sim-box${active}"><h4>${k} <span>${calls(s.calls[k])}</span></h4><div class="op">${esc(STG[k].op)}</div>${lastLine(s.last[k])}${extra}</div>`;
  }

  function render(){
    if (!el.isConnected){ stop(); return; }
    const s = replay(pos), cur = s.cur;
    srcRow.innerHTML = boxHTML("source", s);
    flow.innerHTML = on.concat(["term"]).map(k => boxHTML(k, s)).join("");
    now.textContent = cur ? cur.text : "Press Step or Play. Nothing has run yet.";
    codeEl.innerHTML = sim.code.map((l, i) => `<span class="ln${cur && cur.line === i ? " hot" : ""}">${hl(l) || " "}</span>`).join("");
    stackEl.innerHTML = cur && cur.stack.length
      ? cur.stack.slice().reverse().map(f => `<li class="${f.you ? "you" : ""}">${esc(f.t)}${f.you ? ' <span class="who">your code</span>' : ""}</li>`).join("")
      : `<li class="idle">Nothing running.</li>`;
    statsEl.innerHTML = `
      <div class="sim-stat"><b>${s.read.size} / ${SRC.length}</b><span>read from source</span></div>
      <div class="sim-stat"><b>${s.lambda}</b><span>times your logic ran</span></div>
      <div class="sim-stat"><b>${s.finished ? esc(s.result) : "…"}</b><span>result</span></div>`;
    logEl.innerHTML = sim.ev.slice(0, pos).map(e => `<li>${esc(e.text)}</li>`).reverse().join("");
    posEl.textContent = `Event ${pos} of ${sim.ev.length}`;
    q('[data-act="back"]').disabled = pos === 0;
    q('[data-act="reset"]').disabled = pos === 0;
    q('[data-act="step"]').disabled = pos >= sim.ev.length;
    q('[data-act="play"]').disabled = pos >= sim.ev.length;
    q('[data-act="play"]').textContent = timer ? "Pause" : "Play";
  }
  function stop(){ if (timer){ clearInterval(timer); timer = null; } }
  function play(){
    if (timer){ stop(); render(); return; }
    timer = setInterval(() => {
      if (!el.isConnected || pos >= sim.ev.length){ stop(); if (el.isConnected) render(); return; }
      pos++; render();
    }, +q("#sim-speed").value);
    render();
  }

  el.addEventListener("click", e => {
    const m = e.target.closest("[data-mode]");
    if (m){ cfg.mode = m.dataset.mode; build(); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const act = a.dataset.act;
    if (act === "step"){ stop(); if (pos < sim.ev.length) pos++; render(); }
    else if (act === "back"){ stop(); if (pos > 0) pos--; render(); }
    else if (act === "reset"){ stop(); pos = 0; render(); }
    else if (act === "play") play();
  });
  el.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.stage){ cfg.on[t.dataset.stage] = t.checked; build(); }
    else if (t.id === "sim-term"){ cfg.term = t.value; build(); }
    else if (t.id === "sim-speed" && timer){ stop(); play(); }
  });

/* ===================== GENERICS & ERASURE ===================== */
T.push({
id:"j8-generics", track:"java8", title:"Generics, erasure & why List<int> fails", since:"JDK 5 → Valhalla", jep:"JEP 401",
lede:"Generics let the compiler check what goes into a collection. After checking, the compiler removes that type information. That one design choice explains every generics limitation in Java, including why List&lt;int&gt; does not compile.",
html:`
${W([
 ["Generics","The &lt;T&gt; part of <code>List&lt;String&gt;</code>. It tells the compiler what kind of items the list holds."],
 ["Type erasure","After checking your code, the compiler removes the &lt;T&gt; information. At runtime, a <code>List&lt;String&gt;</code> is just a <code>List</code>."],
 ["Primitive","One of Java's 8 plain value types: <code>int</code>, <code>long</code>, <code>double</code>, <code>boolean</code>, and so on. They are raw values, not objects."],
 ["Reference","A pointer to an object somewhere in memory. Every object variable holds a reference."],
 ["Boxing","Wrapping a primitive in an object so it can be used where objects are required: <code>int</code> becomes <code>Integer</code>."],
 ["Bytecode","The low-level instructions the compiler produces and the JVM runs."]
])}
<h2>The problem</h2>
<p>Before Java 5, every collection held plain <code>Object</code>s. The compiler had no idea what was inside. You had to cast every item you took out, and a wrong item was only discovered when the program ran, often far from where it was added.</p>
${J(String.raw`List loans = new ArrayList();
loans.add(new Loan(1));
loans.add("oops");                     // compiles fine
Loan l = (Loan) loans.get(1);          // ClassCastException here, while the program runs`)}
<p>What we want is for the compiler to know \"this list holds only <code>Loan</code>s\", reject the bad <code>add</code>, and write the cast for us. Notice that this knowledge is needed <em>while compiling</em>, to check your calls. Whether the program also needs it <em>while running</em> is a separate decision. Java's answer to that second question shapes everything below.</p>

<h2>The idea, step by step</h2>
<h3>Step 1: what the compiler sees</h3>
${J(String.raw`List<Loan> loans = new ArrayList<>();
loans.add(new Loan(1));
loans.add("oops");                     // compile error: a String is not a Loan
Loan l = loans.get(0);                 // no cast needed`)}
<p>All the checking is done by the compiler. That raises the key question: once the compiler has proven the code is safe, does the running program still need to know the list holds <code>Loan</code>s?</p>

<h3>Step 2: erasure, what the running program sees</h3>
<p>In 2004 Java answered no. After checking, the compiler <strong>erases</strong> the type parameters: <code>T</code> becomes <code>Object</code>, and the compiler adds the casts itself where values come out. There is exactly one <code>ArrayList.class</code> file, shared by <code>ArrayList&lt;Loan&gt;</code>, <code>ArrayList&lt;String&gt;</code> and plain <code>ArrayList</code>.</p>
${J(String.raw`// Your code
List<String> names = new ArrayList<>();
names.add("Rushi");
String s = names.get(0);

// What the compiler produced (javap -c, shortened): no mention of String in the List calls
invokeinterface List.add:(Ljava/lang/Object;)Z
invokeinterface List.get:(I)Ljava/lang/Object;
checkcast       java/lang/String              // the cast the compiler wrote for you`,"Generics exist only in the compiler. The bytecode is the same as old Java 1.4 code")}
<p>Why choose this? <strong>Compatibility</strong>. Millions of lines of existing code and thousands of compiled libraries used plain <code>List</code>. With erasure, old libraries and new generic code could pass the same <code>ArrayList</code> objects to each other without recompiling anything. That was the deciding reason.</p>

<h3>Bridge methods: a small patch erasure needs</h3>
${J(String.raw`class RateComparator implements Comparator<Rate> {
    public int compare(Rate a, Rate b) { return a.value().compareTo(b.value()); }
}
// After erasure, Comparator's method is compare(Object, Object), so compare(Rate, Rate)
// would not actually override it. The compiler quietly adds a "bridge" method:
public int compare(Object a, Object b) {
    return compare((Rate) a, (Rate) b);
}`)}
<p>You may see these extra methods in stack traces or when using reflection (<code>Method.isBridge()</code>).</p>

<h3>Step 3: limits you can now predict</h3>
<p>If the running program does not know <code>T</code>, then anything that needs <code>T</code> at runtime cannot work:</p>
${J(String.raw`class Box<T> {
    T make()            { return new T(); }          // error: which class should be created? T is just Object now
    T[] arr()           { return new T[10]; }        // error: arrays must know their item type at runtime
    boolean is(Object o){ return o instanceof T; }   // error: nothing to check against
    static T shared;                                 // error: one static field for ALL Box<X>, so which T?
}

if (obj instanceof List<String>) { }                  // error: only List<?> can be checked
void handle(List<String> a) { }
void handle(List<Integer> a) { }                      // error: both become handle(List)`)}
<p>The usual workaround is to pass the type in yourself, as a <code>Class&lt;T&gt;</code> object or as a factory lambda:</p>
${J(String.raw`<T> T read(String json, Class<T> type) { return mapper.readValue(json, type); }
<T> List<T> fill(int n, Supplier<T> factory) { ... factory.get() ... }
T[] arr = (T[]) Array.newInstance(type, 10);`)}

<h3>Not everything is erased</h3>
<p>Erasure removes type information from <em>objects and instructions</em>. But <em>declarations</em> keep it in the class file, because other code needs it to compile against yours. A field declared as <code>List&lt;Loan&gt; loans</code>, or a class declared as <code>extends Base&lt;Loan&gt;</code>, still records <code>Loan</code>. Jackson and Spring read this with reflection. That is the trick behind the \"type reference\":</p>
${J(String.raw`// The {} creates a small subclass, and its declaration remembers List<Loan>
List<Loan> loans = mapper.readValue(json, new TypeReference<List<Loan>>() {});

// Spring uses the same trick
restClient.get().uri("/loans").retrieve().body(new ParameterizedTypeReference<List<Loan>>() {});`)}

<h3>Step 4: why List&lt;int&gt; cannot work</h3>
<p>Follow erasure one step further. <code>ArrayList</code> stores its items in an <code>Object[]</code>. An <code>Object[]</code> holds <strong>references</strong>: pointers to objects. An <code>int</code> is not a reference. It is a raw 32-bit number with no object around it.</p>
<p>The JVM has different instructions for different kinds of values. Reading a reference from an array and reading an <code>int</code> from an array are different instructions. <code>long</code> and <code>double</code> are different again, because they are twice as big.</p>
${J(String.raw`aaload    // load a REFERENCE from an Object[]
iaload    // load an INT from an int[]
laload    // load a LONG from a long[]
daload    // load a DOUBLE from a double[]

aload_1 / iload_1 / lload_1 / dload_1    // the same split for local variables
areturn / ireturn / lreturn / dreturn   // and for return values`)}
<p>So the single compiled <code>ArrayList.class</code>, written with reference instructions like <code>aaload</code> and <code>areturn</code>, physically cannot work with raw <code>int</code>s. To support <code>List&lt;int&gt;</code>, <strong>someone must produce different bytecode for each primitive type</strong>. That is the whole problem in one sentence. Every solution below is just a different answer to \"who produces that code, and when?\"</p>

<h3>What Java does today: boxing</h3>
<p>Java wraps each <code>int</code> in an <code>Integer</code> object so it becomes a reference. Since Java 5 this happens automatically (\"autoboxing\"):</p>
${J(String.raw`List<Integer> nums = new ArrayList<>();
nums.add(42);            // really: nums.add(Integer.valueOf(42))
int x = nums.get(0);     // really: ((Integer) nums.get(0)).intValue()`)}

<rect x="535" y="34" width="45" height="30" class="f-acc"/><text x="557" y="54" class="f-s">99</text>
<text x="400" y="92" class="f-s" text-anchor="start">1 million numbers ≈ 4 MB</text>
<text x="400" y="110" class="f-s" text-anchor="start">one memory read per number</text>
<text x="400" y="150" class="f-s" text-anchor="start">Boxed: 1M × (16B object + 4B pointer)</text>
<text x="400" y="168" class="f-s" text-anchor="start">≈ 20 MB, scattered around memory,</text>
<text x="400" y="186" class="f-s" text-anchor="start">and a pointer to follow for each one</text>
</svg>
<p class="cap">Sizes are for a 64-bit JVM with its default settings (heap under 32 GB).</p>
</div>
<p>Boxing also changes behaviour, because an <code>Integer</code> is an object and two objects can be different even when their values are equal:</p>
${J(String.raw`Integer a = 127, b = 127;
a == b;            // true:  Java reuses cached objects for -128..127
Integer c = 128, d = 128;
c == d;            // false: two different objects. Always compare with equals()

List<Integer> ids = ...;
int first = ids.get(0);   // NullPointerException if that item is null

ids.remove(1);                     // removes the item at POSITION 1
ids.remove(Integer.valueOf(1));    // removes the VALUE 1`)}

<h3>Step 5: four ways to get real number collections</h3>
<h4>Way 1: write the number version yourself</h4>
<p>Take <code>ArrayList</code>'s idea (an array plus a count, doubling the array when it is full) and use <code>int[]</code> instead of <code>Object[]</code>. The bytecode now uses <code>iaload</code> and <code>ireturn</code>, which is exactly what was missing.</p>
${J(String.raw`public final class IntList {
    private int[] data;
    private int size;

    public IntList()                { this(10); }
    public IntList(int capacity)    { data = new int[capacity]; }

    public void add(int value) {
        if (size == data.length) {
            data = Arrays.copyOf(data, Math.max(4, size * 2));   // grow by doubling, like ArrayList
        }
        data[size++] = value;
    }

    public int get(int index) {
        Objects.checkIndex(index, size);   // the array may be bigger than the list
        return data[index];
    }

    public void set(int index, int value) { Objects.checkIndex(index, size); data[index] = value; }
    public int size()                    { return size; }

    public long sum() {                    // no unboxing: a tight, fast loop
        long s = 0;
        for (int i = 0; i < size; i++) s += data[i];
        return s;
    }

    public IntStream stream()          { return Arrays.stream(data, 0, size); }
    public void forEach(IntConsumer c) { for (int i = 0; i < size; i++) c.accept(data[i]); }

    // So it still works with code that expects a List<Integer>. Boxes only when read.
    public List<Integer> asList() {
        return new AbstractList<>() {
            @Override public Integer get(int i)          { return IntList.this.get(i); }
            @Override public Integer set(int i, Integer v){ int old = IntList.this.get(i); IntList.this.set(i, v); return old; }
            @Override public int size()                  { return size; }
        };
    }
}`,"A list of plain ints: about 40 lines, and 5 times smaller than ArrayList<Integer>")}
${J(String.raw`IntList rates = new IntList();
for (int bp : new int[]{385, 412, 399}) rates.add(bp);   // basis points, no Integer objects
rates.sum();                                             // 1196
rates.stream().max().getAsInt();                         // 412
Collections.max(rates.asList());                         // works with any List method`)}
<p>The cost shows up when you also need <code>long</code> and <code>double</code>: three copies of nearly the same code.</p>

<h4>Way 2: generate the copies automatically</h4>
<p>If the copies only differ by type name, a tool can generate them from one template. Libraries such as fastutil and Eclipse Collections do this. Their JARs contain classes like <code>IntArrayList</code>, <code>LongArrayList</code> and <code>Int2ObjectOpenHashMap</code>.</p>
${J(String.raw`// Using fastutil
IntArrayList ids = new IntArrayList();
ids.add(42);
int x = ids.getInt(0);       // returns a plain int, no boxing`)}
<p>The JDK did the same by hand, and you use the result every day: <code>IntStream</code>, <code>LongStream</code>, <code>DoubleStream</code>, <code>IntFunction</code>, <code>ToIntFunction</code>, <code>OptionalInt</code> and many more exist only because <code>Stream&lt;int&gt;</code> cannot. That long list of number-specific interfaces is the visible price of erasure.</p>

<h4>Way 3: let the compiler make a copy per type (the C++ way)</h4>
<p>The compiler could create a separate class for every type it sees used: one for <code>List&lt;int&gt;</code>, one for <code>List&lt;String&gt;</code>, one for <code>List&lt;Loan&gt;</code>. C++ and Rust work like this. It handles numbers naturally. But a library JAR would need copies for types it has never seen, such as your <code>Loan</code>, and programs grow much bigger. That breaks how Java libraries are shipped.</p>

<h4>Way 4: let the JVM make the copy when needed (the C# way, and Java's plan)</h4>
<p>Keep one class file, but keep enough type information that the running JVM can create a number version the first time <code>List&lt;int&gt;</code> is used. All object types can still share one version, because a pointer is a pointer whatever it points to. C# has worked like this since 2005.</p>
<p>Java's version is <strong>Project Valhalla</strong>, in two parts:</p>
<ol>
<li><strong>Value classes (JEP 401)</strong>: objects without an identity of their own, so the JVM can store them flat, side by side, like <code>int</code>s.</li>
<li><strong>Specialised generics</strong>: the JVM generating flat, number-friendly versions of generic classes, while older code keeps working unchanged.</li>
</ol>
<p>At the time of writing, value classes are available only in preview and early-access builds, and specialised generics come after them. Check the JEP status before relying on either.</p>
<div class="table-wrap"><table>
<thead><tr><th>Approach</th><th>Who writes the int version</th><th>When</th><th>Cost</th></tr></thead>
<tbody>
<tr><td>Boxing</td><td>Nobody</td><td>Never</td><td>About 5 times more memory, slower access, nulls, <code>==</code> surprises</td></tr>
<tr><td>Hand-written <code>IntList</code></td><td>You</td><td>When you write it</td><td>The same code again for each number type</td></tr>
<tr><td>Generated from a template</td><td>A build tool</td><td>When the library is built</td><td>Many classes in the JAR</td></tr>
<tr><td>Copy per type (C++, Rust)</td><td>The compiler</td><td>At compile time</td><td>Much bigger programs; libraries harder to ship</td></tr>
<tr><td>Copy on demand (C#, Valhalla)</td><td>The JVM</td><td>The first time it is used</td><td>Needs changes to the JVM itself</td></tr>
</tbody></table></div>

<h2>What to do in real code</h2>
<ul>
<li>Use <code>List&lt;Integer&gt;</code> by default. For a few thousand items in a web request, boxing is not your problem.</li>
<li>Use <code>int[]</code>, <code>IntStream</code> or <code>mapToInt</code> for number crunching: <code>loans.stream().mapToLong(Loan::amountCents).sum()</code>.</li>
<li>Use fastutil or Eclipse Collections when measurements show millions of boxed numbers, such as large in-memory caches or ID sets.</li>
<li>For money, keep <code>BigDecimal</code> or a <code>long</code> number of cents.</li>
</ul>

<h2>Common mistakes</h2>
<ul class="traps">
<li>Comparing <code>Integer</code> or <code>Long</code> values with <code>==</code>. It works for small numbers in tests and fails for bigger ones in production.</li>
<li><code>List&lt;Integer&gt;.remove(int)</code> removes by position; <code>remove(Object)</code> removes by value. It is easy to call the wrong one.</li>
<li>Casting a plain list, like <code>(List&lt;String&gt;) rawList</code>, compiles with only a warning, and fails later when an item is read. Do not hide that warning without a good reason.</li>
<li>In a generic method with <code>T...</code> parameters, the array Java creates is really an <code>Object[]</code>. Never store it or return it.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>The compiler checks generic types, then erases them. At runtime, <code>List&lt;String&gt;</code> is just <code>List</code>.</li>
<li>So anything that needs <code>T</code> at runtime (<code>new T()</code>, <code>T[]</code>, <code>instanceof T</code>) does not work.</li>
<li>Primitives need different JVM instructions than objects, so <code>List&lt;int&gt;</code> would need separate code. Today Java uses boxing instead.</li>
</ul>

<h2>Check yourself</h2>
${Q("Why can one <code>ArrayList.class</code> serve both <code>List&lt;String&gt;</code> and <code>List&lt;Loan&gt;</code>, but not <code>List&lt;int&gt;</code>?","Every object, whatever its class, is handled through a pointer, and pointers all use the same instructions (<code>aaload</code>, <code>areturn</code>). So code written for <code>Object</code> works for any class. An <code>int</code> is a raw number that needs different instructions (<code>iaload</code>, <code>ireturn</code>), so it would need different compiled code.")}
${Q("Jackson can read JSON into a <code>List&lt;Loan&gt;</code> with <code>new TypeReference&lt;List&lt;Loan&gt;&gt;(){}</code>. If generics are erased, where does it find <code>Loan</code>?","The <code>{}</code> creates a small anonymous subclass. A class's declaration, including the type it extends, is kept in the class file and is not erased. Jackson reads it with reflection, using <code>getGenericSuperclass()</code>.")}
${Q("Why does <code>new T()</code> fail, but passing a <code>Supplier&lt;T&gt;</code> works?","At runtime <code>T</code> is just <code>Object</code>, so the JVM does not know which class to create. The caller, however, knows the real type. By passing a factory such as <code>Loan::new</code>, the caller hands that knowledge over as a value.")}
${Q("In <code>IntList.get</code>, why check against <code>size</code> instead of relying on the array's own bounds check?","The array is usually bigger than the list, because it keeps spare room for future items. Positions between <code>size</code> and the array's length exist in the array but are not part of the list. Without the check, <code>get</code> would quietly return a leftover 0 instead of failing.")}
`});
/* ===================== JAVA 9 – 17 ===================== */
T.push({
id:"j17-overview", track:"java17", title:"What changed from 8 to 17", since:"JDK 9–17", jep:null,
lede:"Java released nine new versions in four years. This page is a map of what matters for a backend developer, so the lessons that follow have context.",
html:`
${W([
 ["JDK","Java Development Kit: the compiler, the JVM and the standard library, released together as one version."],
 ["LTS","Long-Term Support. Most companies only use these versions, because they get fixes for years: 8, 11, 17, 21, 25."],
 ["Module","A named group of packages that controls which of its parts other code may use. Added in Java 9."],
 ["Boilerplate","Repetitive code you must write but that says nothing new."]
])}
<h2>The problem</h2>
<p>Java 8 came out in 2014. After that, Java switched to a new version every six months, with a long-term support (LTS) version every few years: 11 in 2018, 17 in 2021, 21 in 2023 and 25 in 2025. Most companies jump from one LTS version to the next, so \"moving to Java 17\" really means getting everything from versions 9 to 17 at once.</p>
<p>Two themes run through these versions:</p>
<ul>
<li><strong>Less boilerplate.</strong> <code>var</code>, records, text blocks and switch expressions let you say the same thing with less code.</li>
<li><strong>Modelling data so the compiler can check it.</strong> Sealed types and pattern matching let the compiler warn you when you forgot a case. Java 21 completes this theme.</li>
</ul>
<div class="table-wrap"><table>
<thead><tr><th>Version</th><th>What you will use day to day</th></tr></thead>
<tbody>
<tr><td>9</td><td>Modules, <code>List.of</code> / <code>Map.of</code>, <code>Optional.ifPresentOrElse</code>, <code>Stream.takeWhile</code>, JShell (try Java lines interactively), private methods in interfaces</td></tr>
<tr><td>10</td><td><code>var</code> for local variables, <code>List.copyOf</code>, the JVM respects Docker CPU and memory limits</td></tr>
<tr><td>11 LTS</td><td>A built-in <code>HttpClient</code>, <code>String.isBlank / strip / lines / repeat</code>, <code>Files.readString</code>, run a single file with <code>java Main.java</code></td></tr>
<tr><td>12–13</td><td>Short number formats, <code>Collectors.teeing</code></td></tr>
<tr><td>14</td><td>Switch expressions, much clearer <code>NullPointerException</code> messages</td></tr>
<tr><td>15</td><td>Text blocks (multi-line strings), the ZGC garbage collector ready for production</td></tr>
<tr><td>16</td><td>Records, pattern matching for <code>instanceof</code>, <code>Stream.toList()</code></td></tr>
<tr><td>17 LTS</td><td>Sealed classes, JDK internals locked down, a new random number API</td></tr>
</tbody></table></div>

<h3>Modules, in one paragraph</h3>
<p>Java 9 split the JDK into about 70 modules. Since Java 17, your code is no longer allowed to reach into the JDK's internal classes (like <code>sun.misc.*</code>) through reflection, unless you explicitly allow it with the <code>--add-opens</code> option. This is the cause of most <code>InaccessibleObjectException</code> errors when old libraries meet a new Java version. Most application code still runs without its own <code>module-info.java</code>, and that is fine.</p>

<h3>Small additions that remove boilerplate</h3>
${J(String.raw`var rates = new HashMap<String, BigDecimal>();      // 10: the type comes from the right-hand side
List<String> codes = List.of("FIX", "VAR", "MIX");   // 9: a list that cannot be changed, no nulls
Map<String, Integer> m = Map.of("a", 1, "b", 2);

String body = Files.readString(Path.of("rates.json")); // 11: read a whole file in one line
"  hi  ".strip();        // 11: remove spaces at both ends (handles all Unicode spaces)
"ab".repeat(3);          // 11: "ababab"
" ".isBlank();           // 11: true

List<Integer> evens = IntStream.range(0, 10).filter(i -> i % 2 == 0).boxed().toList(); // 16

HttpClient client = HttpClient.newHttpClient();       // 11: replaces the old HttpURLConnection
HttpResponse<String> r = client.send(
    HttpRequest.newBuilder(URI.create("https://api.example.com/rates")).build(),
    HttpResponse.BodyHandlers.ofString());`)}

<h3>Helpful NullPointerExceptions (Java 14)</h3>
${J(String.raw`// Before: java.lang.NullPointerException   (but which part was null?)
// Now:
// Cannot invoke "Address.getCity()" because the return value of
// "Customer.getAddress()" is null
String city = customer.getAddress().getCity();`)}

<h2>Common mistakes when upgrading from 8 to 17</h2>
<ul class="traps">
<li>Java 11 removed <code>javax.xml.bind</code> (JAXB), <code>javax.annotation</code> and other Java EE parts. Add them as Maven dependencies. Spring Boot 3 also renamed all <code>javax.*</code> packages to <code>jakarta.*</code>.</li>
<li><code>List.of(...)</code> cannot be changed and does not allow <code>null</code>. The older <code>Arrays.asList</code> allowed both <code>set</code> and nulls.</li>
<li><code>Stream.toList()</code> returns a list you cannot change; <code>Collectors.toList()</code> gives you a normal <code>ArrayList</code> in practice.</li>
<li>Old versions of Lombok, Mockito and ByteBuddy break on newer Java. Upgrade build tools and plugins first.</li>
</ul>

<h2>Remember</h2>
<ul>
<li>Companies move between LTS versions: 8, 11, 17, 21, 25.</li>
<li>Java 9 to 17 is mostly about writing less code and letting the compiler check more.</li>
<li>Most upgrade problems come from removed Java EE parts and locked-down JDK internals.</li>
</ul>
`});

T.push({
id:"j17-var", track:"java17", title:"var: local type inference", since:"JDK 10", jep:"JEP 286",
lede:"var lets the compiler fill in a local variable's type from the value you assign. The type is still fixed when you compile; you just stop typing it twice.",
html:`
${W([
 ["Type inference","The compiler works out a type by itself from the surrounding code."],
 ["Local variable","A variable declared inside a method. It exists only while that method runs."],
 ["Initializer","The value given to a variable when it is declared, the part after <code>=</code>."]
])}
<h2>The problem</h2>
<p>When the right-hand side already says the type, writing it on the left too is pure repetition:</p>
${J(String.raw`Map<String, List<Loan>> byProduct = new HashMap<String, List<Loan>>();`)}
<p>The compiler already knows the type. <code>var</code> asks it to fill in the declared type from the value.</p>

<h2>The idea, step by step</h2>
${J(String.raw`var byProduct = new HashMap<String, List<Loan>>();   // type: HashMap<String, List<Loan>>
for (var entry : byProduct.entrySet()) { ... }       // Map.Entry<String, List<Loan>>
try (var in = Files.newBufferedReader(path)) { ... }

var x = 10;
x = "ten";        // compile error: x is an int, forever`)}
<p><code>var</code> is <strong>not</strong> like JavaScript's <code>var</code>. The variable still has one fixed type; you just did not have to write it.</p>

<h3>The rules, and the reason for each</h3>
<ul>
