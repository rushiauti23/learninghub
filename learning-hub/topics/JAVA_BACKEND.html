-XX:StartFlightRecording=maxage=1h,filename=/dumps/rec.jfr`)}

<h3>Reading a thread dump</h3>
${J(String.raw`"http-nio-8080-exec-7" #42 daemon prio=5 tid=0x... nid=0x2b03 waiting on condition
   java.lang.Thread.State: TIMED_WAITING (parking)
	at jdk.internal.misc.Unsafe.park(Native Method)
	at java.util.concurrent.locks.LockSupport.parkNanos(...)
	at com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:...)   <- waiting for a DB connection
	at org.springframework.jdbc.datasource.DataSourceUtils.getConnection(...)
	at com.x.LoanService.findAll(LoanService.java:88)`)}
<p>Take three dumps ten seconds apart. Threads stuck on the same frame across all three are your bottleneck. In the example, all Tomcat threads waiting in <code>HikariPool.getConnection</code> means the connection pool is exhausted: look for slow queries or connections held across remote calls.</p>
<p>For CPU: <code>top -H -p &lt;pid&gt;</code> shows the busiest thread id in decimal. Convert to hex and find the matching <code>nid=0x...</code> in the dump.</p>

<h3>In Kubernetes</h3>
${J(String.raw`kubectl exec -it pod-x -- jcmd 1 Thread.print
kubectl exec pod-x -- jcmd 1 GC.heap_dump /tmp/h.hprof && kubectl cp pod-x:/tmp/h.hprof ./h.hprof
# Spring Boot Actuator equivalents: /actuator/threaddump, /actuator/heapdump, /actuator/metrics/jvm.*`)}
`});
/* ===================== SPRING BOOT ===================== */
T.push({
id:"sb-ioc", track:"spring", title:"Inversion of control & dependency injection", since:"Spring 1.0", jep:null,
lede:"Objects stop building their own dependencies. A container builds the whole object graph once, and hands each object what it needs.",
html:`
<h2>Start from the problem</h2>
${J(String.raw`public class LoanService {
    private final LoanRepository repo = new JdbcLoanRepository(new HikariDataSource(...));
    private final RateClient rates = new RateClient("https://rates.internal", 2000);
}`)}
<p>This class decides <em>what</em> it needs and also <em>how</em> to build it, including URLs and pool sizes. Testing it means a real database. Changing the repository means editing every class that creates one. And if five services each create their own <code>HikariDataSource</code>, you have five connection pools.</p>
<p>Split the two jobs. A class should only declare what it needs. Something else, assembled once at startup, decides which concrete objects to create and wires them together. Control over construction is <em>inverted</em>: moved out of the class into a container.</p>

<h2>Build it up: write a tiny container yourself</h2>
${J(String.raw`// The whole idea in 15 lines
class MiniContainer {
    private final Map<Class<?>, Object> singletons = new HashMap<>();

    <T> T get(Class<T> type) throws Exception {
        Object existing = singletons.get(type);
        if (existing != null) return type.cast(existing);
        Constructor<?> ctor = type.getDeclaredConstructors()[0];
        Object[] args = Arrays.stream(ctor.getParameterTypes())
                              .map(dep -> { try { return get(dep); } catch (Exception e) { throw new RuntimeException(e); } })
                              .toArray();                         // resolve dependencies recursively
        T bean = type.cast(ctor.newInstance(args));
        singletons.put(type, bean);                               // one instance, shared
        return bean;
    }
}`,"Spring's ApplicationContext is this idea plus scanning, configuration, lifecycle and proxies")}

<h3>The Spring version</h3>
${J(String.raw`@Service
public class LoanService {
    private final LoanRepository repo;
    private final RateClient rates;

    // Single constructor: @Autowired not needed. Fields final -> immutable, testable.
    public LoanService(LoanRepository repo, RateClient rates) {
        this.repo = repo;
        this.rates = rates;
    }
}

@Configuration
class ClientConfig {
    @Bean
    RateClient rateClient(@Value("${"$"}{rates.url}") String url, RestClient.Builder b) {
        return new RateClient(b.baseUrl(url).build());
    }
}

// Test: no Spring needed at all
var svc = new LoanService(new InMemoryLoanRepository(), mock(RateClient.class));`)}

<h3>How beans are found</h3>
<ul>
<li><strong>Component scanning</strong>: <code>@SpringBootApplication</code> scans its own package and sub-packages for <code>@Component</code> and its specialisations (<code>@Service</code>, <code>@Repository</code>, <code>@Controller</code>, <code>@Configuration</code>).</li>
<li><strong><code>@Bean</code> methods</strong> in <code>@Configuration</code> classes: for third-party classes you cannot annotate.</li>
<li><strong>Auto-configuration</strong>: beans Spring Boot registers for you (next lesson).</li>
</ul>

<h3>Several candidates for one type</h3>
${J(String.raw`@Bean @Primary RateProvider ecbRates() { ... }
@Bean RateProvider internalRates() { ... }

public PricingService(@Qualifier("internalRates") RateProvider p) { ... }
public Aggregator(List<RateProvider> all) { ... }        // inject every implementation
public Router(Map<String, RateProvider> byBeanName) { ... }`)}

<h3>Scopes</h3>
<p>Default scope is <strong>singleton</strong>: one instance per container, shared across all threads. Therefore a singleton must be stateless or thread-safe. A mutable field on a <code>@Service</code> is shared by every concurrent request. Other scopes: <code>prototype</code> (new each injection), <code>request</code>, <code>session</code>.</p>

<h2>Traps</h2>
<ul class="traps">
<li>Field injection (<code>@Autowired private Foo foo;</code>) hides dependencies, prevents <code>final</code>, and needs reflection in tests. Prefer constructors.</li>
<li>Circular dependencies fail at startup by default since Boot 2.6. Treat it as a design signal: extract the shared part into a third bean.</li>
<li>Injecting a prototype bean into a singleton gives you one prototype forever. Use <code>ObjectProvider&lt;T&gt;</code> to get a fresh one.</li>
</ul>
`});

T.push({
id:"sb-autoconfig", track:"spring", title:"Auto-configuration", since:"Boot 1.0", jep:null,
lede:"Spring Boot looks at what is on your classpath and what you already defined, and registers sensible beans for everything else.",
html:`
<h2>Start from the problem</h2>
<p>Plain Spring needs you to declare a <code>DataSource</code>, a <code>JdbcTemplate</code>, a transaction manager, Jackson's <code>ObjectMapper</code>, an embedded Tomcat, message converters, and so on. The configuration is nearly identical in every project. It could be derived from facts: "the Postgres driver is on the classpath and <code>spring.datasource.url</code> is set, so create a pool."</p>

<h2>Build it up</h2>
<p>An auto-configuration is an ordinary <code>@Configuration</code> class guarded by <strong>conditions</strong>:</p>
${J(String.raw`@AutoConfiguration
@ConditionalOnClass(DataSource.class)                     // only if JDBC is on the classpath
@EnableConfigurationProperties(DataSourceProperties.class)
public class DataSourceAutoConfiguration {

    @Bean
    @ConditionalOnMissingBean(DataSource.class)           // back off if you defined one
    @ConditionalOnProperty(prefix = "spring.datasource", name = "url")
    HikariDataSource dataSource(DataSourceProperties props) {
        return props.initializeDataSourceBuilder().type(HikariDataSource.class).build();
    }
}`,"Simplified. The real class does more, but the principle is exactly this")}
<p>Boot finds these classes from a list in each starter JAR: <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports</code> (Boot 2.7+; previously <code>spring.factories</code>). <code>@SpringBootApplication</code> = <code>@Configuration</code> + <code>@ComponentScan</code> + <code>@EnableAutoConfiguration</code>.</p>
<p>The rule that makes it safe: <strong>your beans win</strong>. Your configuration is processed first, then auto-configurations with <code>@ConditionalOnMissingBean</code> step aside.</p>

<h3>See what happened</h3>
${J(String.raw`# Start with --debug or:
logging.level.org.springframework.boot.autoconfigure=DEBUG
# Prints the CONDITIONS EVALUATION REPORT: positive matches, negative matches and why.

# Or at runtime
management.endpoints.web.exposure.include=conditions,beans,configprops,env
GET /actuator/conditions

# Exclude one
@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)`)}

<h3>Externalised configuration</h3>
<p>Property sources are layered; later ones override earlier: defaults → <code>application.yml</code> → profile-specific <code>application-prod.yml</code> → environment variables (<code>SPRING_DATASOURCE_URL</code>) → command-line args. Bind groups of properties to a typed record:</p>
${J(String.raw`@ConfigurationProperties(prefix = "pma.rates")
@Validated
public record RatesProperties(@NotNull URI baseUrl, Duration timeout, int maxRetries) { }

# application.yml
pma:
  rates:
    base-url: https://rates.internal
    timeout: 2s
    max-retries: 3`)}

<h3>Spring Boot versions</h3>
<p>Boot 3.x moved to Jakarta EE (<code>jakarta.*</code>) and requires Java 17. Boot 4.0 (late 2025, on Spring Framework 7) keeps the Java 17 baseline and modularises the auto-configuration JARs, so check starter names when upgrading.</p>
`});

T.push({
id:"sb-proxies", track:"spring", title:"Bean lifecycle & proxies", since:"Spring 2.0", jep:null,
lede:"@Transactional, @Async, @Cacheable and @Retryable all work the same way: Spring wraps your bean in a proxy. Understanding the proxy explains every one of their surprises.",
html:`
<h2>Start from the problem</h2>
<p>You want transactions around many service methods: begin, call, commit or roll back. Copy-pasting that into each method is error-prone. You want to add behaviour <em>around</em> a method without changing it. The standard answer is the proxy pattern: hand callers a stand-in object that does the extra work, then delegates to the real object.</p>

<h2>Build it up: the lifecycle</h2>
<ol>
<li><strong>Instantiate</strong> (call the constructor, injecting dependencies).</li>
<li><strong>Populate</strong> remaining properties.</li>
<li><strong>Aware callbacks</strong> (<code>BeanNameAware</code>, etc.).</li>
<li><code>BeanPostProcessor.postProcessBeforeInitialization</code></li>
<li><strong>Init</strong>: <code>@PostConstruct</code>, then <code>afterPropertiesSet</code>, then <code>initMethod</code>.</li>
<li><code>BeanPostProcessor.postProcessAfterInitialization</code> ← <strong>proxies are created here</strong>. What goes into the container may no longer be your object, but a wrapper around it.</li>
<li>On shutdown: <code>@PreDestroy</code>.</li>
</ol>

<h3>What the proxy looks like</h3>
${J(String.raw`// Your class
@Service
public class LoanService {
    @Transactional
    public void approve(long id) { ... }
}

// Roughly what Spring generates at runtime (CGLIB subclass)
class LoanService$$SpringCGLIB$$0 extends LoanService {
    private LoanService target;               // the real bean
    private PlatformTransactionManager tm;

    @Override public void approve(long id) {
        TransactionStatus tx = tm.getTransaction(new DefaultTransactionDefinition());
        try {
            target.approve(id);               // delegate to the real object
            tm.commit(tx);
        } catch (RuntimeException e) {
            tm.rollback(tx);
            throw e;
        }
    }
}`)}

<h2>The self-invocation trap</h2>
<p>Now everything follows. Annotations only work when the call goes <strong>through the proxy</strong>. A call from inside the bean to its own method uses <code>this</code>, the real object, and skips the proxy entirely.</p>
${J(String.raw`@Service
public class LoanService {
    public void approveAll(List<Long> ids) {
        ids.forEach(this::approve);          // 'this' = target, not proxy: NO transaction
    }
    @Transactional
    public void approve(long id) { ... }
}

// Fixes, best first:
// 1. Move approve() to another bean and inject it. (Clearer design anyway.)
// 2. Put @Transactional on approveAll if one transaction is what you want.
// 3. Inject self lazily: @Lazy @Autowired LoanService self; self.approve(id);`)}
<p>Same reasons explain other gotchas:</p>
<ul>
<li><code>@Transactional</code> on a <code>private</code> or <code>final</code> method does nothing: a subclass proxy cannot override it.</li>
<li>A <code>final</code> class cannot be proxied by CGLIB at all.</li>
<li>Code in <code>@PostConstruct</code> runs on the target before the proxy exists, so <code>@Transactional</code> inside it is ignored.</li>
</ul>

<h3>JDK proxies vs CGLIB</h3>
<p>If a bean implements an interface, Spring can use a JDK dynamic proxy that implements the same interface. Otherwise it subclasses with CGLIB. Spring Boot defaults to CGLIB everywhere (<code>proxyTargetClass=true</code>) so injecting by concrete class works.</p>
${J(String.raw`// Writing your own aspect
@Aspect @Component
class TimingAspect {
    @Around("@annotation(com.x.Timed)")
    Object time(ProceedingJoinPoint pjp) throws Throwable {
        long t = System.nanoTime();
        try { return pjp.proceed(); }
        finally { log.info("{} took {} ms", pjp.getSignature(), (System.nanoTime() - t) / 1_000_000); }
    }
}`)}
`});

T.push({
id:"sb-threads", track:"spring", title:"Threading model of a Spring Boot app", since:"Boot 2 / 3.2", jep:null,
lede:"Which thread runs your controller, how many exist, what they share, and what changes when you turn on virtual threads.",
html:`
<h2>Start from the problem</h2>
<p>Your <code>@RestController</code> code looks single-threaded, but 200 requests may be inside the same controller method at the same moment, on the same singleton object. To reason about correctness and capacity, you need a picture of where threads come from.</p>

<h2>Build it up: one request's journey (Spring MVC on Tomcat)</h2>
<ol>
<li>An <strong>acceptor</strong> thread accepts the TCP connection.</li>
<li>A <strong>poller</strong> (NIO selector) notices data is readable.</li>
<li>A <strong>worker thread</strong> from Tomcat's pool (<code>http-nio-8080-exec-N</code>) is assigned. It runs the filter chain, <code>DispatcherServlet</code>, your controller, service, repository, and writes the response. <em>The same thread for the whole request.</em></li>
<li>The thread returns to the pool.</li>
</ol>
${J(String.raw`server.tomcat.threads.max=200          # worker threads (default 200)
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100         # OS backlog when all workers busy
server.tomcat.max-connections=8192     # open connections (keep-alive) NIO can hold
spring.datasource.hikari.maximum-pool-size=10   # default 10!`)}
<p>Notice the mismatch in the defaults: 200 request threads, 10 DB connections. If every request needs the database, 190 threads queue inside Hikari. Under slow queries, threads pile up waiting for connections (the thread dump example in the JVM track) and Hikari throws <code>SQLTransientConnectionException</code> after <code>connection-timeout</code> (30 s).</p>

<h3>Thread-bound context</h3>
<p>Because one thread handles the whole request, Spring stores per-request state in <code>ThreadLocal</code>s:</p>
<ul>
<li><code>SecurityContextHolder</code>: the authenticated user.</li>
<li><code>TransactionSynchronizationManager</code>: the current transaction and its JDBC connection.</li>
<li><code>RequestContextHolder</code>: the current <code>HttpServletRequest</code>.</li>
<li>SLF4J <code>MDC</code>: correlation ids in logs.</li>
</ul>
<p>Consequence: <strong>when you hop to another thread, that context does not follow</strong>. Code in <code>CompletableFuture.supplyAsync</code> or an <code>@Async</code> method has no transaction, no security context, no MDC unless you propagate it.</p>
${J(String.raw`@Bean
ThreadPoolTaskExecutor appExecutor() {
    var ex = new ThreadPoolTaskExecutor();
    ex.setCorePoolSize(8);
    ex.setThreadNamePrefix("app-");
    ex.setTaskDecorator(task -> {                     // copy MDC to the worker thread
        Map<String, String> mdc = MDC.getCopyOfContextMap();
        return () -> {
            if (mdc != null) MDC.setContextMap(mdc);
            try { task.run(); } finally { MDC.clear(); }
        };
    });
    return ex;
}
// For tracing and security context, Micrometer Context Propagation does this generically`)}

<h3>Singletons and thread safety</h3>
${J(String.raw`@RestController
class QuoteController {
    private int requestCount;                    // BUG: shared by all requests
    private final SimpleDateFormat fmt = ...;    // BUG: not thread-safe
    private final AtomicInteger hits = new AtomicInteger();   // OK
    private final DateTimeFormatter iso = DateTimeFormatter.ISO_DATE;  // OK: immutable
}`)}

<h3>With virtual threads</h3>
${J(String.raw`spring.threads.virtual.enabled=true   # Boot 3.2+, Java 21+`)}
<p>Tomcat now runs each request on a fresh virtual thread, so the 200-thread ceiling disappears. ThreadLocals still work (each virtual thread has its own). What does not disappear: the 10-connection DB pool. It becomes the explicit queue, so set sensible Hikari timeouts, and on Java 21 check for <code>synchronized</code> around I/O in your code and drivers.</p>

<h3>WebFlux, briefly</h3>
<p>WebFlux uses a few event-loop threads (Netty, one per core) that must never block. A blocking JDBC call there freezes every request on that loop. That is why WebFlux needs R2DBC or reactive clients end to end. With virtual threads, many teams keep MVC and blocking code instead.</p>
`});

T.push({
id:"sb-tx", track:"spring", title:"Transactions", since:"Spring 1.0", jep:null,
lede:"@Transactional binds a database connection to the current thread for the length of a method call, then commits or rolls back.",
html:`
<h2>Start from the problem</h2>
<p>A JDBC transaction belongs to a <code>Connection</code>: <code>setAutoCommit(false)</code>, run statements, <code>commit()</code>. For your repository calls in different classes to be in the same transaction, they must use the <em>same connection</em>. Passing the connection as a parameter everywhere is ugly. Spring's answer: put it in a ThreadLocal for the duration of the call. Every <code>JdbcTemplate</code> or JPA <code>EntityManager</code> call on that thread picks it up.</p>

<h2>Build it up</h2>
${J(String.raw`@Transactional
public void approve(long loanId) {
    Loan loan = loanRepo.findById(loanId).orElseThrow();   // same connection
    loan.approve();                                         // JPA dirty checking
    auditRepo.save(new Audit(loanId, "APPROVED"));          // same connection
}   // proxy commits: JPA flushes UPDATE + INSERT, then COMMIT`)}

<h3>Rollback rules</h3>
<p>By default Spring rolls back on <strong>unchecked</strong> exceptions (<code>RuntimeException</code>, <code>Error</code>) and <strong>commits</strong> on checked ones. This surprises people: a <code>throws IOException</code> leaves the transaction committed.</p>
${J(String.raw`@Transactional(rollbackFor = Exception.class)   // roll back on checked too

@Transactional
public void x() {
    try { repo.save(a); riskyCall(); }
    catch (RuntimeException e) { log.warn("ignored", e); }   // swallowed: transaction COMMITS
}`)}

<h3>Propagation: what happens when transactional methods call each other</h3>
<div class="table-wrap"><table>
<thead><tr><th>Propagation</th><th>Behaviour</th><th>Use for</th></tr></thead>
<tbody>
<tr><td><code>REQUIRED</code> (default)</td><td>Join the current transaction, or start one</td><td>Almost everything</td></tr>
<tr><td><code>REQUIRES_NEW</code></td><td>Suspend current, start an independent one on a <em>second connection</em></td><td>Audit logs that must survive a rollback</td></tr>
<tr><td><code>NESTED</code></td><td>Savepoint inside the current transaction</td><td>Partial rollback (JDBC only)</td></tr>
<tr><td><code>SUPPORTS</code> / <code>NOT_SUPPORTED</code> / <code>MANDATORY</code> / <code>NEVER</code></td><td>Join if present / run without / require one / forbid one</td><td>Rare</td></tr>
</tbody></table></div>
<p>A classic surprise: an inner <code>REQUIRED</code> method throws, the outer catches it and continues. On commit you get <code>UnexpectedRollbackException</code>, because the inner method already marked the shared transaction rollback-only.</p>

<h3>Isolation</h3>
<p>Isolation controls what concurrent transactions can see of each other. SQL Server and Postgres default to <code>READ_COMMITTED</code>. Stronger levels prevent more anomalies (non-repeatable reads, phantoms) at the cost of more locking or retries. For "read then update" races, prefer optimistic locking with a JPA <code>@Version</code> column.</p>

<h3>readOnly and long transactions</h3>
${J(String.raw`@Transactional(readOnly = true)    // Hibernate skips dirty checking; driver may route to replica
public List<LoanSummary> list() { ... }

@Transactional
public void bad(long id) {
    Loan l = repo.findById(id).orElseThrow();
    Rate r = rateClient.fetch(l.product());   // 2s HTTP call while holding a DB connection
    l.setRate(r.value());
}
// Fetch remote data first, outside the transaction, then open a short transaction.`)}

<h2>Check yourself</h2>
${Q("Two <code>@Transactional</code> methods in the same class; one calls the other with <code>REQUIRES_NEW</code>. Does it get a new transaction?","No. Self-invocation bypasses the proxy, so the annotation on the inner method is never seen. It runs inside the outer transaction. Move the inner method to another bean.")}
`});

T.push({
id:"sb-async", track:"spring", title:"@Async, @Scheduled & executors", since:"Spring 3", jep:null,
lede:"Run work on another thread or on a timer, with Spring managing the executors. Know which executor, and what the work loses by switching threads.",
html:`
<h2>Start from the problem</h2>
<p>Sending a confirmation email should not make the HTTP request wait. A nightly job to recalculate rates should not need cron outside the app. Both are "run this on another thread", with Spring handling the threads.</p>

<h2>@Async</h2>
${J(String.raw`@SpringBootApplication
@EnableAsync
@EnableScheduling
public class App { }

@Service
public class Notifier {
    @Async                                   // proxy submits the call to an executor
    public void sendConfirmation(Loan loan) { mail.send(...); }

    @Async("reportExecutor")                 // pick a specific executor bean
    public CompletableFuture<Report> build(long id) {
        return CompletableFuture.completedFuture(reports.generate(id));
    }
}`)}
<p>Since it is a proxy feature, the self-invocation rule applies: calling an <code>@Async</code> method from the same class runs it synchronously.</p>
<p>Spring Boot auto-configures a <code>ThreadPoolTaskExecutor</code> named <code>applicationTaskExecutor</code> (8 core threads, unbounded queue by default; tune with <code>spring.task.execution.pool.*</code>). With virtual threads enabled it uses a virtual-thread executor instead.</p>
${J(String.raw`spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=async-`)}

<h3>Exceptions</h3>
<p>For <code>void</code> methods, exceptions go to an <code>AsyncUncaughtExceptionHandler</code> (logs by default) and the caller never learns. Return a <code>CompletableFuture</code> if the caller must know.</p>

<h2>@Scheduled</h2>
${J(String.raw`@Scheduled(cron = "0 0 2 * * *", zone = "Europe/Amsterdam")   // 02:00 daily
public void recalculateRates() { ... }

@Scheduled(fixedDelayString = "PT5M")      // 5 min after previous run ENDS
public void syncPartners() { ... }

@Scheduled(fixedRate = 60_000)             // every 60 s measured from START; a slow run delays the next
public void heartbeat() { ... }`)}
<p>The default scheduler has <strong>one thread</strong> (<code>spring.task.scheduling.pool.size=1</code>). A slow job delays every other scheduled job. Increase the pool or hand long work to an executor.</p>
<p>In Kubernetes with three replicas, every pod runs every <code>@Scheduled</code> job. For "exactly one instance" you need a distributed lock such as ShedLock (a DB row lock), or move the job to a Kubernetes CronJob.</p>

<h2>Traps</h2>
<ul class="traps">
<li>No transaction, security context or MDC carries over to the async thread by default. Start a new <code>@Transactional</code> inside the async method if needed.</li>
<li>Passing a JPA entity to an <code>@Async</code> method and touching a lazy collection there throws <code>LazyInitializationException</code>: the session belonged to the caller's thread. Pass the id.</li>
<li>An unbounded queue hides overload until memory runs out. Set <code>queue-capacity</code>.</li>
</ul>
`});
</script>
<script>
const TRACKS = [
  {id:"java8",  name:"Java 8",               blurb:"The functional turn: lambdas, streams, Optional, the new date API and async composition."},
  {id:"java17", name:"Java 9 – 17",           blurb:"Less ceremony and better data modelling: var, records, sealed types, switch expressions."},
  {id:"java21", name:"Java 21",               blurb:"Virtual threads and full pattern matching. The biggest change to how Java servers are written in a decade."},
  {id:"threads",name:"Threads & concurrency", blurb:"What threads share, how visibility works, and the tools that keep shared state correct."},
  {id:"jvm",    name:"The JVM",               blurb:"From bytecode to native code: class loading, memory areas, garbage collection, JIT and diagnostics."},
  {id:"spring", name:"Spring Boot internals", blurb:"How the container, auto-configuration, proxies, transactions and request threads actually work."}
];
const order = TRACKS.flatMap(tr => T.filter(t => t.track === tr.id));
const byId = Object.fromEntries(order.map(t => [t.id, t]));
const plain = Object.fromEntries(order.map(t => [t.id, (t.title + " " + t.lede + " " + t.html.replace(/<[^>]+>/g," ")).toLowerCase()]));

const KEY = "jfg-done-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function saveDone(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} }

const $ = s => document.querySelector(s);
const view = $("#view"), tracksEl = $("#tracks"), qEl = $("#q");
let current = "start";

function renderIndex(){
  const q = qEl.value.trim().toLowerCase();
  let html = "", shown = 0;
  for (const tr of TRACKS){
    const items = order.filter(t => t.track === tr.id);
    const match = items.filter(t => !q || plain[t.id].includes(q));
    if (!match.length) continue;
    shown += match.length;
    const n = items.filter(t => done.has(t.id)).length;
    html += `<section class="track"><h3><span>${tr.name}</span><em>${n}/${items.length}</em></h3><ul>` +
      match.map(t => `<li><a href="#${t.id}" class="${done.has(t.id)?"done":""}" ${t.id===current?'aria-current="page"':""}><span class="dot" aria-hidden="true"></span><span>${esc(t.title)}</span></a></li>`).join("") +
      `</ul></section>`;
  }
  tracksEl.innerHTML = shown ? html : `<p class="empty-search">No lesson mentions “${esc(qEl.value)}”. Try a class or keyword, such as volatile or Hikari.</p>`;
  const total = order.length, d = order.filter(t => done.has(t.id)).length;
  $("#overallText").textContent = `${d} of ${total} lessons understood`;
  $("#overallBar").style.width = (total ? d/total*100 : 0) + "%";
}

function trackName(id){ return TRACKS.find(t => t.id === id).name; }

function renderStart(){
  const rel = [
    {v:"8", y:"2014", lts:1, id:"java8", h:"lambdas, streams"},
    {v:"11", y:"2018", lts:1, id:"j17-overview", h:"HttpClient, var"},
    {v:"17", y:"2021", lts:1, id:"java17", h:"records, sealed"},
    {v:"21", y:"2023", lts:1, id:"java21", h:"virtual threads"},
    {v:"25", y:"2025", lts:1, id:"j21-structured", h:"scoped values"}
  ];
  const W = 640, x0 = 50, step = (W - 2*x0) / (rel.length - 1);
  const svg = `<svg viewBox="0 0 ${W} 120" role="img" aria-label="Java LTS releases from 8 in 2014 to 25 in 2025">
    <line x1="${x0}" y1="52" x2="${W-x0}" y2="52"/>
    ${rel.map((r,i)=>{ const x = x0 + i*step; const target = TRACKS.some(t=>t.id===r.id) ? order.find(t=>t.track===r.id).id : r.id;
      return `<a href="#${target}"><text class="ver" x="${x}" y="30">Java ${r.v}</text><circle class="lts" cx="${x}" cy="52" r="7"/><text class="yr" x="${x}" y="78">${r.y} LTS</text><text class="hl" x="${x}" y="96">${r.h}</text></a>`; }).join("")}
  </svg>`;
  const cards = TRACKS.map(tr => `<div class="trackcard"><h3>${tr.name}</h3><p>${tr.blurb}</p><ol>${order.filter(t=>t.track===tr.id).map(t=>`<li><a href="#${t.id}">${esc(t.title)}</a></li>`).join("")}</ol></div>`).join("");
  view.innerHTML = `
    <div class="crumb"><span>Start here</span></div>
    <h1>Learn Java the way the JVM sees it</h1>
    <p class="lede">Every lesson starts from the problem a feature solves, builds the idea up from there, and only then shows the API.</p>
    <div class="prose">
      <p>The goal is not to memorise method names. It is to understand why each piece exists, so you can predict how it behaves in a case you have never seen, like a transaction that silently does nothing or a virtual thread that will not scale.</p>
      <div class="release">${svg}</div>
      <h2>How each lesson is built</h2>
      <div class="anatomy">
        <b>Start from the problem</b><span>What hurt before this existed, reduced to its core.</span>
        <b>Build it up</b><span>The idea derived step by step, with runnable code.</span>
        <b>Under the hood</b><span>What the compiler, JVM or Spring actually does.</span>
        <b>Traps</b><span>The mistakes this model predicts. Read them twice.</span>
        <b>Check yourself</b><span>Questions to answer before opening the answer.</span>
      </div>
      <p>Mark a lesson as understood when you can answer its questions without looking. Progress is saved in this browser only.</p>
      <h2>Suggested order</h2>
      <p>If you know Java 8 well, start with <a href="#threads-first">Threads &amp; concurrency</a>, because virtual threads, Spring's request model and <code>@Transactional</code> all depend on it. Then the JVM, then Java 17 and 21, then Spring Boot internals. The tracks are independent enough to jump around.</p>
    </div>
    <div class="trackgrid">${cards}</div>`;
  view.querySelector('a[href="#threads-first"]').setAttribute("href", "#th-basics");
}

function renderTopic(t){
  const i = order.indexOf(t), prev = order[i-1], next = order[i+1];
  const tags = [`<span class="tag">${esc(t.since)}</span>`].concat(t.jep ? [`<span class="tag jep">${esc(t.jep)}</span>`] : []).join("");
  const isDone = done.has(t.id);
  view.innerHTML = `
    <div class="crumb"><span>${trackName(t.track)}</span>${tags}</div>
    <h1>${esc(t.title)}</h1>
    <p class="lede">${t.lede}</p>
    <div class="prose">${t.html}</div>
    <div class="done-row"><button class="btn" id="doneBtn" type="button" aria-pressed="${isDone}">${isDone ? "Understood" : "Mark as understood"}</button><small>Lesson ${i+1} of ${order.length}</small></div>
    <nav class="pager" aria-label="Lesson navigation">
      ${prev ? `<a href="#${prev.id}"><span>Previous</span><b>${esc(prev.title)}</b></a>` : ""}
      ${next ? `<a class="next" href="#${next.id}"><span>Next</span><b>${esc(next.title)}</b></a>` : `<a class="next" href="#start"><span>Done</span><b>Back to start</b></a>`}
    </nav>`;
  if (typeof t.mount === "function") t.mount(view);
  $("#doneBtn").addEventListener("click", e => {
    if (done.has(t.id)) done.delete(t.id); else done.add(t.id);
    saveDone();
    const on = done.has(t.id);
    e.currentTarget.setAttribute("aria-pressed", on);
    e.currentTarget.textContent = on ? "Understood" : "Mark as understood";
    renderIndex();
  });
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1)) || "start";
  current = byId[id] ? id : "start";
  if (current === "start") renderStart(); else renderTopic(byId[current]);
  $("#topbarTitle").textContent = current === "start" ? "Start here" : byId[current].title;
  renderIndex();
  document.body.classList.remove("nav-open");
  $("#navBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}

view.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const el = document.getElementById(b.dataset.copy), text = el.textContent;
  const ok = () => { b.textContent = "Copied"; setTimeout(()=> b.textContent = "Copy", 1400); };
  try {
    navigator.clipboard.writeText(text).then(ok, () => selectText(el));
  } catch (err) { selectText(el); }
});
function selectText(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

qEl.addEventListener("input", renderIndex);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if (e.key === "Escape") document.body.classList.remove("nav-open");
});
$("#navBtn").addEventListener("click", () => {
  const open = document.body.classList.toggle("nav-open");
  $("#navBtn").setAttribute("aria-expanded", open);
});
document.addEventListener("click", e => {
  if (document.body.classList.contains("nav-open") && !e.target.closest("#index") && !e.target.closest("#navBtn")) document.body.classList.remove("nav-open");
});
window.addEventListener("hashchange", route);
route();
